des années 40 transformé par un sérum. Un bouclier, un sens du devoir sans faille."},{n:"Thor",h:205,d:"Dieu du tonnerre d'Asgard, porteur du marteau Mjolnir. Fier, puissant, et en train d'apprendre l'humilité."},{n:"Thanos",h:275,d:"Le Titan qui rêve de rassembler les Pierres d'Infinité. Une menace venue des confins de l'univers."},{n:"Ultron",h:195,d:"Intelligence artificielle créée pour protéger la Terre. Elle en tire une conclusion bien à elle."}],epique:[{n:"Hulk",h:125,d:"Le docteur Bruce Banner et son double de colère verte. Une force colossale, parfois difficile à contrôler."},{n:"Black Widow",h:350,d:"Natasha Romanoff, espionne d'élite au passé trouble. Redoutable au combat comme dans l'ombre."},{n:"Spider-Man",h:358,d:"Peter Parker, lycéen de Queens aux pouvoirs d'araignée. Le héros sympa du quartier qui rêve de grandes choses."},{n:"Black Panther",h:270,d:"T'Challa, roi du Wakanda et protecteur de son peuple. Costume en vibranium et honneur à toute épreuve."},{n:"Doctor Strange",h:12,d:"Ancien chirurgien de génie devenu Sorcier Suprême. Il veille sur la Terre face aux menaces mystiques."},{n:"Loki",h:140,d:"Dieu de la malice, frère adoptif de Thor. Charmeur, rusé, jamais là où on l'attend."},{n:"Star-Lord",h:18,d:"Peter Quill, pilleur de l'espace et chef des Gardiens de la Galaxie. Walkman, bagout et grands rêves."},{n:"Captain Marvel",h:42,d:"Carol Danvers, pilote devenue héroïne cosmique. L'une des plus puissantes protectrices de la galaxie."},{n:"Hela",h:160,d:"Déesse de la Mort au pouvoir effrayant. Son retour menace tout Asgard."},{n:"Red Skull",h:0,d:"Chef de l'Hydra, ambitieux et cruel. Il cherche un pouvoir qui ne devrait appartenir à personne."}],rare:[{n:"Hawkeye",h:265,d:"Clint Barton, archer sans superpouvoir mais d'une précision redoutable."},{n:"Scarlet Witch",h:348,d:"Wanda Maximoff, aux pouvoirs télékinésiques et mentaux qui dépassent ce qu'elle imagine."},{n:"Vision",h:48,d:"Intelligence artificielle née d'une Pierre d'Infinité. Calme, logique et étonnamment humain."},{n:"Winter Soldier",h:200,d:"Bucky Barnes, ami d'enfance de Steve devenu soldat de l'ombre. Un bras de métal et un passé trouble."},{n:"Falcon",h:6,d:"Sam Wilson, ancien militaire équipé d'ailes mécaniques. Loyal, drôle et toujours là pour ses amis."},{n:"Ant-Man",h:2,d:"Scott Lang, cambrioleur repenti capable de rétrécir ou de grandir à volonté."},{n:"Wasp",h:50,d:"Hope van Dyne, héroïne miniature volante. Agile, déterminée, et experte en combat."},{n:"Gamora",h:152,d:"Guerrière d'élite surnommée la femme la plus dangereuse de la galaxie. Elle trace sa propre route."},{n:"Rocket",h:26,d:"Raton laveur génétiquement modifié, as de la mécanique et des armes lourdes. Caractère explosif."},{n:"Groot",h:102,d:"Arbre extraterrestre au vocabulaire de trois mots. Solide, fidèle et étonnamment tendre."},{n:"Valkyrie",h:305,d:"Guerrière d'Asgard au passé lourd. Redoutable à l'épée, fidèle avant tout à sa liberté."},{n:"Yondu",h:232,d:"Capitaine des Ravageurs, archer à la flèche sifflante. Voleur, mais pas sans honneur."},{n:"Erik Killmonger",h:285,d:"Adversaire ambitieux et déterminé venu bouleverser l'ordre du Wakanda."},{n:"The Ancient One",h:55,d:"Maîtresse des arts mystiques et mentor de Doctor Strange. Sage, mystérieuse et redoutable."},{n:"Vulture",h:118,d:"Marchand d'armes en exosquelette ailé. Un adversaire de quartier pour le jeune Spider-Man."}],commune:[{n:"Nick Fury",h:222,d:"Directeur du S.H.I.E.L.D. et créateur de l'initiative Avengers. Toujours un plan d'avance."},{n:"Pepper Potts",h:356,d:"Directrice de Stark Industries et pilier de la vie de Tony. Elle ne se laisse jamais impressionner."},{n:"Happy Hogan",h:36,d:"Chauffeur puis responsable de la sécurité de Tony Stark. Fidèle, bougon et dévoué."},{n:"Peggy Carter",h:345,d:"Agente britannique de la Réserve scientifique stratégique, cofondatrice du S.H.I.E.L.D."},{n:"Maria Hill",h:212,d:"Bras droit de Nick Fury au S.H.I.E.L.D. Calme et efficace sous la pression."},{n:"Drax",h:188,d:"Guerrier qui prend tout au pied de la lettre. Redoutable au combat, nul pour les métaphores."},{n:"Nebula",h:208,d:"Mercenaire cyborg à la peau bleue, élevée comme une arme. En quête de sa propre place."},{n:"Wong",h:176,d:"Gardien de la bibliothèque de Kamar-Taj et maître des arts mystiques. Sérieux, mais pas sans humour."},{n:"Okoye",h:4,d:"Générale des Dora Milaje, la garde royale du Wakanda. Lance en main, loyauté inébranlable."},{n:"Shuri",h:168,d:"Princesse du Wakanda et prodige technologique. L'esprit brillant derrière les innovations du royaume."},{n:"Phil Coulson",h:235,d:"Agent du S.H.I.E.L.D., sérieux et dévoué. Le plus grand fan des Avengers."},{n:"Heimdall",h:46,d:"Gardien du Bifröst, il voit tout dans les neuf royaumes. Calme et vigilant."},{n:"Odin",h:210,d:"Roi d'Asgard et père de Thor. Sage, puissant et parfois sévère."},{n:"Jane Foster",h:330,d:"Astrophysicienne brillante, curieuse de tout. Sa rencontre avec Thor bouleverse son quotidien."},{n:"Korg",h:95,d:"Gladiateur de pierre à l'accent tranquille. Toujours calme, même en pleine bataille."},{n:"Mantis",h:130,d:"Empathe aux antennes, douce et timide. Elle ressent les émotions des autres."},{n:"Hank Pym",h:245,d:"Scientifique à l'origine de la technologie Pym. Brillant, têtu et protecteur."},{n:"Ned Leeds",h:70,d:"Meilleur ami de Peter Parker et fan de Lego. Enthousiaste et loyal."}]},HAIKYUU_TEMPLATE={key:"haikyuu",hue:28,name:"Haikyu!!",legendaire:[{n:"Shoyo Hinata",h:28,d:"Petit par la taille, immense par l'envie. Le central de Karasuno qui saute plus haut que tout le monde."},{n:"Tobio Kageyama",h:222,d:"Passeur prodige de Karasuno, surnommé le Roi du terrain. Une précision hors norme et un caractère intense."},{n:"Tooru Oikawa",h:188,d:"Capitaine et passeur d'Aoba Johsai. Service redoutable, charme redoutable, rivalité féroce."},{n:"Wakatoshi Ushijima",h:275,d:"As de Shiratorizawa et l'un des meilleurs attaquants du pays. Puissance et calme impressionnants."}],epique:[{n:"Kei Tsukishima",h kurodani, discret et précis. Il sait exactement comment motiver son as."},{n:"Satori Tendo",h:290,d:"Central de Shiratorizawa, surnommé le Guess Monster. Il devine presque chaque attaque."},{n:"Atsumu Miya",h:305,d:"Passeur d'Inarizaki, talentueux et exigeant. Il vise toujours la passe parfaite."},{n:"Osamu Miya",h:320,d:"Ailier d'Inarizaki et jumeau d'Atsumu. Plus posé, mais tout aussi têtu."},{n:"Kiyoomi Sakusa",h:155,d:"As d'Itachiyama, grand, puissant et très exigeant envers lui-même."},{n:"Lev Haiba",h:340,d:"Central de Nekoma, très grand et plein d'énergie. Il apprend vite, et ça se voit."},{n:"Shinsuke Kita",h:205,d:"Capitaine d'Inarizaki, la discipline incarnée. Chaque geste est travaillé avec soin."},{n:"Tsutomu Goshiki",h:280,d:"Jeune ailier de Shiratorizawa, plein de fougue. Il apprend à son rythme pour devenir un as."},{n:"Shigeru Yahaba",h:168,d:"Passeur d'Aoba Johsai, déterminé à se faire un nom sur le terrain."},{n:"Rintaro Suna",h:250,d:"Central d'Inarizaki, décontracté et malin. Son bloc surprend souvent l'adversaire."},{n:"Motoya Komori",h:140,d:"Libéro d'Itachiyama et cousin de Sakusa. Calme, solide et de bonne humeur."},{n:"Takanobu Aone",h:215,d:"Central de Date Tech, grand mur silencieux. Son bloc est l'un des plus redoutés."},{n:"Chikara Ennoshita",h:25,d:"Ailier de Karasuno, calme et fiable. Un équipier sur qui on peut toujours compter."},{n:"Kanji Koganegawa",h:300,d:"Jeune passeur de Date Tech, grand, enthousiaste et très énergique."},{n:"Shinji Watari",h:75,d:"Libéro d'Aoba Johsai, fiable en défense. Il assure la réception derrière les vedettes de l'équipe."},{n:"Shohei Fukunaga",h:345,d:"Ailier de Nekoma, silencieux et imperturbable. Ses attaques surprennent par leur calme."},{n:"Sou Inuoka",h:85,d:"Ailier de Nekoma, plein d'énergie. Il adore les défis et progresse à vue d'œil."},{n:"Reon Ohira",h:105,d:"Joueur de Shiratorizawa, solide et sérieux. Il tient sa place sans jamais fléchir."},{n:"Michinari Akagi",h:65,d:"Joueur d'Inarizaki, dé
