function renderBtAdmin(){
  app.innerHTML = `
    <div class="page">
      ${navHtml('games','creator')}
      <button class="back" id="backBt">← retour aux jeux</button>
      <div class="logo" style="margin-bottom:20px;">
        <h1 style="font-size:26px;">BIBLIOTHÈQUE MUSICALE</h1>
      </div>
      <div class="twitchbox" style="max-width:480px;margin-bottom:24px;">
        <label>Titre précis à deviner</label>
        <input type="text" id="btTitle" placeholder="ex : My Hero Academia - Odd Future">
        <label>Nom de l'anime / série / film</label>
        <input type="text" id="btAnimeName" placeholder="ex : My Hero Academia">
        <label>Raccourcis pour ce nom (optionnel)</label>
        <input type="text" id="btAliases" placeholder="ex : mha, my hero">
        <div class="row2">
          <div style="flex:1;">
            <label>Catégorie</label>
            <select class="selectBox" id="btCategory" style="width:100%;">
              ${BT_CATEGORIES.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
            </select>
          </div>
          <div style="flex:1;">
            <label>Difficulté</label>
            <select class="selectBox" id="btDifficulty" style="width:100%;">
              ${BT_DIFFICULTIES.map(d => `<option value="${escapeHtml(d)}" ${d==='Normal'?'selected':''}>${escapeHtml(d)}</option>`).join('')}
            </select>
          </div>
        </div>
        <label style="margin-top:14px;">Fichier audio ou vidéo</label>
        <div class="btDropzone" id="btDropzone">
          <div id="btDropText">Glisse ton fichier ici<br><span style="opacity:0.6;">ou clique pour parcourir</span></div>
          <input type="file" id="btFile" accept="audio/*,video/mp4,video/*" style="display:none;">
        </div>
        <div class="hint" id="btUploadStatus" style="min-height:16px;"></div>
        <button class="btn primary" id="btAddBtn" style="width:100%;margin-top:10px;">+ Ajouter à la bibliothèque</button>
      </div>
      <div class="sectionLabel" style="margin-top:0;">Musiques ajoutées (<span id="btCount">${btTracks.length}</span>)</div>
      <div class="btTrackList" id="btTrackList"></div>
      <div class="sectionLabel">Playlists par anime/série/film</div>
      <div id="btPlaylistList"></div>
    </div>
  `;
  wireNav('creator');
  document.getElementById('backBt').onclick = () => setMode('games');
  drawBtTrackList();
  drawBtPlaylistList();

  const MAX_BT_SIZE = 50 * 1024 * 1024; // 50 Mo (limite du plan gratuit Supabase)
  let pendingFile = null;
  const dropzone = document.getElementById('btDropzone');
  const fileInput = document.getElementById('btFile');
  const dropText = document.getElementById('btDropText');
  const statusEl0 = document.getElementById('btUploadStatus');

  function handlePickedFile(file){
    if(!file) return;
    if(file.size > MAX_BT_SIZE){
      const mo = (file.size / (1024*1024)).toFixed(1);
      statusEl0.style.color = 'var(--rate-red)';
      statusEl0.textContent = `Fichier trop lourd (${mo} Mo) — 50 Mo maximum. Raccourcis l'extrait à 15-30 secondes.`;
      pendingFile = null;
      dropText.innerHTML = 'Glisse ton fichier ici<br><span style="opacity:0.6;">ou clique pour parcourir</span>';
      return;
    }
    statusEl0.textContent = '';
    pendingFile = file;
    dropText.innerHTML = `✓ ${escapeHtml(file.name)}<br><span style="opacity:0.6;">(${(file.size/(1024*1024)).toFixed(1)} Mo) — clique pour changer</span>`;
  }

  dropzone.onclick = () => fileInput.click();
  fileInput.onchange = (e) => handlePickedFile(e.target.files[0] || null);
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    handlePickedFile(file);
  });

  document.getElementById('btAddBtn').onclick = async () => {
    const title = document.getElementById('btTitle').value.trim();
    const category = document.getElementById('btCategory').value;
    const statusEl = document.getElementById('btUploadStatus');
    if(!title){ statusEl.style.color = 'var(--rate-red)'; statusEl.textContent = 'Ajoute un titre.'; return; }
    if(!pendingFile){ statusEl.style.color = 'var(--rate-red)'; statusEl.textContent = 'Choisis un fichier audio.'; return; }
    statusEl.style.color = 'var(--text-dim)';
    statusEl.textContent = 'Envoi en cours...';
    const path = `${Date.now()}-${pendingFile.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const { error: upErr } = await supabaseClient.storage.from(BT_BUCKET).upload(path, pendingFile);
    if(upErr){
      statusEl.style.color = 'var(--rate-red)';
      statusEl.textContent = 'Erreur : ' + upErr.message;
      return;
    }
    const { data: urlData } = supabaseClient.storage.from(BT_BUCKET).getPublicUrl(path);
    await loadBtTracks();
    const mediaType = pendingFile.type.startsWith('video') ? 'video' : 'audio';
    const animeName = document.getElementById('btAnimeName').value.trim();
    const aliases = document.getElementById('btAliases').value.split(',').map(a=>a.trim()).filter(Boolean);
    const difficulty = document.getElementById('btDifficulty').value;
    btTracks.push({id:'bt-'+Math.random().toString(36).slice(2,10), title, animeName, category, audioUrl: urlData.publicUrl, path, mediaType, aliases, difficulty});
    await saveBtTracks();
    statusEl.style.color = 'var(--rate-green)';
    statusEl.textContent = '✓ Ajouté !';
    document.getElementById('btTitle').value = '';
    document.getElementById('btAnimeName').value = '';
    document.getElementById('btAliases').value = '';
    document.getElementById('btFile').value = '';
    pendingFile = null;
    dropText.innerHTML = 'Glisse ton fichier ici<br><span style="opacity:0.6;">ou clique pour parcourir</span>';
    drawBtTrackList();
  };
}

function drawBtTrackList(){
  const wrap = document.getElementById('btTrackList');
  if(!wrap) return;
  const countEl = document.getElementById('btCount');
  if(countEl) countEl.textContent = btTracks.length;
  if(btTracks.length === 0){
    wrap.innerHTML = `<div class="empty"><div>Aucune musique ajoutée pour l'instant.</div></div>`;
    return;
  }
  wrap.innerHTML = btTracks.map(t => `
    <div class="btTrackRow">
      <span class="cat">${escapeHtml(t.category)}</span>
      <span class="cat" style="color:${t.difficulty==='Facile'?'var(--rate-green)':t.difficulty==='Difficile'?'var(--rate-red)':'var(--mustard)'};border-color:currentColor;">${escapeHtml(t.difficulty||'Normal')}</span>
      <span class="cat" style="color:var(--text-dim);border-color:var(--border);">${t.mediaType === 'video' ? 'Vidéo' : 'Audio'}</span>
      <span class="t">${escapeHtml(t.title)}</span>
      <button class="del editIconBtn" id="edit-${t.id}" title="Modifier">✎</button>
      <button class="del" data-id="${t.id}">✕</button>
    </div>
  `).join('');
  wrap.querySelectorAll('[id^="edit-"]').forEach(b => {
    b.onclick = () => openBtEditTrack(b.id.replace('edit-', ''));
  });
  wrap.querySelectorAll('.del[data-id]').forEach(b => {
    b.onclick = async () => {
      await loadBtTracks();
      const track = btTracks.find(t => t.id === b.dataset.id);
      if(track && track.path){
        try{ await supabaseClient.storage.from(BT_BUCKET).remove([track.path]); }catch(e){}
      }
      btTracks = btTracks.filter(t => t.id !== b.dataset.id);
      await saveBtTracks();
      drawBtTrackList();
    };
  });
}

function drawBtPlaylistList(){
  const wrap = document.getElementById('btPlaylistList');
  if(!wrap) return;
  const groups = getBtPlaylistGroups();
  if(groups.length === 0){
    wrap.innerHTML = `<div class="empty" style="padding:20px 14px;"><div>Ajoute des musiques pour voir apparaître des playlists.</div></div>`;
    return;
  }
  wrap.innerHTML = groups.map(g => {
    const enabled = isPlaylistEnabled(g.name);
    return `
      <div class="btTrackRow">
        <span class="t">${escapeHtml(g.name)} <span style="color:var(--text-dim);font-size:11px;">— ${g.tracks.length} piste${g.tracks.length>1?'s':''}</span></span>
        <button class="pill" id="plToggle-${escapeHtml(g.name)}" style="color:${enabled?'var(--rate-green)':'var(--text-dim)'};">${enabled ? '✓ Activée' : '✕ Désactivée'}</button>
      </div>
    `;
  }).join('');
  groups.forEach(g => {
    const btn = document.getElementById(`plToggle-${g.name}`);
    if(btn) btn.onclick = async () => {
      await loadBtPlaylists();
      btPlaylists[g.name] = !isPlaylistEnabled(g.name);
      await saveBtPlaylists();
      drawBtPlaylistList();
    };
  });
}

          <button class="btn primary" id="saveBtEditBtn">Enregistrer</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') closeModal(); };
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('saveBtEditBtn').onclick = async () => {
    const newTitle = document.getElementById('editBtTitle').value.trim();
    if(!newTitle) return;
    const animeName = document.getElementById('editBtAnimeName').value.trim();
    const aliases = document.getElementById('editBtAliases').value.split(',').map(a=>a.trim()).filter(Boolean);
    const category = document.getElementById('editBtCategory').value;
    const difficulty = document.getElementById('editBtDifficulty').value;
    await loadBtTracks();
    const fresh = btTracks.find(t => t.id === id);
    if(fresh){
      fresh.title = newTitle;
      fresh.animeName = animeName;
      fresh.aliases = aliases;
      fresh.category = category;
      fresh.difficulty = difficulty;
    }
    await saveBtTracks();
    closeModal();
    drawBtTrackList();
  };
}

function btPlayerRows(){
  const list = Object.entries(btGame.players || {}).sort((a,b) => (b[1].score||0) - (a[1].score||0));
  if(list.length === 0) return `<div class="empty" style="padding:24px 18px;"><div>Personne n'a encore rejoint.</div></div>`;
  return list.map(([key,p]) => `

          ? (p.answered ? '✓ a répondu' : '…')
          : (btGame.status==='revealed' && p.answered ? `${p.lastCorrect ? '✓' : '✗'} « ${escapeHtml(p.lastAnswerText||'')} »${p.lastPoints ? ' +'+p.lastPoints+' pts' : ''}`
            : (btGame.status==='finished' && btGame.payouts && btGame.payouts[key] !== undefined ? `${(btGame.winners||[]).includes(key) ? 'Victoire · ' : ''}+${btGame.payouts[key]} ${WATCH_CURRENCY}` : ''))}
      </span>

    </div>
  `).join('');
}

/* fin d'un blind test : classement par score (égalités gérées), victoire = 1 point, Ryos selon la place */
async function finalizeBtGame(){
  await loadBtGame();
  if(btGame.payoutsDone){ btGame.status = 'finished'; await saveBtGame(); return; }
  const creatorKey = (viewerName || '').toLowerCase();
  const entries = Object.entries(btGame.players || {})
    .filter(([k, p]) => k !== creatorKey && ((p.played || 0) > 0 || (p.score || 0) > 0))
    .sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
  const cfg = payoutSettings();
  const payouts = {}, places = {}, winners = [];
  let place = 0, prev = null;
  entries.forEach(([k, p], i) => {
    const sc = p.score || 0;
    if(sc !== prev){ place = i + 1; prev = sc; }
    places[k] = place;
    payouts[k] = sc > 0 ? payoutForPlace(place, cfg) : cfg.other;      // 0 point = simple participation
    if(place === 1 && sc > 0) winners.push(k);
  });
  btGame.status = 'finished';
  btGame.payoutsDone = true; btGame.payouts = payouts; btGame.places = places; btGame.winners = winners;
  await saveBtGame();
  for(const [k, amount] of Object.entries(payouts)) await grantRyos(k, btGame.players[k].display, amount);
  await addWins(winners);
}

function drawBt(inCreator){

  if(!wrap){ stopBtPoll(); clearInterval(btTimerTick); if(btMediaEl) btMediaEl.pause(); return; }
  const g = btGame;

    if(inCreator){
      const selectedCats = new Set(BT_CATEGORIES);

      wrap.querySelectorAll('#btCatGrid .btCatChip').forEach(chip => {

          else { selectedCats.add(c); chip.classList.add('selected'); }
          updatePoolCount();
        };
      });
      wrap.querySelectorAll('#btDiffGrid .btCatChip').forEach(chip => {
        chip.onclick = () => {
          const d = chip.dataset.diff;
          if(selectedDiffs.has(d)){ selectedDiffs.delete(d); chip.classList.remove('selected'); }
          else { selectedDiffs.add(d); chip.classList.add('selected'); }
          updatePoolCount();
        };
      });
      updatePoolCount();

        if(fullPool.length < 4){ alert('Pas assez de musiques pour cette sélection (4 minimum).'); return; }

      <div class="tag" style="margin-bottom:4px;">Difficulté : ${(g.difficulties||[]).map(escapeHtml).join(', ')}</div>

      ` : (joined ? `<div class="hint">Tu es dans le lobby ! En attente du lancement...</div>` : `

      btLocalRoundStartedAt = Date.now();

      <div class="btPlayerBox">
        <div class="tag" style="margin-bottom:6px;">Round ${g.round}/${g.roundsTotal||'?'} · ${answeredCount}/${totalPlayers} ont répondu</div>
        <div class="btTimer" id="btTimerDisplay" style="color:${remainingNow<=10?'var(--rate-red)':'var(--gold)'};">${remainingNow}s</div>
        <div class="btMediaStage" id="btMediaSlot">
          <div class="btBlackCover" id="btBlackCover"></div>
        </div>
        ${(!btSoundUnlocked && !inCreator) ? `<button class="btUnlockBtn" id="btUnlock">Activer le son</button>` : ''}
        ${(btSoundUnlocked && !inCreator) ? `
          <div class="btVolumeRow">
            <span class="hint" style="margin:0;">Volume</span>
            <input type="range" id="btVolumeSlider" min="0" max="100" value="${Math.round(btVolume*100)}">
            
          </div>

          <button class="btn ghost" id="btReveal" style="width:100%;max-width:260px;margin:14px auto 0;display:block;">Révéler la réponse</button>

        ` : me && me.answered ? `<div class="hint">✓ Réponse envoyée, en attente des autres...</div>` : (me && timedOut ? `<div class="hint" style="color:var(--rate-red);">Temps écoulé !</div>` : `<div class="hint">Tu n'as pas rejoint cette partie.</div>`))}

    if(volumeSlider) volumeSlider.addEventListener('input', () => {

      const guessInput = document.getElementById('btGuessInput');
      const suggBox = document.getElementById('btSuggestions');
      if(guessInput){
        const poolTracks = btTracks.filter(t => (g.categories||[]).includes(t.category));
        // une seule entrée par piste : texte "titre" (plein tarif) + texte "large" (nom d'anime/raccourcis/catégorie, x0.5)
        const trackEntries = poolTracks.map(t => {
          const anime = impliedAnimeName(t);
          const fullText = stripAccents((t.title||'').toLowerCase());
          const wideText = stripAccents([anime, ...(t.aliases||[]), t.category, t.title].filter(Boolean).join(' ').toLowerCase());
          return {title: t.title, fullText, wideText};
        });
        const renderSuggestions = (q) => {
          if(!q){ suggBox.innerHTML = ''; return; }
          const tokens = q.split(/\s+/).filter(Boolean);
          const results = [];
          trackEntries.forEach(e => {
            const inFull = tokens.every(tok => e.fullText.includes(tok));
            const inWide = tokens.every(tok => e.wideText.includes(tok));
            if(inFull) results.push({title: e.title, tier: 'full'});
            else if(inWide) results.push({title: e.title, tier: 'partial'});
          });
          suggBox.innerHTML = results.slice(0,20).map(r => `
            <div class="btSuggestItem" data-t="${escapeHtml(r.title)}" data-tier="${r.tier}">
              ${escapeHtml(r.title)}
            </div>
          `).join('');
          suggBox.querySelectorAll('.btSuggestItem').forEach(item => {
            item.onclick = () => submitBtAnswer(item.dataset.t, inCreator);
          });
        };
        guessInput.addEventListener('input', () => {
          btDraftAnswer = guessInput.value;
          renderSuggestions(stripAccents(guessInput.value.trim().toLowerCase()));
        });
        guessInput.addEventListener('keydown', (e) => {
          if(e.key === 'Enter'){
            const val = guessInput.value.trim();
            if(val) submitBtAnswer(val, inCreator);
          }
        });
        const validateBtn = document.getElementById('btValidateBtn');
        if(validateBtn) validateBtn.onclick = () => {
          const val = guessInput.value.trim();
          if(val) submitBtAnswer(val, inCreator);
        };
        // restaure le brouillon (suggestions + position du curseur) après un rafraîchissement
        if(btDraftAnswer){
          renderSuggestions(stripAccents(btDraftAnswer.trim().toLowerCase()));
        }
        if(document.activeElement !== guessInput){
          guessInput.focus();
          const len = guessInput.value.length;
          guessInput.setSelectionRange(len, len);
        }
      }
    }

    clearInterval(btTimerTick);
    if(btLocalRoundStartedAt){
      const startedAt = btLocalRoundStartedAt;
      btTimerTick = setInterval(() => {
        const timerEl = document.getElementById('btTimerDisplay');
        if(!timerEl){ clearInterval(btTimerTick); return; }
        const elapsed = (Date.now() - startedAt) / 1000;
        const remaining = Math.max(0, Math.ceil((g.timerSeconds||30) - elapsed));
        timerEl.textContent = `${remaining}s`;
        timerEl.style.color = remaining <= 10 ? 'var(--rate-red)' : 'var(--gold)';

          clearInterval(btTimerTick);
          if(inCreator){
            revealBtRound(inCreator);
          } else {
            const guessBox = document.getElementById('btGuessBox');
            if(guessBox){
              guessBox.outerHTML = '<div class="hint" style="color:var(--rate-red);">Temps écoulé !</div>';

  if(g.status === 'revealed'){

    wrap.innerHTML = `
      <div class="winnerBanner" style="padding:24px 20px;">

      <div class="sectionLabel">Résultats de la manche</div>
      <div id="btPlayers">${btPlayerRows()}</div>
      ${inCreator ? `
        <div class="modalbtns" style="margin-top:16px;">

    `;
    if(isVideo && btMediaEl){
      const slot = document.getElementById('btRevealVideoSlot');
      if(slot){
        btMediaEl.style.width = '100%';
        btMediaEl.style.height = 'auto';
        btMediaEl.style.objectFit = 'contain';

        if(!slot.contains(btMediaEl)) slot.appendChild(btMediaEl);
        if(btMediaEl.dataset.revealedFor !== g.currentTrack.id){
          btMediaEl.dataset.revealedFor = g.currentTrack.id;
          // ne pas toucher currentTime : la vidéo continue là où elle en était pendant la manche

      }
    } else if(btMediaEl){
      btMediaEl.pause();
    }
    if(inCreator){
      document.getElementById('btFinish').onclick = async () => {
        await finalizeBtGame();
        drawBt(inCreator);
      };
      const nb = document.getElementById('btNextRound');
      if(nb) nb.onclick = () => startBtRound(inCreator);
    }
    return;
  }

  if(g.status === 'finished'){
    wrap.innerHTML = `
      <div class="sectionLabel" style="margin-top:0;">Classement final du blind test</div>
      <div id="btPlayers">${btPlayerRows()}</div>
      ${inCreator ? `<button class="btn primary" id="btNewBt" style="width:100%;margin-top:16px;">Nouveau blind test</button>` : ''}
    `;
    if(inCreator){
      document.getElementById('btNewBt').onclick = async () => {
        btGame = {status:'idle', categories:[], pool:[], currentTrack:null, options:null, playStartedAt:null, players:{}, round:0};
        await saveBtGame();
        drawBt(inCreator);
      };
    }
  }
}

async function startBtRound(inCreator){
  await loadBtGame();
  await loadBtTracks();
  if(!btGame.pool || btGame.pool.length === 0){
    await finalizeBtGame();
    drawBt(inCreator);
    return;
  }
  const idx = Math.floor(Math.random()*btGame.pool.length);
  const trackId = btGame.pool[idx];
  btGame.pool = btGame.pool.filter(id => id !== trackId);
  const track = btTracks.find(t => t.id === trackId);
  if(!track){ await saveBtGame(); drawBt(inCreator); return; }

  Object.values(btGame.players).forEach(p => { p.answered = false; p.lastCorrect = null; p.lastPoints = 0; });
  btGame.currentTrack = {
    id: track.id, title: track.title, animeName: track.animeName||'', category: track.category,
    audioUrl: track.audioUrl, mediaType: track.mediaType||'audio', difficulty: track.difficulty||'Normal'
  };
  btGame.playStartedAt = Date.now();
  btGame.status = 'playing';
  btGame.round = (btGame.round||0) + 1;
  await saveBtGame();
  drawBt(inCreator);
}

let btSubmitLock = false;
async function submitBtAnswer(rawText, inCreator){
  if(btSubmitLock) return;
  if(!rawText || !rawText.trim()) return;
  btSubmitLock = true;
  try{
    await loadBtGame();
    const key = (viewerName||'').toLowerCase();
    const me = btGame.players[key];
    if(!me || me.answered || btGame.status !== 'playing'){ drawBt(inCreator); return; }
    const track = btGame.currentTrack;
    const trackFull = btTracks.find(t => t.id === track.id) || {};
    const anime = impliedAnimeName(trackFull) || track.animeName || '';
    const tokens = stripAccents((rawText||'').trim().toLowerCase()).split(/\s+/).filter(Boolean);
    const fullText = stripAccents((track.title||'').toLowerCase());
    const wideText = stripAccents([anime, ...(trackFull.aliases||[]), track.category, track.title].filter(Boolean).join(' ').toLowerCase());

    let tier = null;
    if(tokens.length && tokens.every(tok => fullText.includes(tok))) tier = 'full';
    else if(tokens.length && tokens.every(tok => wideText.includes(tok))) tier = 'partial';
    const correct = tier !== null;

    const elapsed = btLocalRoundStartedAt ? (Date.now() - btLocalRoundStartedAt) / 1000 : 0;
    let points = 0;
    if(correct){
      const timer = btGame.timerSeconds || 30;
      const decayRate = 100 / timer;
      const base = Math.max(0, 100 - elapsed*decayRate);
      const diff = track.difficulty || 'Normal';
      const diffMult = diff === 'Difficile' ? 1.75 : diff === 'Normal' ? 1.25 : 1;
      const tierMult = tier === 'partial' ? 0.5 : 1;
      points = Math.max(20, Math.round(base * diffMult * tierMult));
    }
    me.answered = true;
    me.lastCorrect = correct;
    me.lastPoints = points;
  me.lastAnswerText = rawText;
  btDraftAnswer = '';
    me.score = (me.score||0) + points;
    me.played = (me.played || 0) + 1;
    await saveBtGame();
    drawBt(inCreator);
  } finally {
    btSubmitLock = false;
  }
}

function polarToCartesian(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180.0;
  return {x: cx + r * Math.cos(a), y: cy + r * Math.sin(a)};
}
function describeArc(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x} ${end.y} Z`;
}
function truncateLabel(s, n){
  s = s || '';
  return s.length > n ? s.slice(0, n-1) + '…' : s;
}
function buildWheelSVG(wItems){
  const size = 300, cx = size/2, cy = size/2, r = size/2 - 4;
  const n = wItems.length;
  const segAngle = 360 / n;
  const palette = ['#e6b325','#c99a1e','#8a6a15','#f0d060','#b8860b','#9146ff','#d4af37'];
  let paths = '', texts = '';
  wItems.forEach((it, i) => {
    const start = i*segAngle, end = start+segAngle;
    const color = palette[i % palette.length];
    paths += `<path d="${describeArc(cx,cy,r,start,end)}" fill="${color}" stroke="#071a17" stroke-width="1.5"/>`;
    const mid = start + segAngle/2;
    const tx = polarToCartesian(cx, cy, r*0.62, mid);
    texts += `<text x="${tx.x}" y="${tx.y}" fill="var(--ink)" font-size="10" font-family="Space Grotesk, sans-serif" font-weight="700" text-anchor="middle" transform="rotate(${mid}, ${tx.x}, ${tx.y})">${escapeHtml(truncateLabel(it.label,16))}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%">${paths}${texts}</svg>`;
}

async function startUcGame(inCreator){
  await loadUc();
  const keys = Object.keys(ucGame.players);
  const shuffled = keys.slice().sort(() => Math.random()-0.5);
  const numUndercover = Math.min(ucGame.numUndercover, Math.max(1, Math.floor(shuffled.length/3)));
  const mrWhiteKey = ucGame.includeMrWhite ? shuffled[0] : null;
  const undercoverKeys = shuffled.slice(mrWhiteKey ? 1 : 0, (mrWhiteKey?1:0) + numUndercover);

  shuffled.forEach(k => {
    const p = ucGame.players[k];
    if(k === mrWhiteKey){ p.role = 'mrwhite'; p.word = ''; }
    else if(undercoverKeys.includes(k)){ p.role = 'undercover'; p.word = ucGame.undercoverWord; }
    else { p.role = 'civilian'; p.word = ucGame.civilianWord; }
    p.alive = true;
  });

  ucGame.status = 'playing';
  ucGame.round = 1;
  ucGame.votes = {};
  ucGame.lastElimination = null;
  await saveUc();
  drawUc(inCreator);
}

async function castUcVote(targetKey, inCreator){
  await loadUc();
  const key = (viewerName||'').toLowerCase();
  const me = ucGame.players[key];
  if(!me || !me.alive || ucGame.status !== 'voting') { drawUc(inCreator); return; }
  if(!ucGame.votes) ucGame.votes = {};
  ucGame.votes[key] = targetKey;
  await saveUc();
  drawUc(inCreator);
}

function ucCheckWinner(){
  const alive = ucAlivePlayers();
  const civ = alive.filter(([,p]) => p.role === 'civilian').length;
  const bad = alive.filter(([,p]) => p.role !== 'civilian').length;
  if(bad === 0) return 'civilians';
  if(bad >= civ) return 'undercover';
  return null;
}

/* fin d'une partie d'Undercover : le camp gagnant reçoit la 1re place et 1 victoire, les autres la participation */
async function finalizeUcGame(){
  if(ucGame.payoutsDone) return;
  const creatorKey = (viewerName || '').toLowerCase();
  const win = ucGame.winner;
  const isWinner = (p) => win === 'civilians' ? p.role === 'civilian' : (win === 'undercover' ? (p.role === 'undercover' || p.role === 'mrwhite') : p.role === 'mrwhite');
  const cfg = payoutSettings();
  const payouts = {}, winners = [];
  Object.entries(ucGame.players || {}).forEach(([k, p]) => {
    if(k === creatorKey) return;
    if(isWinner(p)){ payouts[k] = cfg.first; winners.push(k); } else payouts[k] = cfg.other;
  });
  ucGame.payoutsDone = true; ucGame.payouts = payouts; ucGame.winners = winners;
  await saveUc();
  for(const [k, amount] of Object.entries(payouts)) await grantRyos(k, ucGame.players[k].display, amount);
  await addWins(winners);
}

async function closeUcVote(inCreator){
  await loadUc();
  const tally = {};
  Object.values(ucGame.votes||{}).forEach(v => { tally[v] = (tally[v]||0) + 1; });
  let topKey = null, topCount = -1;
  Object.entries(tally).forEach(([k,c]) => { if(c > topCount){ topCount = c; topKey = k; } });
  if(!topKey){ ucGame.status = 'playing'; await saveUc(); drawUc(inCreator); return; }

  const eliminated = ucGame.players[topKey];
  eliminated.alive = false;
  ucGame.eliminatedHistory.push({key:topKey, display:eliminated.display, role:eliminated.role});
  ucGame.lastElimination = {display:eliminated.display, role:eliminated.role};

  if(eliminated.role === 'mrwhite'){
    const guessed = confirm(`${eliminated.display} était Mr White. A-t-il/elle deviné le mot des civils (« ${ucGame.civilianWord} ») ?`);
    if(guessed){
      ucGame.status = 'ended';
      ucGame.winner = 'mrwhite';
      await finalizeUcGame();
      drawUc(inCreator);
      return;
    }
  }

  const winner = ucCheckWinner();
  if(winner){
    ucGame.status = 'ended';
    ucGame.winner = winner;
    await finalizeUcGame();
  } else {
    ucGame.status = 'playing';
    ucGame.round += 1;
    ucGame.votes = {};
  }
  await saveUc();
  drawUc(inCreator);
}

    listEl.innerHTML = `<div class="empty" style="padding:30px 18px;"><div>${inCreator ? "Ajoute au moins 2 titres pour pouvoir tourner la roue." : "Le créateur n'a pas encore ajouté de titres à la roue."}</div></div>`;
  } else {
    listEl.innerHTML = wheelItems.map(it => `
      <div class="wheelListItem">
        <span class="wlLabel">${escapeHtml(it.label)}</span>
        ${inCreator ? `<button class="wlDel" data-id="${it.id}">✕</button>` : ''}
      </div>
    `).join('');
    if(inCreator){
      listEl.querySelectorAll('.wlDel').forEach(b => {
        b.onclick = async () => {
          wheelItems = wheelItems.filter(w => w.id !== b.dataset.id);
          await saveWheel();
          renderWheel();
        };
      });
    }
  }

  if(inCreator){
    const addBtn = document.getElementById('wheelAddBtn');
    const input = document.getElementById('wheelInput');
    const addFn = async () => {
      const val = input.value.trim();
      if(!val) return;
      wheelItems.push({id: 'w-' + Math.random().toString(36).slice(2,9), label: val});
      await saveWheel();
      input.value = '';
      renderWheel();
    };
    addBtn.onclick = addFn;
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') addFn(); });

    const spinBtn = document.getElementById('spinBtn');
    if(spinBtn) spinBtn.onclick = () => spinTheWheel();

    drawWheelSuggestions();
  } else {
    const wl = document.getElementById('wheelLoginBtn');
    if(wl) wl.onclick = () => setMode('select');
    const wsBtn = document.getElementById('wsSubmitBtn');
    const wsStatus = document.getElementById('wsStatus');
    if(wsBtn) wsBtn.onclick = async () => {
      const title = document.getElementById('wsTitle').value.trim();
      const trailerUrl = document.getElementById('wsTrailer').value.trim();
      if(!title){ wsStatus.style.color = 'var(--rate-red)'; wsStatus.textContent = 'Ajoute un titre.'; return; }
      if(trailerUrl && !isYoutubeUrl(trailerUrl)){
        wsStatus.style.color = 'var(--rate-red)';
        wsStatus.textContent = 'Le lien doit être un lien YouTube (youtube.com ou youtu.be).';
        return;
      }
      await loadWheelSuggestions();
      wheelSuggestions.push({
        id: 'ws-' + Math.random().toString(36).slice(2,10),
        title, trailerUrl, submittedBy: viewerName || '?', status: 'pending', submittedAt: Date.now()
      });
      await saveWheelSuggestions();
      wsStatus.style.color = 'var(--rate-green)';
      wsStatus.textContent = '✓ Proposition envoyée, le créateur va la regarder !';
      document.getElementById('wsTitle').value = '';
      document.getElementById('wsTrailer').value = '';
    };
  }
}

function drawWheelSuggestions(){
  const wrap = document.getElementById('wheelSuggList');
  if(!wrap) return;
  const pending = wheelSuggestions.filter(s => s.status === 'pending');
  if(pending.length === 0){
    wrap.innerHTML = `<div class="empty" style="padding:20px 14px;"><div>Aucune proposition en attente.</div></div>`;
    return;
  }
  wrap.innerHTML = pending.map(s => `
    <div class="btTrackRow">
      <span class="t">${escapeHtml(s.title)} <span style="color:var(--text-dim);font-size:11px;">— par ${escapeHtml(s.submittedBy)}</span></span>
      ${s.trailerUrl ? `<a href="${escapeHtml(s.trailerUrl)}" target="_blank" rel="noopener" class="pill" style="text-decoration:none;">Trailer</a>` : ''}
      <button class="del" id="wsApprove-${s.id}" title="Ajouter à la roue">✓</button>
      <button class="del" id="wsReject-${s.id}" title="Refuser">✕</button>
    </div>
  `).join('');
  pending.forEach(s => {
    const app_ = document.getElementById(`wsApprove-${s.id}`);
    if(app_) app_.onclick = async () => {
      await loadWheel();
      await loadWheelSuggestions();
      wheelItems.push({id: 'w-' + Math.random().toString(36).slice(2,9), label: s.title});
      await saveWheel();
      const fresh = wheelSuggestions.find(x => x.id === s.id);
      if(fresh) fresh.status = 'approved';
      await saveWheelSuggestions();
      renderWheel();
    };
    const rej = document.getElementById(`wsReject-${s.id}`);
    if(rej) rej.onclick = async () => {
      await loadWheelSuggestions();
      const fresh = wheelSuggestions.find(x => x.id === s.id);
      if(fresh) fresh.status = 'rejected';
      await saveWheelSuggestions();
      drawWheelSuggestions();
      const countEl = document.getElementById('wsCount');
      if(countEl) countEl.textContent = wheelSuggestions.filter(x=>x.status==='pending').length;
    };
  });
}

function spinTheWheel(){
  if(wheelSpinning || wheelItems.length < 2) return;
  wheelSpinning = true;
  const spinBtn = document.getElementById('spinBtn');
  const resultEl = document.getElementById('wheelResult');
  const actionsEl = document.getElementById('wheelResultActions');
  if(spinBtn) spinBtn.disabled = true;
  resultEl.textContent = '';
  if(actionsEl) actionsEl.style.display = 'none';

  const n = wheelItems.length;
  const segAngle = 360 / n;
  const winnerIndex = Math.floor(Math.random() * n);
  const winner = wheelItems[winnerIndex];
  const center = winnerIndex * segAngle + segAngle / 2;
  const spins = 6 + Math.floor(Math.random() * 3);
  const finalDeg = spins * 360 + (360 - center);

  const spinner = document.getElementById('wheelSpinner');
  spinner.style.transition = 'none';
  spinner.style.transform = 'rotate(0deg)';
  void spinner.offsetWidth;
  requestAnimationFrame(() => {
    spinner.style.transition = 'transform 4.2s cubic-bezier(.17,.67,.22,1.01)';
    spinner.style.transform = `rotate(${finalDeg}deg)`;
  });

  setTimeout(async () => {
    wheelSpinning = false;
    if(spinBtn) spinBtn.disabled = wheelItems.length < 2;
    resultEl.textContent = '' + winner.label;
    wheelState.lastWinner = winner.label;
    wheelState.lastSpinAt = Date.now();
    await saveWheelState();

    if(actionsEl){
      actionsEl.style.display = 'flex';
      const removeBtn = document.getElementById('wheelRemoveBtn');
      const dismissBtn = document.getElementById('wheelDismissBtn');
      removeBtn.onclick = async () => {
        wheelItems = wheelItems.filter(w => w.id !== winner.id);
        await saveWheel();
        renderWheel();
      };
      dismissBtn.onclick = () => { actionsEl.style.display = 'none'; };
    }
  }, 4300);
}

/* ---------- DASHBOARD (créateur) ---------- */
function computeDashboardStats(){
  let best = null, bestVal = 0;
  let mostCommented = null, mostCommentedCount = -1;
  items.forEach(it => {
    const r = overallRating(it);
    if(r > bestVal){ bestVal = r; best = it; }
    const c = (viewerRatings[it.id]||[]).filter(x => x.comment).length;
    if(c > mostCommentedCount){ mostCommentedCount = c; mostCommented = it; }
  });
  const activityMap = {};
  Object.keys(viewerRatings).forEach(k => {
    (viewerRatings[k]||[]).forEach(r => {
      const key = r.who.toLowerCase();
      activityMap[key] = (activityMap[key]||0) + 1;
    });
  });
  let topKey = null, topCount = 0;
  Object.entries(activityMap).forEach(([k,c]) => { if(c > topCount){ topCount = c; topKey = k; } });
  const topDisplay = topKey ? ((viewerProfiles[topKey] && viewerProfiles[topKey].display) || topKey) : null;

  return {
    totalTitles: items.length,
    totalViewers: Object.keys(activityMap).length,
    totalVotes: Object.values(activityMap).reduce((a,b)=>a+b,0),
    best, bestVal,
    mostCommented, mostCommentedCount: mostCommentedCount < 0 ? 0 : mostCommentedCount,
    topDisplay, topCount
  };
}

function renderDashboard(){
  const s = computeDashboardStats();
  app.innerHTML = `
    <div class="page">
      ${navHtml('dashboard','creator')}
      <div class="logo" style="margin-bottom:20px;">
        <h1 style="font-size:28px;">DASHBOARD</h1>
      </div>
      <div class="dashGrid">
        <div class="dashStat"><div class="n">${s.totalTitles}</div><div class="l">Titres au catalogue</div></div>
        <div class="dashStat"><div class="n">${s.totalViewers}</div><div class="l">Viewers actifs</div></div>
        <div class="dashStat"><div class="n">${s.totalVotes}</div><div class="l">Votes reçus au total</div></div>
      </div>
      <div class="sectionLabel" style="margin-top:0;">Temps forts</div>
      ${s.best ? `
        <div class="dashHighlight">
          <div class="dposter" style="${s.best.poster?`background-image:url('${s.best.poster}')`:''}">${s.best.poster?'':posterInitial(s.best.title)}</div>
          <div class="dinfo"><div class="dlabel">Titre le mieux noté</div><div class="dtitle">${escapeHtml(s.best.title)}</div></div>
          <div class="dvalue" style="color:${ratingColor(s.bestVal)}">${s.bestVal.toFixed(1)}/10</div>
        </div>
      ` : ''}
      ${s.mostCommented && s.mostCommentedCount > 0 ? `
        <div class="dashHighlight">
          <div class="dposter" style="${s.mostCommented.poster?`background-image:url('${s.mostCommented.poster}')`:''}">${s.mostCommented.poster?'':posterInitial(s.mostCommented.title)}</div>
          <div class="dinfo"><div class="dlabel">Titre le plus commenté</div><div class="dtitle">${escapeHtml(s.mostCommented.title)}</div></div>
          <div class="dvalue">${s.mostCommentedCount}</div>
        </div>
      ` : ''}
      ${s.topDisplay ? `
        <div class="dashHighlight">
          <div class="dposter" style="display:flex;align-items:center;justify-content:center;">${posterInitial(s.topDisplay)}</div>
          <div class="dinfo"><div class="dlabel">Viewer le plus actif</div><div class="dtitle">${escapeHtml(s.topDisplay)}</div></div>
          <div class="dvalue">${s.topCount}</div>
        </div>
      ` : ''}
      ${!s.best && !s.mostCommented && !s.topDisplay ? `<div class="empty"><div>Pas encore assez de données pour afficher des temps forts.</div></div>` : ''}
    </div>
  `;
  wireNav('creator');
}

/* ---------- BADGES ---------- */
const BADGE_DEFS = [
  {id:'first_review', icon:'', label:'Premier avis', check: s => s.comments >= 1},
  {id:'critic', icon:'', label:'Critique confirmé', check: s => s.comments >= 5},
  {id:'ten_films', icon:'', label:'10 films notés', check: s => s.filmsRated >= 10},
  {id:'series_fan', icon:'', label:'Fan de séries', check: s => s.showsRated >= 1},
  {id:'marathon', icon:'', label:'Marathonien', check: s => s.episodesRated >= 10},
  {id:'gamer', icon:'', label:'Joueur', check: s => s.gamePoints > 0},
  {id:'podium', icon:'', label:'Top 3 classement', check: s => s.rank && s.rank <= 3},
];

function getViewerCommentsCount(key){
  let c = 0;
  items.forEach(it => {
    (viewerRatings[it.id]||[]).forEach(r => { if(r.who.toLowerCase() === key && r.comment) c++; });
  });
  return c;
}
function getLeaderboardRank(key){
  const rows = Object.entries(gameScores).sort((a,b) => b[1]-a[1]);
  const idx = rows.findIndex(([k]) => k === key);
  return idx >= 0 ? idx+1 : null;
}
function getViewerBadges(key){
  const base = getViewerStats(key);
  const stats = {...base, comments: getViewerCommentsCount(key), gamePoints: gameScores[key]||0, rank: getLeaderboardRank(key)};
  return BADGE_DEFS.map(b => ({...b, earned: !!b.check(stats)}));
}
function badgesRowHtml(key){
  const badges = getViewerBadges(key);
  return `<div class="badgesRow">${badges.map(b => `
    <div class="badgeChip ${b.earned ? 'earned' : ''}" title="${escapeHtml(b.label)}">
      ${escapeHtml(b.label)}
    </div>
  `).join('')}</div>`;
}

async function processSession(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session) return false;

  const meta = session.user.user_metadata || {};
  const identNick = meta.nickname || meta.preferred_username || meta.full_name || meta.name || meta.pseudo || '';
  const isCreator = session.user.id === CREATOR_UID;

  if(identNick){
    const key = identNick.toLowerCase();
    const existing = viewerProfiles[key] || {};
    const display = existing.display || identNick;
    viewerName = display;
    viewerProfiles[key] = {
      display,
      avatar: existing.avatar || meta.avatar_url || '',
      bio: existing.bio || ''
    };
    await saveProfiles();
  }

  if(isCreator){
    isCreatorAccount = true;
    mode = 'creator';
  } else if(identNick){
    mode = 'viewer';
  }
  return true;
}

(async () => {
  if(SUPABASE_URL.includes('TON-PROJET') || SUPABASE_ANON_KEY.includes('TA_CLE')){
    document.getElementById('app').innerHTML = `
      <div class="page" style="text-align:center;padding:80px 20px;">
        <h1 style="font-family:'Space Grotesk',sans-serif;color:var(--gold);font-size:24px;">Configuration manquante</h1>
        <p style="color:var(--text-dim);max-width:420px;margin:14px auto 0;line-height:1.6;">
          Ouvre ce fichier, cherche <code>SUPABASE_URL</code> et <code>SUPABASE_ANON_KEY</code> tout en haut,
          et colle tes vraies valeurs récupérées dans Supabase (Settings → API).
        </p>
      </div>
    `;
    return;
  }
  await loadCatalog();
  await loadRatings();
  await loadSchedule();
  await loadProfiles();
  await loadSettings();
  await loadScores();
  await loadWheel();
  await loadWheelSuggestions();
  await loadWheelState();
  await loadBtTracks();
  await loadBtPlaylists();
  await loadBtGame();
  await loadUc();

  await processSession();
  streamViewFromCreator = isCreatorAccount;
  mode = 'stream-view';

  wrapEl.className = mode === 'select' ? 'wrap narrow' : 'wrap';
  render();
})();
