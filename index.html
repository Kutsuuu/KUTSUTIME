async function startBtRound(inCreator){
  await loadBtGame();
  await loadBtTracks();
  if(!btGame.pool || btGame.pool.length === 0){
    btGame.status = 'finished';
    await saveBtGame();
    drawBt(inCreator);
    return;
  }
  const idx = Math.floor(Math.random()*btGame.pool.length);
  const trackId = btGame.pool[idx];
  btGame.pool = btGame.pool.filter(id => id !== trackId);
  const track = btTracks.find(t => t.id === trackId);
  if(!track){ await saveBtGame(); drawBt(inCreator); return; }

  const sameCat = btTracks.filter(t => t.category === track.category && t.id !== track.id);
  const others = btTracks.filter(t => t.id !== track.id);
  const decoysPool = sameCat.length >= 3 ? sameCat : others;
  const shuffledDecoys = decoysPool.slice().sort(()=>Math.random()-0.5).slice(0,3);
  const options = [track.title, ...shuffledDecoys.map(t=>t.title)].sort(()=>Math.random()-0.5);

  Object.values(btGame.players).forEach(p => { p.answered = false; p.lastCorrect = null; p.lastPoints = 0; });
  btGame.currentTrack = {id: track.id, title: track.title, category: track.category, audioUrl: track.audioUrl};
  btGame.options = options;
  btGame.playStartedAt = Date.now();
  btGame.status = 'playing';
  btGame.round = (btGame.round||0) + 1;
  await saveBtGame();
  drawBt(inCreator);
}

async function submitBtAnswer(chosen, inCreator){
  await loadBtGame();
  const key = (viewerName||'').toLowerCase();
  const me = btGame.players[key];
  if(!me || me.answered || btGame.status !== 'playing'){ drawBt(inCreator); return; }
  const elapsed = (Date.now() - btGame.playStartedAt) / 1000;
  const correct = chosen === btGame.currentTrack.title;
  let points = 0;
  if(correct){
    points = Math.max(20, Math.round(100 - elapsed*4));
  }
  me.answered = true;
  me.lastCorrect = correct;
  me.lastPoints = points;
  me.score = (me.score||0) + points;
  await saveBtGame();
  if(points > 0) await addPoints(key, points);
  drawBt(inCreator);
}

function revealBtRound(inCreator){
  (async () => {
    await loadBtGame();
    btGame.status = 'revealed';
    await saveBtGame();
    drawBt(inCreator);
  })();
}

/* ---------- ROUE DES FILMS ---------- */
let wheelViewFromCreator = true;

function polarToCartesian(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180.0;
  return {x: cx + r * Math.cos(a), y: cy + r * Math.sin(a)};
}
function describeArc(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x} ${end.y} Z`;
}
function truncateLabel(s, n){
  s = s || '';
  return s.length > n ? s.slice(0, n-1) + '…' : s;
}
function buildWheelSVG(wItems){
  const size = 300, cx = size/2, cy = size/2, r = size/2 - 4;
  const n = wItems.length;
  const segAngle = 360 / n;
  const palette = ['#e6b325','#c99a1e','#8a6a15','#f0d060','#b8860b','#9146ff','#d4af37'];
  let paths = '', texts = '';
  wItems.forEach((it, i) => {
    const start = i*segAngle, end = start+segAngle;
    const color = palette[i % palette.length];
    paths += `<path d="${describeArc(cx,cy,r,start,end)}" fill="${color}" stroke="#071a17" stroke-width="1.5"/>`;
    const mid = start + segAngle/2;
    const tx = polarToCartesian(cx, cy, r*0.62, mid);
    texts += `<text x="${tx.x}" y="${tx.y}" fill="var(--ink)" font-size="10" font-family="Space Grotesk, sans-serif" font-weight="700" text-anchor="middle" transform="rotate(${mid}, ${tx.x}, ${tx.y})">${escapeHtml(truncateLabel(it.label,16))}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%">${paths}${texts}</svg>`;
}

      const val = input.value.trim();
      if(!val) return;
      wheelItems.push({id: 'w-' + Math.random().toString(36).slice(2,9), label: val});
      await saveWheel();
      input.value = '';
      renderWheel();
    };
    addBtn.onclick = addFn;
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') addFn(); });

    const spinBtn = document.getElementById('spinBtn');
    if(spinBtn) spinBtn.onclick = () => spinTheWheel();
  }
}

function spinTheWheel(){
  if(wheelSpinning || wheelItems.length < 2) return;
  wheelSpinning = true;
  const spinBtn = document.getElementById('spinBtn');
  const resultEl = document.getElementById('wheelResult');
  const actionsEl = document.getElementById('wheelResultActions');
  if(spinBtn) spinBtn.disabled = true;
  resultEl.textContent = '';
  if(actionsEl) actionsEl.style.display = 'none';

  const n = wheelItems.length;
  const segAngle = 360 / n;
  const winnerIndex = Math.floor(Math.random() * n);
  const winner = wheelItems[winnerIndex];
  const center = winnerIndex * segAngle + segAngle / 2;
  const spins = 6 + Math.floor(Math.random() * 3);
  const finalDeg = spins * 360 + (360 - center);

  const spinner = document.getElementById('wheelSpinner');
  spinner.style.transition = 'none';
  spinner.style.transform = 'rotate(0deg)';
  void spinner.offsetWidth;
  requestAnimationFrame(() => {
    spinner.style.transition = 'transform 4.2s cubic-bezier(.17,.67,.22,1.01)';
    spinner.style.transform = `rotate(${finalDeg}deg)`;
  });

  setTimeout(async () => {
    wheelSpinning = false;
    if(spinBtn) spinBtn.disabled = wheelItems.length < 2;
    resultEl.textContent = '🎉 ' + winner.label;
    wheelState.lastWinner = winner.label;
    wheelState.lastSpinAt = Date.now();
    await saveWheelState();

    if(actionsEl){
      actionsEl.style.display = 'flex';
      const removeBtn = document.getElementById('wheelRemoveBtn');
      const dismissBtn = document.getElementById('wheelDismissBtn');
      removeBtn.onclick = async () => {
        wheelItems = wheelItems.filter(w => w.id !== winner.id);
        await saveWheel();
        renderWheel();
      };
      dismissBtn.onclick = () => { actionsEl.style.display = 'none'; };
    }
  }, 4300);
}

/* ---------- DASHBOARD (créateur) ---------- */
function computeDashboardStats(){
  let best = null, bestVal = 0;
  let mostCommented = null, mostCommentedCount = -1;
  items.forEach(it => {
    const r = overallRating(it);
    if(r > bestVal){ bestVal = r; best = it; }
    const c = (viewerRatings[it.id]||[]).filter(x => x.comment).length;
    if(c > mostCommentedCount){ mostCommentedCount = c; mostCommented = it; }
  });
  const activityMap = {};
  Object.keys(viewerRatings).forEach(k => {
    (viewerRatings[k]||[]).forEach(r => {
      const key = r.who.toLowerCase();
      activityMap[key] = (activityMap[key]||0) + 1;
    });
  });
  let topKey = null, topCount = 0;
  Object.entries(activityMap).forEach(([k,c]) => { if(c > topCount){ topCount = c; topKey = k; } });
  const topDisplay = topKey ? ((viewerProfiles[topKey] && viewerProfiles[topKey].display) || topKey) : null;

  return {
    totalTitles: items.length,
    totalViewers: Object.keys(activityMap).length,
    totalVotes: Object.values(activityMap).reduce((a,b)=>a+b,0),
    best, bestVal,
    mostCommented, mostCommentedCount: mostCommentedCount < 0 ? 0 : mostCommentedCount,
    topDisplay, topCount
  };
}

  const s = computeDashboardStats();
  app.innerHTML = `

      <div class="logo" style="margin-bottom:20px;">
        <h1 style="font-size:28px;">DASHBOARD</h1>
        <div class="tag">un coup d'œil sur ta communauté</div>
      </div>
      <div class="dashGrid">
        <div class="dashStat"><div class="n">${s.totalTitles}</div><div class="l">Titres au catalogue</div></div>
        <div class="dashStat"><div class="n">${s.totalViewers}</div><div class="l">Viewers actifs</div></div>
        <div class="dashStat"><div class="n">${s.totalVotes}</div><div class="l">Votes reçus au total</div></div>
      </div>
      <div class="sectionLabel" style="margin-top:0;">Temps forts</div>
      ${s.best ? `
        <div class="dashHighlight">
          <div class="dposter" style="${s.best.poster?`background-image:url('${s.best.poster}')`:''}">${s.best.poster?'':'🎬'}</div>
          <div class="dinfo"><div class="dlabel">🏆 Titre le mieux noté</div><div class="dtitle">${escapeHtml(s.best.title)}</div></div>
          <div class="dvalue" style="color:${ratingColor(s.bestVal)}">${s.bestVal.toFixed(1)}/10</div>
        </div>
      ` : ''}
      ${s.mostCommented && s.mostCommentedCount > 0 ? `
        <div class="dashHighlight">
          <div class="dposter" style="${s.mostCommented.poster?`background-image:url('${s.mostCommented.poster}')`:''}">${s.mostCommented.poster?'':'🎬'}</div>
          <div class="dinfo"><div class="dlabel">💬 Titre le plus commenté</div><div class="dtitle">${escapeHtml(s.mostCommented.title)}</div></div>
          <div class="dvalue">${s.mostCommentedCount}</div>
        </div>
      ` : ''}
      ${s.topDisplay ? `
        <div class="dashHighlight">
          <div class="dposter" style="display:flex;align-items:center;justify-content:center;">👤</div>
          <div class="dinfo"><div class="dlabel">🔥 Viewer le plus actif</div><div class="dtitle">${escapeHtml(s.topDisplay)}</div></div>
          <div class="dvalue">${s.topCount}</div>
        </div>
      ` : ''}
      ${!s.best && !s.mostCommented && !s.topDisplay ? `<div class="empty"><div class="ic">📊</div><div>Pas encore assez de données pour afficher des temps forts.</div></div>` : ''}
    </div>
  `;
  wireNav('creator');
}

/* ---------- BADGES ---------- */
const BADGE_DEFS = [
  {id:'first_review', icon:'📝', label:'Premier avis', check: s => s.comments >= 1},
  {id:'critic', icon:'🖋️', label:'Critique confirmé', check: s => s.comments >= 5},
  {id:'ten_films', icon:'🍿', label:'10 films notés', check: s => s.filmsRated >= 10},
  {id:'series_fan', icon:'📺', label:'Fan de séries', check: s => s.showsRated >= 1},
  {id:'marathon', icon:'🏃', label:'Marathonien', check: s => s.episodesRated >= 10},
  {id:'gamer', icon:'🎮', label:'Joueur', check: s => s.gamePoints > 0},
  {id:'podium', icon:'🏆', label:'Top 3 classement', check: s => s.rank && s.rank <= 3},
];

function getViewerCommentsCount(key){
  let c = 0;
  items.forEach(it => {
    (viewerRatings[it.id]||[]).forEach(r => { if(r.who.toLowerCase() === key && r.comment) c++; });
  });
  return c;
}
function getLeaderboardRank(key){
  const rows = Object.entries(gameScores).sort((a,b) => b[1]-a[1]);
  const idx = rows.findIndex(([k]) => k === key);
  return idx >= 0 ? idx+1 : null;
}
function getViewerBadges(key){
  const base = getViewerStats(key);
  const stats = {...base, comments: getViewerCommentsCount(key), gamePoints: gameScores[key]||0, rank: getLeaderboardRank(key)};
  return BADGE_DEFS.map(b => ({...b, earned: !!b.check(stats)}));
}
function badgesRowHtml(key){
  const badges = getViewerBadges(key);
  return `<div class="badgesRow">${badges.map(b => `
    <div class="badgeChip ${b.earned ? 'earned' : ''}" title="${escapeHtml(b.label)}">
      <span class="bicon">${b.icon}</span>${escapeHtml(b.label)}
    </div>
  `).join('')}</div>`;
}

async function processSession(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session) return false;

  const meta = session.user.user_metadata || {};
  const identNick = meta.nickname || meta.preferred_username || meta.full_name || meta.name || meta.pseudo || '';
  const isCreator = session.user.id === CREATOR_UID;

  if(identNick){
    const key = identNick.toLowerCase();
    const existing = viewerProfiles[key] || {};
    const display = existing.display || identNick;
    viewerName = display;
    viewerProfiles[key] = {
      display,
      avatar: existing.avatar || meta.avatar_url || '',
      bio: existing.bio || ''
    };
    await saveProfiles();
  }

  if(isCreator){
    isCreatorAccount = true;
    mode = 'creator';
  } else if(identNick){
    mode = 'viewer';
  }
  return true;
}
