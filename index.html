function wireBoostersManage(col, cards){
  const g = (id) => document.getElementById(id);
  const redraw = () => drawBoosters();

  g('newColBtn').onclick = async () => {
    const st = g('newColStatus');
    const name = g('newColName').value.trim();
    const price = Math.max(1, parseInt(g('newColPrice').value, 10) || 100);
    const perPack = Math.min(10, Math.max(1, parseInt(g('newColPer').value, 10) || CARDS_PER_PACK));
    if(!name){ st.style.color = 'var(--rate-red)'; st.textContent = 'Donne un nom à la collection.'; return; }
    await loadCards();
    const c = {id: cardUid('col-'), name, price, perPack, published: false};
    cardsCatalog.collections.push(c);
    manageColId = c.id;
    await saveCards();
    redraw();
  };

  COLLECTION_TEMPLATES.forEach(t => {
    g(t.key + 'TplBtn').onclick = async () => {
      await loadCards();
      let name = t.name, i = 2;
      while(cardsCatalog.collections.some(c => c.name === name)) name = `${t.name} ${i++}`;
      const c = {id: cardUid('col-'), name, price: 100, perPack: CARDS_PER_PACK, tpl: t.key, published: false};
      cardsCatalog.collections.push(c);
      RARITY_KEYS.forEach(k => {
        (t[k] || []).forEach(it => cardsCatalog.cards.push({id: cardUid('card-'), collectionId: c.id, name: it.n, rarity: k, desc: it.d, hue: it.h, image: '', imagePath: ''}));
      });
      manageColId = c.id;
      await saveCards();
      redraw();
    };
  });

  const tabsEl = g('manageTabs');
  if(tabsEl) tabsEl.querySelectorAll('.tab').forEach(b => { b.onclick = () => { manageColId = b.dataset.c; redraw(); }; });
  if(!col) return;

  g('pubBtn').onclick = async () => {
    await loadCards();
    const c = cardsCatalog.collections.find(x => x.id === col.id);
    if(!c) return;
    c.published = !isPublished(c);
    await saveCards();
    redraw();
  };

  g('colSaveBtn').onclick = async () => {
    const st = g('colStatus');
    const name = g('colName').value.trim();
    if(!name){ st.style.color = 'var(--rate-red)'; st.textContent = 'Le nom ne peut pas être vide.'; return; }
    await loadCards();
    const c = cardsCatalog.collections.find(x => x.id === col.id);
    if(!c) return;
    c.name = name;
    c.price = Math.max(1, parseInt(g('colPrice').value, 10) || 100);
    c.perPack = Math.min(10, Math.max(1, parseInt(g('colPer').value, 10) || CARDS_PER_PACK));
    c.daily = g('colDaily').checked;
    await saveCards();
    redraw();
  };

  g('fillDescBtn').onclick = async () => {
    const r = await fillTemplateDescriptions(col.id);
    const parts = [];
    if(r.added) parts.push(`${r.added} personnage${r.added > 1 ? 's' : ''} ajouté${r.added > 1 ? 's' : ''}`);
    if(r.completed) parts.push(`${r.completed} carte${r.completed > 1 ? 's' : ''} complétée${r.completed > 1 ? 's' : ''}`);
    if(r.added || r.completed) drawBoosters();
    const st = document.getElementById('colStatus');
    if(st){ st.style.color = 'var(--rate-green)'; st.textContent = parts.length ? parts.join(' · ') + '.' : 'Rien à compléter.'; }
  };

  g('packImgBtn').onclick = () => pickFiles(false, async (files) => {
    const st = g('colStatus');
    st.style.color = 'var(--text-dim)'; st.textContent = 'Envoi...';
    try{
      await loadCards();
      const c = cardsCatalog.collections.find(x => x.id === col.id);
      if(!c) return;
      await uploadPackImage(c, files[0]);
      await saveCards();
      drawBoosters();
    }catch(e){ st.style.color = 'var(--rate-red)'; st.textContent = 'Erreur : ' + e.message; }
  });
  const prm = g('packImgRemoveBtn');
  if(prm) prm.onclick = async () => {
    await loadCards();
    const c = cardsCatalog.collections.find(x => x.id === col.id);
    if(!c) return;
    if(c.packImagePath){ try{ await supabaseClient.storage.from(BT_BUCKET).remove([c.packImagePath]); }catch(e){} }
    c.packImage = ''; c.packImagePath = '';
    await saveCards();
    drawBoosters();
  };

  g('colDeleteBtn').onclick = async () => {
    if(!confirm(`Supprimer la collection « ${col.name} » et ses ${cards.length} cartes ?`)) return;
    await loadCards();
    const doomed = cardsCatalog.cards.filter(c => c.collectionId === col.id);
    cardsCatalog.cards = cardsCatalog.cards.filter(c => c.collectionId !== col.id);
    cardsCatalog.collections = cardsCatalog.collections.filter(c => c.id !== col.id);
    await saveCards();
    await removeCardFiles(doomed);
    if(col.packImagePath){ try{ await supabaseClient.storage.from(BT_BUCKET).remove([col.packImagePath]); }catch(e){} }
    manageColId = null;
    redraw();
  };

  g('cardAddBtn').onclick = async () => {
    const st = g('cardStatus');
    const name = g('cardName').value.trim();
    if(!name){ st.style.color = 'var(--rate-red)'; st.textContent = 'Donne un nom à la carte.'; return; }
    await loadCards();
    cardsCatalog.cards.push({id: cardUid('card-'), collectionId: col.id, name, rarity: g('cardRarity').value, image: '', imagePath: ''});
    await saveCards();
    redraw();
  };

  g('cardBatchBtn').onclick = async () => {
    const lines = g('cardBatch').value.split('\n').map(l => l.trim()).filter(Boolean);
    if(!lines.length) return;
    await loadCards();
    lines.forEach(line => {
      const [name, rar] = line.split(/\s*[|;\t]\s*/);
      if(name && name.trim()) cardsCatalog.cards.push({id: cardUid('card-'), collectionId: col.id, name: name.trim(), rarity: parseRarity(rar), image: '', imagePath: ''});
    });
    await saveCards();
    redraw();
  };

  g('cardImagesBtn').onclick = () => pickFiles(true, async (files) => {
    const st = g('cardStatus');
    await loadCards();
    const list = colCards(col.id);
    let ok = 0; const unmatched = []; const failed = [];
    for(let i = 0; i < files.length; i++){
      const f = files[i];
      const card = matchCardByFile(f.name, list);
      st.style.color = 'var(--text-dim)';
      st.textContent = `Envoi ${i + 1}/${files.length}...`;
      if(!card){ unmatched.push(f.name); continue; }
      try{ await uploadCardImage(card, f); await saveCards(); ok++; }
      catch(e){ failed.push(`${f.name} (${e.message})`); }
    }
    const msg = `${ok} image${ok > 1 ? 's' : ''} associée${ok > 1 ? 's' : ''}` + (unmatched.length ? ` · sans carte : ${unmatched.join(', ')}` : '') + (failed.length ? ` · échecs : ${failed.join(', ')}` : '');
    if(!failed.length && !unmatched.length){ redraw(); return; }
    const y = window.scrollY;
    drawBoostersManage(document.getElementById('boostersBody'));
    const st2 = document.getElementById('cardStatus');
    if(st2){ st2.style.color = 'var(--rate-orange)'; st2.textContent = msg; }
    window.scrollTo(0, y);
  });

  document.querySelectorAll('[data-rar]').forEach(sel => {
    sel.onchange = async () => {
      await loadCards();
      const c = cardsCatalog.cards.find(x => x.id === sel.dataset.rar);
      if(c){ c.rarity = sel.value; await saveCards(); redraw(); }
    };
  });
  document.querySelectorAll('[data-img]').forEach(btn => {
    btn.onclick = () => pickFiles(false, async (files) => {
      await loadCards();
      const c = cardsCatalog.cards.find(x => x.id === btn.dataset.img);
      if(!c) return;
      btn.textContent = '...';
      try{ await uploadCardImage(c, files[0]); await saveCards(); redraw(); }
      catch(e){ btn.textContent = 'Échec'; console.error(e); }
    });
  });
  document.querySelectorAll('[data-edit]').forEach(btn => { btn.onclick = () => openCardEditor(btn.dataset.edit); });
  document.querySelectorAll('.tcgWrap .tcg').forEach(t => { t.onclick = () => openCardDetail(t.dataset.card, true, false); });
  document.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      await loadCards();
      const c = cardsCatalog.cards.find(x => x.id === btn.dataset.del);
      if(!c || !confirm(`Supprimer la carte « ${c.name} » ?`)) return;
      cardsCatalog.cards = cardsCatalog.cards.filter(x => x.id !== c.id);
      await saveCards();
      await removeCardFiles([c]);
      redraw();
    };
  });
}

let btPreloadEl = null, btPreloadedId = null;
const BT_SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';

function stopBtPoll(){ if(btPollTimer){ clearInterval(btPollTimer); btPollTimer = null; } }

/* ----- audio : un seul élément média, débloqué par un geste de l'utilisateur ----- */
function btEnsureMedia(){
  if(!btMediaEl){
    btMediaEl = document.createElement('video');
    btMediaEl.playsInline = true;
    btMediaEl.setAttribute('playsinline', '');
    btMediaEl.setAttribute('webkit-playsinline', '');
    btMediaEl.preload = 'auto';
    ['playing', 'canplay', 'canplaythrough'].forEach(ev => btMediaEl.addEventListener(ev, () => btSetLoading(false)));
    ['waiting', 'stalled'].forEach(ev => btMediaEl.addEventListener(ev, () => { if(btMediaEl.dataset.trackId && btMediaEl.dataset.trackId !== '__silent') btSetLoading(true); }));
  }
  return btMediaEl;
}
function unlockBtAudio(){
  if(btSoundUnlocked) return;
  const el = btEnsureMedia();
  btSoundUnlocked = true;
  try{
    if(!el.src){ el.src = BT_SILENT_WAV; el.dataset.trackId = '__silent'; }
    const pr = el.play();
    if(pr && pr.catch) pr.catch(() => { btSoundUnlocked = false; });
  }catch(e){ btSoundUnlocked = false; }
}
function btSetLoading(on){
  const el = document.getElementById('btLoading');
  if(el) el.style.display = on ? 'flex' : 'none';
}
function btRefreshLoading(inCreator){
  const el = btMediaEl;
  const active = el && el.dataset.trackId && el.dataset.trackId !== '__silent' && (btSoundUnlocked || inCreator);
  btSetLoading(!!(active && el.readyState < 3 && !el.error));
}
/* la musique suivante est connue à l'avance (pool[0]) : on la met en mémoire pendant la manche en cours */
function btPreloadNext(g){
  try{
    if(!g || g.status === 'finished' || g.status === 'idle') return;
    if(navigator.connection && navigator.connection.saveData) return;
    const nid = g.pool && g.pool[0];
    if(!nid || btPreloadedId === nid) return;
    const t = btTracks.find(x => x.id === nid);
    if(!t || !t.audioUrl) return;
    btPreloadedId = nid;
    if(!btPreloadEl){ btPreloadEl = document.createElement('audio'); btPreloadEl.preload = 'auto'; btPreloadEl.muted = true; }
    btPreloadEl.src = t.audioUrl;
    btPreloadEl.load();
  }catch(e){}
}

/* ----- écritures sûres : plusieurs joueurs peuvent écrire en même temps sans s'écraser ----- */
async function btMutate(mutator, verify, tries){
  tries = tries || 4;
  for(let i = 0; i < tries; i++){
    await loadBtGame();
    if(!mutator(btGame)) return verify ? verify(btGame) : false;
    await saveBtGame();
    await new Promise(r => setTimeout(r, 200 + Math.random() * 350));
    await loadBtGame();
    if(!verify || verify(btGame)) return true;
  }
  return false;
}
function btNewPlayer(){
  const k = (viewerName || '').toLowerCase();
  const profile = viewerProfiles[k] || {};
  return {display: viewerName, avatar: profile.avatar || '', score: 0, answered: false, lastCorrect: null, lastPoints: 0};
}
function btApplyAnswer(m, ans){
  m.answered = true; m.lastCorrect = ans.correct; m.lastPoints = ans.points; m.lastAnswerText = ans.text;
  m.score = (m.score || 0) + ans.points; m.played = (m.played || 0) + 1;
}
/* si l'inscription ou la réponse du joueur a été écrasée par l'écriture d'un autre, on la rétablit toute seule */
async function btHeal(inCreator){
  if(inCreator || !viewerName) return;
  const g = btGame, key = viewerName.toLowerCase();
  if(g.status === 'lobby' && btMyJoin && !g.players[key]){
    await btMutate(gg => { if(gg.status !== 'lobby' || gg.players[key]) return false; gg.players[key] = btNewPlayer(); return true; },
                   gg => gg.status !== 'lobby' || !!gg.players[key]);
    return;
  }
  if(g.status === 'playing' && btMyAnswer && g.currentTrack && btMyAnswer.trackId === g.currentTrack.id){
    const me = g.players[key];
    if(me && !me.answered){
      const ans = btMyAnswer;
      await btMutate(gg => { const m = gg.players[key]; if(!m || m.answered || gg.status !== 'playing' || !gg.currentTrack || gg.currentTrack.id !== ans.trackId) return false; btApplyAnswer(m, ans); return true; },
                     gg => { const m = gg.players[key]; return !m || m.answered || gg.status !== 'playing' || !gg.currentTrack || gg.currentTrack.id !== ans.trackId; });
    }
  }
}

/* ce qui oblige à reconstruire l'écran ; tout le reste (scores, « a répondu ») est mis à jour sans toucher au champ ni aux boutons */
function btStructSig(g){
  const key = (viewerName || '').toLowerCase();
  const me = g.players && g.players[key];
  return [g.status, g.round || 0, g.currentTrack ? g.currentTrack.id : '', me ? (me.answered ? 1 : 0) : -1, Object.keys(g.players || {}).length ? 1 : 0, g.payoutsDone ? 1 : 0].join('|');
}
function btLightUpdate(g){
  const pl = document.getElementById('btPlayers');
  if(pl) pl.innerHTML = btPlayerRows();
  const tag = document.getElementById('btRoundTag');
  if(tag && g.status === 'playing'){
    const total = Object.keys(g.players).length;
    const answered = Object.values(g.players).filter(p => p.answered).length;
    tag.textContent = `Round ${g.round}/${g.roundsTotal || '?'} · ${answered}/${total} ont répondu`;
  }
}
async function btPollTick(inCreator){
  if(btPollBusy) return;
  btPollBusy = true;
  try{
    if(!document.getElementById('btStageWrap')){ stopBtPoll(); return; }
    await loadBtGame();
    await btHeal(inCreator);
    const g = btGame;
    btPreloadNext(g);
    const wrap = document.getElementById('btStageWrap');
    if(!wrap){ stopBtPoll(); return; }
    if(btStructSig(g) === btLastSig && wrap.childElementCount > 0){ btLightUpdate(g); return; }
    const scrollY = window.scrollY;
    drawBt(inCreator);
    window.scrollTo(0, scrollY);
  } finally { btPollBusy = false; }
}

  if(!inCreator){

            : (btGame.status==='finished' && btGame.payouts && btGame.payouts[key] !== undefined ? `${(btGame.winners||[]).includes(key) ? 'Victoire · ' : ''}+${btGame.payouts[key]} ${WATCH_CURRENCY}` : ''))}

/* fin d'un blind test : classement par score (égalités gérées), victoire = 1 point, Ryos selon la place */
async function finalizeBtGame(){
  await loadBtGame();
  if(btGame.payoutsDone){ btGame.status = 'finished'; await saveBtGame(); return; }
  const creatorKey = (viewerName || '').toLowerCase();
  const entries = Object.entries(btGame.players || {})
    .filter(([k, p]) => k !== creatorKey && ((p.played || 0) > 0 || (p.score || 0) > 0))
    .sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
  const cfg = payoutSettings();
  const payouts = {}, places = {}, winners = [];
  let place = 0, prev = null;
  entries.forEach(([k, p], i) => {
    const sc = p.score || 0;
    if(sc !== prev){ place = i + 1; prev = sc; }
    places[k] = place;
    payouts[k] = sc > 0 ? payoutForPlace(place, cfg) : cfg.other;      // 0 point = simple participation
    if(place === 1 && sc > 0) winners.push(k);
  });
  btGame.status = 'finished';
  btGame.payoutsDone = true; btGame.payouts = payouts; btGame.places = places; btGame.winners = winners;
  await saveBtGame();
  for(const [k, amount] of Object.entries(payouts)) await grantRyos(k, btGame.players[k].display, amount);
  await addWins(winners);
}

        ${BT_CATEGORIES.map(c => {
          const count = btTracks.filter(t=>t.category===c).length;
          return `<div class="btCatChip selected" data-cat="${escapeHtml(c)}">${escapeHtml(c)}<span class="n">${count} piste${count>1?'s':''}</span></div>`;
        }).join('')}
      </div>
      <div class="sectionLabel">Difficulté</div>
      <div class="btCatGrid" id="btDiffGrid">
        ${BT_DIFFICULTIES.map(d => {
          const count = btTracks.filter(t=>(t.difficulty||'Normal')===d).length;
          return `<div class="btCatChip selected" data-diff="${escapeHtml(d)}">${escapeHtml(d)}<span class="n">${count} piste${count>1?'s':''}</span></div>`;
        }).join('')}
      </div>
      <div class="row2" style="margin-top:14px;">
        <div style="flex:1;">
          <label>Nombre de rounds</label>
          <input type="text" inputmode="numeric" id="btRoundsInput" value="8" placeholder="8">
        </div>
        <div style="flex:1;">
          <label>Temps pour trouver (secondes)</label>
          <input type="text" inputmode="numeric" id="btTimerInput" value="30" placeholder="30">
        </div>
      </div>
      <div class="tag" id="btPoolCount" style="margin:10px 0 14px;"></div>
      <button class="btn primary" id="btCreateLobby" style="width:100%;" ${btTracks.length < 4 ? 'disabled' : ''}>Créer le lobby</button>
      ${btTracks.length < 4 ? `<div class="hint">Ajoute au moins 4 musiques dans la bibliothèque pour pouvoir jouer.</div>` : ''}
    ` : `<div class="empty"><div>Le créateur n'a pas encore ouvert de blind test.</div></div>`;

    if(inCreator){
      const selectedCats = new Set(BT_CATEGORIES);
      const selectedDiffs = new Set(BT_DIFFICULTIES);
      const updatePoolCount = () => {
        const cats = Array.from(selectedCats);
        const diffs = Array.from(selectedDiffs);
        const pool = btTracks.filter(t => cats.includes(t.category) && diffs.includes(t.difficulty||'Normal') && isPlaylistEnabled(impliedAnimeName(t) || t.category || 'Autres'));
        document.getElementById('btPoolCount').textContent = `${pool.length} piste${pool.length>1?'s':''} correspondent à cette sélection`;
      };
      wrap.querySelectorAll('#btCatGrid .btCatChip').forEach(chip => {
        chip.onclick = () => {
          const c = chip.dataset.cat;
          if(selectedCats.has(c)){ selectedCats.delete(c); chip.classList.remove('selected'); }
          else { selectedCats.add(c); chip.classList.add('selected'); }
          updatePoolCount();
        };
      });
      wrap.querySelectorAll('#btDiffGrid .btCatChip').forEach(chip => {
        chip.onclick = () => {
          const d = chip.dataset.diff;
          if(selectedDiffs.has(d)){ selectedDiffs.delete(d); chip.classList.remove('selected'); }
          else { selectedDiffs.add(d); chip.classList.add('selected'); }
          updatePoolCount();
        };
      });
      updatePoolCount();
      document.getElementById('btCreateLobby').onclick = async () => {
        const cats = Array.from(selectedCats);
        const diffs = Array.from(selectedDiffs);
        const fullPool = btTracks.filter(t => cats.includes(t.category) && diffs.includes(t.difficulty||'Normal') && isPlaylistEnabled(impliedAnimeName(t) || t.category || 'Autres'));
        if(fullPool.length < 4){ alert('Pas assez de musiques pour cette sélection (4 minimum).'); return; }
        const roundsWanted = Math.max(1, parseInt(document.getElementById('btRoundsInput').value, 10) || 8);
        const timerWanted = Math.max(5, Math.min(120, parseInt(document.getElementById('btTimerInput').value, 10) || 30));
        const shuffled = fullPool.slice().sort(()=>Math.random()-0.5);
        const limited = shuffled.slice(0, Math.min(roundsWanted, shuffled.length)).map(t=>t.id);
        btGame = {status:'lobby', categories:cats, difficulties:diffs, pool: limited, roundsTotal: limited.length, timerSeconds: timerWanted, currentTrack:null, options:null, playStartedAt:null, players:{}, round:0};
        await saveBtGame();
        drawBt(inCreator);
      };
    }
    return;
  }

  if(g.status === 'lobby'){
    const key = (viewerName||'').toLowerCase();
    const joined = !inCreator && g.players[key];
    wrap.innerHTML = `
      <div class="tag" style="margin-bottom:4px;">Catégories : ${(g.categories||[]).map(escapeHtml).join(', ')}</div>
      <div class="tag" style="margin-bottom:4px;">Difficulté : ${(g.difficulties||[]).map(escapeHtml).join(', ')}</div>
      <div class="tag" style="margin-bottom:10px;">${g.roundsTotal||'?'} rounds · ${g.timerSeconds||30}s pour trouver</div>
      <div id="btPlayers">${btPlayerRows()}</div>
      ${inCreator ? `
        <div class="modalbtns" style="margin-top:16px;">
          <button class="btn ghost" id="btCloseLobby">✕ Fermer le lobby</button>
          <button class="btn primary" id="btStart" ${Object.keys(g.players).length===0?'disabled':''}>Lancer le blind test</button>
        </div>
      ` : (joined ? `<div class="hint">Tu es dans le lobby ! En attente du lancement...</div>` : `
        <button class="btn primary" id="btJoin" style="width:100%;max-width:260px;margin:14px auto 0;display:block;">Rejoindre le lobby</button>
      `)}
    `;
    if(inCreator){
      document.getElementById('btCloseLobby').onclick = async () => {
        btGame = {status:'idle', categories:[], pool:[], currentTrack:null, options:null, playStartedAt:null, players:{}, round:0};
        await saveBtGame();
        drawBt(inCreator);
      };
      const sb = document.getElementById('btStart');
      if(sb) sb.onclick = () => startBtRound(inCreator);
    } else {
      const jb = document.getElementById('btJoin');
      if(jb) jb.onclick = async () => {
        unlockBtAudio();            // geste de l'utilisateur : la musique pourra démarrer toute seule à chaque manche
        btMyJoin = true;
        jb.disabled = true; jb.textContent = 'Connexion...';
        const k = (viewerName||'').toLowerCase();
        await btMutate(gg => { if(gg.status !== 'lobby' || gg.players[k]) return false; gg.players[k] = btNewPlayer(); return true; },
                       gg => gg.status !== 'lobby' || !!gg.players[k]);
        drawBt(inCreator);
      };
    }
    return;
  }

  if(g.status === 'playing'){
    const key = (viewerName||'').toLowerCase();
    const me = g.players[key];
    const totalPlayers = Object.keys(g.players).length;
    const answeredCount = Object.values(g.players).filter(p=>p.answered).length;
    if(g.currentTrack && btLocalRoundTrackId !== g.currentTrack.id){
      btLocalRoundTrackId = g.currentTrack.id;
      btLocalRoundStartedAt = Date.now();
      btDraftAnswer = '';
    }
    const elapsedNow = btLocalRoundStartedAt ? (Date.now() - btLocalRoundStartedAt)/1000 : 0;
    const remainingNow = Math.max(0, Math.ceil((g.timerSeconds||30) - elapsedNow));
    const timedOut = remainingNow <= 0;
    wrap.innerHTML = `
      <div class="btPlayerBox">
        <div class="tag" id="btRoundTag" style="margin-bottom:6px;">Round ${g.round}/${g.roundsTotal||'?'} · ${answeredCount}/${totalPlayers} ont répondu</div>
        <div class="btTimer" id="btTimerDisplay" style="color:${remainingNow<=10?'var(--rate-red)':'var(--gold)'};">${remainingNow}s</div>
        <div class="btMediaStage" id="btMediaSlot">
          <div class="btBlackCover" id="btBlackCover"></div>
          <div class="btLoading" id="btLoading">Chargement de la musique...</div>
        </div>
        ${(!btSoundUnlocked && !inCreator) ? `<button class="btUnlockBtn" id="btUnlock">Activer le son</button>` : ''}
        ${(btSoundUnlocked && !inCreator) ? `
          <div class="btVolumeRow">
            <span class="hint" style="margin:0;">Volume</span>
            <input type="range" id="btVolumeSlider" min="0" max="100" value="${Math.round(btVolume*100)}">
            
          </div>
        ` : ''}
        ${inCreator ? `
          <button class="btn ghost" id="btReveal" style="width:100%;max-width:260px;margin:14px auto 0;display:block;">Révéler la réponse</button>
        ` : (me && !me.answered && !timedOut ? `
          <div class="btGuessBox" id="btGuessBox">
            <input type="text" id="btGuessInput" placeholder="Tape le titre que tu penses reconnaître..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="search" enterkeyhint="send" value="${escapeHtml(btDraftAnswer)}">
            <div class="btSuggestions" id="btSuggestions"></div>
          </div>
          <button class="btn primary" id="btValidateBtn" style="width:100%;max-width:260px;margin:10px auto 0;display:block;">Valider ma réponse</button>
        ` : me && me.answered ? `<div class="hint">✓ Réponse envoyée, en attente des autres...</div>` : (me && timedOut ? `<div class="hint" style="color:var(--rate-red);">Temps écoulé !</div>` : `<div class="hint">Tu n'as pas rejoint cette partie.</div>`))}
      </div>
      <div class="sectionLabel">Scores</div>
      <div id="btPlayers">${btPlayerRows()}</div>
    `;
    btEnsureMedia();
    btMediaEl.style.width = '100%';
    btMediaEl.style.height = '100%';
    btMediaEl.style.objectFit = 'cover';
    btMediaEl.controls = false;
    btMediaEl.volume = btVolume;
    if(g.currentTrack && btMediaEl.dataset.trackId !== g.currentTrack.id){
      btMediaEl.src = g.currentTrack.audioUrl;
      btMediaEl.dataset.trackId = g.currentTrack.id;
      if(btSoundUnlocked || inCreator) btMediaEl.play().catch(()=>{});
    }
    const slot = document.getElementById('btMediaSlot');
    if(slot && !slot.contains(btMediaEl)) slot.insertBefore(btMediaEl, slot.firstChild);
    btRefreshLoading(inCreator);
    const unlockBtn = document.getElementById('btUnlock');
    if(unlockBtn) unlockBtn.onclick = () => {
      btSoundUnlocked = true;
      btMediaEl.play().catch(()=>{});
      drawBt(inCreator);
    };
    const volumeSlider = document.getElementById('btVolumeSlider');
    if(volumeSlider) volumeSlider.addEventListener('input', () => {
      btVolume = volumeSlider.value / 100;
      btMediaEl.volume = btVolume;
    });
    if(inCreator){
      document.getElementById('btReveal').onclick = () => revealBtRound(inCreator);
    } else {
      const guessInput = document.getElementById('btGuessInput');
      const suggBox = document.getElementById('btSuggestions');
      if(guessInput){
        // calculé une seule fois par manche (et non à chaque rafraîchissement) : une entrée par piste, texte « titre » + texte « large »
        const cacheKey = (g.currentTrack ? g.currentTrack.id : '') + '|' + (g.categories||[]).join(',');
        if(!window.__btSuggestCache || window.__btSuggestCache.key !== cacheKey){
          const poolTracks = btTracks.filter(t => (g.categories||[]).includes(t.category));
          window.__btSuggestCache = {key: cacheKey, entries: poolTracks.map(t => {
            const anime = impliedAnimeName(t);
            const fullText = stripAccents((t.title||'').toLowerCase());
            const wideText = stripAccents([anime, ...(t.aliases||[]), t.category, t.title].filter(Boolean).join(' ').toLowerCase());
            return {title: t.title, fullText, wideText};
          })};
        }
        const trackEntries = window.__btSuggestCache.entries;
        const renderSuggestions = (q) => {
          if(!q){ suggBox.innerHTML = ''; return; }
          const tokens = q.split(/\s+/).filter(Boolean);
          const results = [];
          trackEntries.forEach(e => {
            const inFull = tokens.every(tok => e.fullText.includes(tok));
            const inWide = tokens.every(tok => e.wideText.includes(tok));
            if(inFull) results.push({title: e.title, tier: 'full'});
            else if(inWide) results.push({title: e.title, tier: 'partial'});
          });
          suggBox.innerHTML = results.slice(0,20).map(r => `
            <div class="btSuggestItem" data-t="${escapeHtml(r.title)}" data-tier="${r.tier}">
              ${escapeHtml(r.title)}
            </div>
          `).join('');
        };
        suggBox.onclick = (e) => { const it = e.target.closest('.btSuggestItem'); if(it) submitBtAnswer(it.dataset.t, inCreator); };
        guessInput.addEventListener('input', () => {
          btDraftAnswer = guessInput.value;
          renderSuggestions(stripAccents(guessInput.value.trim().toLowerCase()));
        });
        guessInput.addEventListener('keydown', (e) => {
          if(e.key === 'Enter'){
            const val = guessInput.value.trim();
            if(val) submitBtAnswer(val, inCreator);
          }
        });
        const validateBtn = document.getElementById('btValidateBtn');
        if(validateBtn) validateBtn.onclick = () => {
          const val = guessInput.value.trim();
          if(val) submitBtAnswer(val, inCreator);
        };
        // restaure le brouillon (suggestions + position du curseur) après un rafraîchissement
        if(btDraftAnswer){
          renderSuggestions(stripAccents(btDraftAnswer.trim().toLowerCase()));
        }
        if(document.activeElement !== guessInput){
          guessInput.focus();
          const len = guessInput.value.length;
          guessInput.setSelectionRange(len, len);
        }
      }
    }

    clearInterval(btTimerTick);
    if(btLocalRoundStartedAt){
      const startedAt = btLocalRoundStartedAt;
      btTimerTick = setInterval(() => {
        const timerEl = document.getElementById('btTimerDisplay');
        if(!timerEl){ clearInterval(btTimerTick); return; }
        const elapsed = (Date.now() - startedAt) / 1000;
        const remaining = Math.max(0, Math.ceil((g.timerSeconds||30) - elapsed));
        timerEl.textContent = `${remaining}s`;
        timerEl.style.color = remaining <= 10 ? 'var(--rate-red)' : 'var(--gold)';
        if(remaining <= 0){
          clearInterval(btTimerTick);
          if(inCreator){
            revealBtRound(inCreator);
          } else {
            const guessBox = document.getElementById('btGuessBox');
            if(guessBox){
              guessBox.outerHTML = '<div class="hint" style="color:var(--rate-red);">Temps écoulé !</div>';
            }
          }
        }
      }, 1000);
    }
    return;
  }

  if(g.status === 'revealed'){
    const hasMore = g.pool.length > 0;
    const isVideo = g.currentTrack.mediaType === 'video';
    wrap.innerHTML = `
      <div class="winnerBanner" style="padding:24px 20px;">
        ${isVideo ? `<div id="btRevealVideoSlot" style="max-width:640px;margin:0 auto 14px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);"></div>` : ''}
        <div class="wname" style="font-size:18px;">${escapeHtml(g.currentTrack.title)}</div>
        <div class="tag" style="margin-top:4px;">${escapeHtml(g.currentTrack.category)}</div>
      </div>
      <div class="sectionLabel">Résultats de la manche</div>
      <div id="btPlayers">${btPlayerRows()}</div>
      ${inCreator ? `
        <div class="modalbtns" style="margin-top:16px;">
          <button class="btn ghost" id="btFinish">Terminer</button>
          ${hasMore ? `<button class="btn primary" id="btNextRound">Round suivant</button>` : ''}
        </div>
      ` : ''}
    `;
    if(isVideo && btMediaEl){
      const slot = document.getElementById('btRevealVideoSlot');
      if(slot){
        btMediaEl.style.width = '100%';
        btMediaEl.style.height = 'auto';
        btMediaEl.style.objectFit = 'contain';
        btMediaEl.controls = true;
        if(!slot.contains(btMediaEl)) slot.appendChild(btMediaEl);
        if(btMediaEl.dataset.revealedFor !== g.currentTrack.id){
          btMediaEl.dataset.revealedFor = g.currentTrack.id;
          // ne pas toucher currentTime : la vidéo continue là où elle en était pendant la manche
        }
      }
    } else if(btMediaEl){
      btMediaEl.pause();
    }
    if(inCreator){
      document.getElementById('btFinish').onclick = async () => {
        await finalizeBtGame();
        drawBt(inCreator);
      };
      const nb = document.getElementById('btNextRound');
      if(nb) nb.onclick = () => startBtRound(inCreator);
    }
    return;
  }

  if(g.status === 'finished'){
    wrap.innerHTML = `
      <div class="sectionLabel" style="margin-top:0;">Classement final du blind test</div>
      <div id="btPlayers">${btPlayerRows()}</div>
      ${inCreator ? `<button class="btn primary" id="btNewBt" style="width:100%;margin-top:16px;">Nouveau blind test</button>` : ''}
    `;
    if(inCreator){
      document.getElementById('btNewBt').onclick = async () => {
        btGame = {status:'idle', categories:[], pool:[], currentTrack:null, options:null, playStartedAt:null, players:{}, round:0};
        await saveBtGame();
        drawBt(inCreator);
      };
    }
  }
}

async function startBtRound(inCreator){
  await loadBtGame();
  await loadBtTracks();
  if(!btGame.pool || btGame.pool.length === 0){
    await finalizeBtGame();
    drawBt(inCreator);
    return;
  }
  const trackId = btGame.pool[0];                       // le pool est déjà mélangé à la création du lobby
  btGame.pool = btGame.pool.filter(id => id !== trackId);   // la musique suivante (pool[0]) peut donc être préchargée
  const track = btTracks.find(t => t.id === trackId);
  if(!track){ await saveBtGame(); drawBt(inCreator); return; }

  Object.values(btGame.players).forEach(p => { p.answered = false; p.lastCorrect = null; p.lastPoints = 0; });
  btGame.currentTrack = {
    id: track.id, title: track.title, animeName: track.animeName||'', category: track.category,
    audioUrl: track.audioUrl, mediaType: track.mediaType||'audio', difficulty: track.difficulty||'Normal'
  };
  btGame.playStartedAt = Date.now();
  btGame.status = 'playing';
  btGame.round = (btGame.round||0) + 1;
  await saveBtGame();
  drawBt(inCreator);
}

let btSubmitLock = false;
async function submitBtAnswer(rawText, inCreator){
  if(btSubmitLock) return;
  if(!rawText || !rawText.trim()) return;
  btSubmitLock = true;
  // retour immédiat : le bouton se verrouille et affiche « Envoi... » (plus besoin de retaper)
  const btn = document.getElementById('btValidateBtn');
  const input = document.getElementById('btGuessInput');
  if(btn){ btn.disabled = true; btn.textContent = 'Envoi...'; }
  if(input) input.readOnly = true;
  const restore = () => {
    const b2 = document.getElementById('btValidateBtn'), i2 = document.getElementById('btGuessInput');
    if(b2){ b2.disabled = false; b2.textContent = 'Valider ma réponse'; }
    if(i2) i2.readOnly = false;
  };
  try{
    await loadBtGame();
    const key = (viewerName||'').toLowerCase();
    const me = btGame.players[key];
    if(!me || me.answered || btGame.status !== 'playing'){ drawBt(inCreator); return; }
    const track = btGame.currentTrack;
    const trackFull = btTracks.find(t => t.id === track.id) || {};
    const anime = impliedAnimeName(trackFull) || track.animeName || '';
    const tokens = stripAccents((rawText||'').trim().toLowerCase()).split(/\s+/).filter(Boolean);
    const fullText = stripAccents((track.title||'').toLowerCase());
    const wideText = stripAccents([anime, ...(trackFull.aliases||[]), track.category, track.title].filter(Boolean).join(' ').toLowerCase());

    let tier = null;
    if(tokens.length && tokens.every(tok => fullText.includes(tok))) tier = 'full';
    else if(tokens.length && tokens.every(tok => wideText.includes(tok))) tier = 'partial';
    const correct = tier !== null;

    const elapsed = btLocalRoundStartedAt ? (Date.now() - btLocalRoundStartedAt) / 1000 : 0;
    let points = 0;
    if(correct){
      const timer = btGame.timerSeconds || 30;
      const decayRate = 100 / timer;
      const base = Math.max(0, 100 - elapsed*decayRate);
      const diff = track.difficulty || 'Normal';
      const diffMult = diff === 'Difficile' ? 1.75 : diff === 'Normal' ? 1.25 : 1;
      const tierMult = tier === 'partial' ? 0.5 : 1;
      points = Math.max(20, Math.round(base * diffMult * tierMult));
    }
    const ans = {trackId: track.id, round: btGame.round, text: rawText, correct, points};
    btMyAnswer = ans;          // gardée en mémoire : si une autre écriture l'écrase, elle est rétablie toute seule
    btDraftAnswer = '';
    const ok = await btMutate(
      gg => { const m = gg.players[key]; if(!m || m.answered || gg.status !== 'playing' || !gg.currentTrack || gg.currentTrack.id !== ans.trackId) return false; btApplyAnswer(m, ans); return true; },
      gg => { const m = gg.players[key]; return !!(m && m.answered); });
    if(!ok){
      // connexion instable : on laisse la réponse en attente (elle sera renvoyée automatiquement) sans bloquer le joueur
      restore();
      const gb = document.getElementById('btGuessBox');
      if(gb && !document.getElementById('btRetryNote')) gb.insertAdjacentHTML('afterend', '<div class="hint" id="btRetryNote" style="color:var(--rate-orange);">Connexion instable : ta réponse est renvoyée automatiquement...</div>');
      return;
    }
    drawBt(inCreator);
  } finally {
    btSubmitLock = false;
  }
}

function revealBtRound(inCreator){
  (async () => {
    await loadBtGame();
    btGame.status = 'revealed';
    await saveBtGame();
    drawBt(inCreator);
  })();
}

/* ---------- ROUE DES FILMS ---------- */
let wheelViewFromCreator = true;
let wheelSpinning = false;

function polarToCartesian(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180.0;
  return {x: cx + r * Math.cos(a), y: cy + r * Math.sin(a)};
}
function describeArc(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x} ${end.y} Z`;
}
function truncateLabel(s, n){
  s = s || '';
  return s.length > n ? s.slice(0, n-1) + '…' : s;
}
function buildWheelSVG(wItems){
  const size = 300, cx = size/2, cy = size/2, r = size/2 - 4;
  const n = wItems.length;
  const segAngle = 360 / n;
  const palette = ['#e6b325','#c99a1e','#8a6a15','#f0d060','#b8860b','#9146ff','#d4af37'];
  let paths = '', texts = '';
  wItems.forEach((it, i) => {
    const start = i*segAngle, end = start+segAngle;
    const color = palette[i % palette.length];
    paths += `<path d="${describeArc(cx,cy,r,start,end)}" fill="${color}" stroke="#071a17" stroke-width="1.5"/>`;
    const mid = start + segAngle/2;
    const tx = polarToCartesian(cx, cy, r*0.62, mid);
    texts += `<text x="${tx.x}" y="${tx.y}" fill="var(--ink)" font-size="10" font-family="Space Grotesk, sans-serif" font-weight="700" text-anchor="middle" transform="rotate(${mid}, ${tx.x}, ${tx.y})">${escapeHtml(truncateLabel(it.label,16))}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%">${paths}${texts}</svg>`;
}

      <div id="ucStageWrap"></div>
    </div>
  `;
  wireNav(inCreator ? 'creator' : 'viewer');
  drawUc(inCreator);

    if(ucGame.status === 'idle') return;
    const active = document.activeElement;
    const stageEl = document.getElementById('ucStageWrap');
    const inStage = stageEl && stageEl.contains(active);

    drawUc(inCreator);
    window.scrollTo(0, scrollY);
  }, 1500);
}

async function startUcGame(inCreator){
  await loadUc();
  const keys = Object.keys(ucGame.players);
  const shuffled = keys.slice().sort(() => Math.random()-0.5);
  const numUndercover = Math.min(ucGame.numUndercover, Math.max(1, Math.floor(shuffled.length/3)));
  const mrWhiteKey = ucGame.includeMrWhite ? shuffled[0] : null;
  const undercoverKeys = shuffled.slice(mrWhiteKey ? 1 : 0, (mrWhiteKey?1:0) + numUndercover);

  shuffled.forEach(k => {
    const p = ucGame.players[k];
    if(k === mrWhiteKey){ p.role = 'mrwhite'; p.word = ''; }
    else if(undercoverKeys.includes(k)){ p.role = 'undercover'; p.word = ucGame.undercoverWord; }
    else { p.role = 'civilian'; p.word = ucGame.civilianWord; }
    p.alive = true;
  });

  ucGame.status = 'playing';
  ucGame.round = 1;
  ucGame.votes = {};
  ucGame.lastElimination = null;
  await saveUc();
  drawUc(inCreator);
}

async function castUcVote(targetKey, inCreator){
  await loadUc();
  const key = (viewerName||'').toLowerCase();
  const me = ucGame.players[key];
  if(!me || !me.alive || ucGame.status !== 'voting') { drawUc(inCreator); return; }
  if(!ucGame.votes) ucGame.votes = {};
  ucGame.votes[key] = targetKey;
  await saveUc();
  drawUc(inCreator);
}

function ucCheckWinner(){
  const alive = ucAlivePlayers();
  const civ = alive.filter(([,p]) => p.role === 'civilian').length;
  const bad = alive.filter(([,p]) => p.role !== 'civilian').length;
  if(bad === 0) return 'civilians';
  if(bad >= civ) return 'undercover';
  return null;
}

/* fin d'une partie d'Undercover : le camp gagnant reçoit la 1re place et 1 victoire, les autres la participation */
async function finalizeUcGame(){
  if(ucGame.payoutsDone) return;
  const creatorKey = (viewerName || '').toLowerCase();
  const win = ucGame.winner;
  const isWinner = (p) => win === 'civilians' ? p.role === 'civilian' : (win === 'undercover' ? (p.role === 'undercover' || p.role === 'mrwhite') : p.role === 'mrwhite');
  const cfg = payoutSettings();
  const payouts = {}, winners = [];
  Object.entries(ucGame.players || {}).forEach(([k, p]) => {
    if(k === creatorKey) return;
    if(isWinner(p)){ payouts[k] = cfg.first; winners.push(k); } else payouts[k] = cfg.other;
  });
  ucGame.payoutsDone = true; ucGame.payouts = payouts; ucGame.winners = winners;
  await saveUc();
  for(const [k, amount] of Object.entries(payouts)) await grantRyos(k, ucGame.players[k].display, amount);
  await addWins(winners);
}

async function closeUcVote(inCreator){
  await loadUc();
  const tally = {};
  Object.values(ucGame.votes||{}).forEach(v => { tally[v] = (tally[v]||0) + 1; });
  let topKey = null, topCount = -1;
  Object.entries(tally).forEach(([k,c]) => { if(c > topCount){ topCount = c; topKey = k; } });
  if(!topKey){ ucGame.status = 'playing'; await saveUc(); drawUc(inCreator); return; }

  const eliminated = ucGame.players[topKey];
  eliminated.alive = false;
  ucGame.eliminatedHistory.push({key:topKey, display:eliminated.display, role:eliminated.role});
  ucGame.lastElimination = {display:eliminated.display, role:eliminated.role};

  if(eliminated.role === 'mrwhite'){
    const guessed = confirm(`${eliminated.display} était Mr White. A-t-il/elle deviné le mot des civils (« ${ucGame.civilianWord} ») ?`);
    if(guessed){
      ucGame.status = 'ended';
      ucGame.winner = 'mrwhite';
      await finalizeUcGame();
      drawUc(inCreator);
      return;
    }
  }

  const winner = ucCheckWinner();
  if(winner){
    ucGame.status = 'ended';
    ucGame.winner = winner;
    await finalizeUcGame();
  } else {
    ucGame.status = 'playing';
    ucGame.round += 1;
    ucGame.votes = {};
  }
  await saveUc();
  drawUc(inCreator);
}

function drawWheelSuggestions(){
  const wrap = document.getElementById('wheelSuggList');
  if(!wrap) return;
  const pending = wheelSuggestions.filter(s => s.status === 'pending');
  if(pending.length === 0){
    wrap.innerHTML = `<div class="empty" style="padding:20px 14px;"><div>Aucune proposition en attente.</div></div>`;
    return;
  }
  wrap.innerHTML = pending.map(s => `
    <div class="btTrackRow">
      <span class="t">${escapeHtml(s.title)} <span style="color:var(--text-dim);font-size:11px;">— par ${escapeHtml(s.submittedBy)}</span></span>
      ${s.trailerUrl ? `<a href="${escapeHtml(s.trailerUrl)}" target="_blank" rel="noopener" class="pill" style="text-decoration:none;">Trailer</a>` : ''}
      <button class="del" id="wsApprove-${s.id}" title="Ajouter à la roue">✓</button>
      <button class="del" id="wsReject-${s.id}" title="Refuser">✕</button>
    </div>
  `).join('');
  pending.forEach(s => {
    const app_ = document.getElementById(`wsApprove-${s.id}`);
    if(app_) app_.onclick = async () => {
      await loadWheel();
      await loadWheelSuggestions();
      wheelItems.push({id: 'w-' + Math.random().toString(36).slice(2,9), label: s.title});
      await saveWheel();
      const fresh = wheelSuggestions.find(x => x.id === s.id);
      if(fresh) fresh.status = 'approved';
      await saveWheelSuggestions();
      renderWheel();
    };
    const rej = document.getElementById(`wsReject-${s.id}`);
    if(rej) rej.onclick = async () => {
      await loadWheelSuggestions();
      const fresh = wheelSuggestions.find(x => x.id === s.id);
      if(fresh) fresh.status = 'rejected';
      await saveWheelSuggestions();
      drawWheelSuggestions();
      const countEl = document.getElementById('wsCount');
      if(countEl) countEl.textContent = wheelSuggestions.filter(x=>x.status==='pending').length;
    };
  });
}

function spinTheWheel(){
  if(wheelSpinning || wheelItems.length < 2) return;
  wheelSpinning = true;
  const spinBtn = document.getElementById('spinBtn');
  const resultEl = document.getElementById('wheelResult');
  const actionsEl = document.getElementById('wheelResultActions');
  if(spinBtn) spinBtn.disabled = true;
  resultEl.textContent = '';
  if(actionsEl) actionsEl.style.display = 'none';

  const n = wheelItems.length;
  const segAngle = 360 / n;
  const winnerIndex = Math.floor(Math.random() * n);
  const winner = wheelItems[winnerIndex];
  const center = winnerIndex * segAngle + segAngle / 2;
  const spins = 6 + Math.floor(Math.random() * 3);
  const finalDeg = spins * 360 + (360 - center);

  const spinner = document.getElementById('wheelSpinner');
  spinner.style.transition = 'none';
  spinner.style.transform = 'rotate(0deg)';
  void spinner.offsetWidth;
  requestAnimationFrame(() => {
    spinner.style.transition = 'transform 4.2s cubic-bezier(.17,.67,.22,1.01)';
    spinner.style.transform = `rotate(${finalDeg}deg)`;
  });

  setTimeout(async () => {
    wheelSpinning = false;
    if(spinBtn) spinBtn.disabled = wheelItems.length < 2;
    resultEl.textContent = '' + winner.label;
    wheelState.lastWinner = winner.label;
    wheelState.lastSpinAt = Date.now();
    await saveWheelState();

    if(actionsEl){
      actionsEl.style.display = 'flex';
      const removeBtn = document.getElementById('wheelRemoveBtn');
      const dismissBtn = document.getElementById('wheelDismissBtn');
      removeBtn.onclick = async () => {
        wheelItems = wheelItems.filter(w => w.id !== winner.id);
        await saveWheel();
        renderWheel();
      };
      dismissBtn.onclick = () => { actionsEl.style.display = 'none'; };
    }
  }, 4300);
}

/* ---------- DASHBOARD (créateur) ---------- */
function computeDashboardStats(){
  let best = null, bestVal = 0;
  let mostCommented = null, mostCommentedCount = -1;
  items.forEach(it => {
    const r = overallRating(it);
    if(r > bestVal){ bestVal = r; best = it; }
    const c = (viewerRatings[it.id]||[]).filter(x => x.comment).length;
    if(c > mostCommentedCount){ mostCommentedCount = c; mostCommented = it; }
  });
  const activityMap = {};
  Object.keys(viewerRatings).forEach(k => {
    (viewerRatings[k]||[]).forEach(r => {
      const key = r.who.toLowerCase();
      activityMap[key] = (activityMap[key]||0) + 1;
    });
  });
  let topKey = null, topCount = 0;
  Object.entries(activityMap).forEach(([k,c]) => { if(c > topCount){ topCount = c; topKey = k; } });
  const topDisplay = topKey ? ((viewerProfiles[topKey] && viewerProfiles[topKey].display) || topKey) : null;

  return {
    totalTitles: items.length,
    totalViewers: Object.keys(activityMap).length,
    totalVotes: Object.values(activityMap).reduce((a,b)=>a+b,0),
    best, bestVal,
    mostCommented, mostCommentedCount: mostCommentedCount < 0 ? 0 : mostCommentedCount,
    topDisplay, topCount
  };
}

function renderDashboard(){
  const s = computeDashboardStats();
  app.innerHTML = `
    <div class="page">
      ${navHtml('dashboard','creator')}
      <div class="logo" style="margin-bottom:20px;">
        <h1 style="font-size:28px;">DASHBOARD</h1>
      </div>
      <div class="dashGrid">
        <div class="dashStat"><div class="n">${s.totalTitles}</div><div class="l">Titres au catalogue</div></div>
        <div class="dashStat"><div class="n">${s.totalViewers}</div><div class="l">Viewers actifs</div></div>
        <div class="dashStat"><div class="n">${s.totalVotes}</div><div class="l">Votes reçus au total</div></div>
      </div>
      <div class="sectionLabel" style="margin-top:0;">Temps forts</div>
      ${s.best ? `
        <div class="dashHighlight">
          <div class="dposter" style="${s.best.poster?`background-image:url('${s.best.poster}')`:''}">${s.best.poster?'':posterInitial(s.best.title)}</div>
          <div class="dinfo"><div class="dlabel">Titre le mieux noté</div><div class="dtitle">${escapeHtml(s.best.title)}</div></div>
          <div class="dvalue" style="color:${ratingColor(s.bestVal)}">${s.bestVal.toFixed(1)}/10</div>
        </div>
      ` : ''}
      ${s.mostCommented && s.mostCommentedCount > 0 ? `
        <div class="dashHighlight">
          <div class="dposter" style="${s.mostCommented.poster?`background-image:url('${s.mostCommented.poster}')`:''}">${s.mostCommented.poster?'':posterInitial(s.mostCommented.title)}</div>
          <div class="dinfo"><div class="dlabel">Titre le plus commenté</div><div class="dtitle">${escapeHtml(s.mostCommented.title)}</div></div>
          <div class="dvalue">${s.mostCommentedCount}</div>
        </div>
      ` : ''}
      ${s.topDisplay ? `
        <div class="dashHighlight">
          <div class="dposter" style="display:flex;align-items:center;justify-content:center;">${posterInitial(s.topDisplay)}</div>
          <div class="dinfo"><div class="dlabel">Viewer le plus actif</div><div class="dtitle">${escapeHtml(s.topDisplay)}</div></div>
          <div class="dvalue">${s.topCount}</div>
        </div>
      ` : ''}
      ${!s.best && !s.mostCommented && !s.topDisplay ? `<div class="empty"><div>Pas encore assez de données pour afficher des temps forts.</div></div>` : ''}
    </div>
  `;
  wireNav('creator');
}

/* ---------- BADGES ---------- */
const BADGE_DEFS = [
  {id:'first_review', icon:'', label:'Premier avis', check: s => s.comments >= 1},
  {id:'critic', icon:'', label:'Critique confirmé', check: s => s.comments >= 5},
  {id:'ten_films', icon:'', label:'10 films notés', check: s => s.filmsRated >= 10},
  {id:'series_fan', icon:'', label:'Fan de séries', check: s => s.showsRated >= 1},
  {id:'marathon', icon:'', label:'Marathonien', check: s => s.episodesRated >= 10},
  {id:'gamer', icon:'', label:'Joueur', check: s => s.gamePoints > 0},
  {id:'podium', icon:'', label:'Top 3 classement', check: s => s.rank && s.rank <= 3},
];

function getViewerCommentsCount(key){
  let c = 0;
  items.forEach(it => {
    (viewerRatings[it.id]||[]).forEach(r => { if(r.who.toLowerCase() === key && r.comment) c++; });
  });
  return c;
}
function getLeaderboardRank(key){
  const rows = Object.entries(gameScores).sort((a,b) => b[1]-a[1]);
  const idx = rows.findIndex(([k]) => k === key);
  return idx >= 0 ? idx+1 : null;
}
function getViewerBadges(key){
  const base = getViewerStats(key);
  const stats = {...base, comments: getViewerCommentsCount(key), gamePoints: gameScores[key]||0, rank: getLeaderboardRank(key)};
  return BADGE_DEFS.map(b => ({...b, earned: !!b.check(stats)}));
}
function badgesRowHtml(key){
  const badges = getViewerBadges(key);
  return `<div class="badgesRow">${badges.map(b => `
    <div class="badgeChip ${b.earned ? 'earned' : ''}" title="${escapeHtml(b.label)}">
      ${escapeHtml(b.label)}
    </div>
  `).join('')}</div>`;
}

async function processSession(sessionPromise){
  const { data: { session } } = await (sessionPromise || supabaseClient.auth.getSession());
  if(!session) return false;

  const meta = session.user.user_metadata || {};
  const identNick = meta.nickname || meta.preferred_username || meta.full_name || meta.name || meta.pseudo || '';
  const isCreator = session.user.id === CREATOR_UID;

  if(identNick){
    const key = identNick.toLowerCase();
    const existing = viewerProfiles[key] || {};
    const display = existing.display || identNick;
    viewerName = display;
    const before = JSON.stringify(viewerProfiles[key] || null);
    viewerProfiles[key] = {
      display,
      avatar: existing.avatar || meta.avatar_url || '',
      bio: existing.bio || ''
    };
    // on n'écrit le profil que s'il a vraiment changé, et sans bloquer l'affichage de la page
    if(JSON.stringify(viewerProfiles[key]) !== before) saveProfiles();
  }

  if(isCreator){
    isCreatorAccount = true;
    mode = 'creator';
  } else if(identNick){
    mode = 'viewer';
  }
  return true;
}

          et colle tes vraies valeurs récupérées dans Supabase (Settings → API).
        </p>
      </div>
    `;

  }
  // 1) l'essentiel pour la page d'arrivée (Stream), chargé en parallèle : profils, réglages, session
  const sessionPromise = supabaseClient.auth.getSession();

  dataLoaded = false;

  ]).then(() => { dataLoaded = true; });

  render();
})();
