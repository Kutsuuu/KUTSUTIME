<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kutsu Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e0e; --panel:#161616; --panel-2:#1c1c1c; --panel-3:#262626;
    --paper:#f0e4c3; --ink:#1b1206;
    --gold:#c8402a; --gold-dim:#7a2718; --mustard:#d9a52c;
    --red:#e0455f;
    --twitch:#9146ff; --twitch-dim:#5c2ea6;
    --rate-red:#e5484d; --rate-orange:#f5a524; --rate-blue:#3b82f6; --rate-green:#3fae5c;
    --text:#f4f4f4; --text-dim:#9a9a9a; --border:rgba(255,255,255,0.12);
    --shadow-sm:0 2px 10px rgba(0,0,0,0.3);
    --shadow-md:0 14px 32px -10px rgba(0,0,0,0.65);
    --shadow-lg:0 30px 70px -20px rgba(0,0,0,0.75);
    --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text); font-family:'Space Grotesk',sans-serif; min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  ::selection{background:rgba(200,64,42,0.4);}

  .wrap{max-width:1800px;margin:0 auto;padding:0 clamp(20px,4vw,64px) 90px;}
  .wrap.narrow{max-width:440px;padding-top:60px;}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .page{animation:fadeIn .3s ease;}

  /* ---------- sidebar (rail façon YouTube / Twitch) ---------- */
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:220px;z-index:30;
    background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:22px 0;overflow-y:auto;
  }
  .sidebarLogo{
    cursor:pointer;user-select:none;padding:0 22px 22px;margin-bottom:6px;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;line-height:1.15;
    letter-spacing:0.5px;color:var(--gold);border-bottom:1px solid var(--border);
  }
  .sidebarNav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .sidebarLink{
    display:flex;align-items:center;gap:14px;width:calc(100% - 20px);margin:0 10px;
    padding:11px 16px;border:none;background:none;border-radius:var(--r-sm);
    color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;
    cursor:pointer;white-space:nowrap;text-align:left;transition:.15s;
  }
  .sidebarLink .sIcon{font-size:17px;flex:0 0 auto;width:20px;text-align:center;}
  .sidebarLink:hover{background:var(--panel-2);color:var(--text);}
  .sidebarLink.active{background:var(--panel-3);color:var(--gold);}
  .sidebarLogin{background:var(--gold);color:#fff;font-weight:700;justify-content:center;}
  .sidebarLogin:hover{background:var(--gold);color:#fff;filter:brightness(1.12);}
  .sidebarBottom{
    display:flex;flex-direction:column;gap:2px;padding-top:14px;margin-top:10px;
    border-top:1px solid var(--border);
  }

  .logo h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(30px,7vw,44px);
    letter-spacing:1.5px;margin:0;
    color:var(--gold);
  }
  .logo .tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2.5px;color:var(--text-dim);text-transform:uppercase;margin-top:4px;}
  .logo.center{text-align:center;}

  .hero{text-align:center;padding:38px 0 34px;}

  .addbtn{
    background:var(--panel-3);color:var(--text);border:none;border-radius:var(--r-pill);
    padding:11px 20px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;white-space:nowrap;transition:.15s;box-shadow:none;
  }
  .addbtn:hover{filter:brightness(1.25);}
  #openAdd{background:var(--gold);color:#fff;}
  .addbtn:active{filter:brightness(0.9);}

  .pill{
    background:none;border:none;border-radius:0;
    padding:9px 10px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;color:var(--text-dim);
    cursor:pointer;white-space:nowrap;transition:.15s;display:inline-flex;align-items:center;gap:6px;
  }
  .pill:hover{color:var(--text);}
  .pill.active{color:var(--gold);}

  .controls{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center;}
  .search{
    flex:1;min-width:200px;
    display:flex;align-items:center;gap:10px;
    background:#111111;border:1px solid var(--border);border-radius:var(--r-pill);padding:12px 16px;
    transition:border-color .15s;
  }
  .search:focus-within{border-color:var(--gold-dim);}
  .search input{
    flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  .search .ic{color:var(--text-dim);}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;background:none;border:none;padding:0;}
  .tab{
    padding:8px 16px;border-radius:var(--r-pill);border:none;background:var(--panel-2);color:var(--text-dim);
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;
    cursor:pointer;transition:.15s;position:relative;
  }
  .tab.active{background:var(--text);color:var(--bg);}
  .tab:hover:not(.active){background:var(--panel-3);color:var(--text);}

  .selectBox{
    background:#111111;border:1px solid var(--border);border-radius:var(--r-pill);
    padding:11px 14px;color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;
    cursor:pointer;outline:none;transition:border-color .15s;
  }
  .selectBox:focus, .selectBox:hover{border-color:var(--gold-dim);color:var(--text);}
  .selectBox option{background:#1a1a1a;color:var(--text);}

  .sectionLabel{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--text-dim);margin:26px 0 12px;display:flex;align-items:center;gap:10px;
  }
  .sectionLabel::after{content:'';flex:1;height:1px;background:var(--border);}
  .sagaBlock{margin-bottom:8px;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;
  }
  .card{
    cursor:pointer;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    display:flex;flex-direction:column;box-shadow:var(--shadow-sm);
  }
  .card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.28);box-shadow:var(--shadow-md);}
  .card .poster{
    width:100%;aspect-ratio:2/3;background:#111111 center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:30px;
    position:relative;border-radius:0;overflow:hidden;
  }
  .card .poster::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.35));
    pointer-events:none;
  }
  .card .badge{
    position:absolute;top:8px;left:8px;z-index:1;
    background:rgba(11,10,18,0.85);border:1px solid var(--border);
    color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;
    padding:3px 7px;border-radius:var(--r-pill);text-transform:uppercase;
  }
  button.badge{cursor:default;}
  .card .badge.rediff{
    left:auto;right:8px;
    color:var(--red);border-color:rgba(200,30,58,0.4);
    cursor:pointer;transition:.15s;
  }
  .card .badge.rediff:hover{background:rgba(200,30,58,0.25);transform:scale(1.05);}
  .favBtn{
    position:absolute;bottom:8px;right:8px;z-index:1;
    color:#fff;
    width:28px;height:28px;border-radius:50%;
    background:rgba(0,0,0,0.55);border:none;
    display:flex;align-items:center;justify-content:center;font-size:13px;
    cursor:pointer;transition:.15s;
  }
  .favBtn:hover{transform:scale(1.1);border-color:var(--gold-dim);}
  .favBtn.active{color:#ff6b8b;border-color:rgba(255,107,139,0.5);background:rgba(255,107,139,0.15);}
  .card .info{padding:11px 13px 13px;}
  .card .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;line-height:1.3;margin-bottom:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .year{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);margin-bottom:8px;}
  .ratingsRow{display:flex;gap:5px;flex-wrap:wrap;}
  .rchip{
    display:inline-flex;align-items:center;gap:3px;background:#111111;border:1px solid var(--border);
    border-radius:var(--r-pill);padding:3px 6px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  }
  .rchip.avg{font-size:13px;padding:4px 12px;}

  .empty{
    text-align:center;padding:64px 22px;color:var(--text-dim);
    border:1px solid var(--border);border-radius:var(--r-lg);
    background:var(--panel);
  }
  .empty .ic{
    width:54px;height:54px;border-radius:50%;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;
  }
  .empty .btn2{
    margin-top:18px;background:var(--gold);color:#fff;border:none;border-radius:var(--r-pill);
    padding:11px 22px;font-weight:700;font-size:13px;cursor:pointer;transition:.15s;
  }
  .empty .btn2:hover{filter:brightness(1.3);}

  /* modal */
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .overlay{
    position:fixed;inset:0;background:rgba(5,4,9,0.78);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;
  }
  .modal{
    background:var(--panel-2);
    border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;max-width:460px;width:100%;
    box-shadow:var(--shadow-lg);animation:modalIn .2s cubic-bezier(.2,.8,.2,1);
  }
  .modal h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:23px;color:var(--gold);margin:0 0 20px;letter-spacing:0.5px;}
  label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:7px;}
  input[type=text], input[type=password], input[type=email], input[type=datetime-local], textarea{
    width:100%;background:#111111;border:1px solid var(--border);border-radius:var(--r-sm);
    padding:11px 13px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:14px;margin-bottom:15px;outline:none;
    transition:border-color .15s;
  }
  input[type=text]:focus, input[type=password]:focus, input[type=email]:focus, input[type=datetime-local]:focus, textarea:focus{border-color:var(--gold);}
  .search input[type=text]{width:auto;flex:1;background:none;border:none;border-radius:0;padding:0;margin:0;}
  .search input[type=text]:focus{border:none;}
  textarea{resize:vertical;min-height:60px;}
  .typetoggle{display:flex;gap:8px;margin-bottom:15px;}
  .typebtn{
    flex:1;padding:10px 12px;border-radius:var(--r-pill);border:none;background:var(--panel-3);
    color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;
  }
  .typebtn.active{background:var(--text);color:var(--bg);}
  .posterrow{display:flex;gap:14px;margin-bottom:15px;align-items:flex-start;}
  .posterpreview{
    width:80px;height:120px;border-radius:var(--r-sm);background:#111111 center/cover no-repeat;
    border:1px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:22px;
  }
  .posterfields{flex:1;}
  .filebtn{
    display:inline-block;background:none;border:none;
    padding:9px 0;font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--gold);cursor:pointer;margin-bottom:8px;transition:.15s;
  }
  .filebtn:hover{filter:brightness(1.3);}
  input[type=file]{display:none;}
  .row2{display:flex;gap:10px;}
  .row2 input{flex:1;}
  .modalbtns{display:flex;gap:10px;margin-top:8px;}
  .btn{flex:1;padding:12px 4px;border-radius:0;border:none;background:none;font-weight:700;font-size:13px;cursor:pointer;transition:.15s;}
  .btn.primary{background:var(--gold);color:#fff;border-radius:var(--r-pill);padding:12px 22px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
  .btn.primary:hover{filter:brightness(1.12);}
  .btn.ghost{background:none;border:none;color:var(--text-dim);}
  .btn.ghost:hover{color:var(--text);}
  .btn.danger{background:none;border:none;color:var(--red);}
  .btn.danger:hover{filter:brightness(1.2);}
  .btn.twitch{background:var(--twitch);color:#fff;border-radius:var(--r-pill);padding:13px 22px;}
  .btn.twitch:hover{filter:brightness(1.12);}

  /* detail */
  .detailhead{display:flex;gap:18px;margin-bottom:18px;}
  .detailposter{width:120px;height:180px;border-radius:var(--r-sm);background:#111111 center/cover no-repeat;border:1px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--text-dim);box-shadow:var(--shadow-sm);}
  .detailinfo h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:var(--text);margin:0 0 6px;}
  .detailinfo .metaline{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-bottom:12px;}
  .ratebox{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .ratebox input{
    width:80px;background:#111111;border:1px solid var(--border);border-radius:var(--r-sm);
    padding:9px 10px;color:var(--gold);font-family:'Space Grotesk',sans-serif;font-size:20px;text-align:center;
    outline:none;margin-bottom:0;
  }
  .ratebox input:focus{border-color:var(--gold);}
  .ratebox .outof{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);}
  .ratebox.viewer input{color:var(--twitch);}
  .synopsis{font-size:13px;color:var(--text-dim);line-height:1.65;margin-bottom:18px;}
  .rediffLink{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(200,30,58,0.12);border:1px solid rgba(200,30,58,0.4);
    color:var(--red);text-decoration:none;font-weight:700;font-size:13px;
    padding:9px 14px;border-radius:var(--r-pill);margin-bottom:18px;transition:.15s;
  }
  .rediffLink:hover{background:rgba(200,30,58,0.2);}
  .pubbox{
    background:#111111;border:1px solid var(--border);border-radius:var(--r-md);
    padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;
  }
  .pubbox .l{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;}
  .pubbox .v{font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--twitch);}
  .pubbox + .pubbox{margin-top:-4px;}
  .pubbox:last-of-type{margin-bottom:18px;}

  /* role select */
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:640px;margin:0 auto;}
  @media (max-width:520px){ .role-grid{grid-template-columns:1fr;} }
  .role-card{
    background:var(--panel-2);
    border:1px solid var(--border);border-radius:var(--r-md);
    padding:30px 24px;text-align:left;cursor:pointer;color:var(--text);
    transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s ease, box-shadow .18s ease;
    box-shadow:var(--shadow-sm);
  }
  .role-card:hover{transform:translateY(-5px);border-color:var(--gold-dim);box-shadow:var(--shadow-md);}
  .role-card .icon{
    width:48px;height:48px;border-radius:var(--r-sm);background:var(--panel-3);
    display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;
  }
  .role-card .title{font-family:'Space Grotesk',sans-serif;font-size:19px;letter-spacing:1px;color:var(--gold);}
  .role-card .desc{font-size:13px;color:var(--text-dim);margin-top:8px;line-height:1.55;}

  .twitchbox{
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;
    box-shadow:var(--shadow-sm);
  }
  .loginCountdownBox{
    background:var(--panel-2);border:1px solid var(--gold-dim);border-radius:var(--r-xl);padding:18px;text-align:center;
  }
  .loginCountdownValue{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(20px,5vw,28px);color:var(--gold);letter-spacing:1px;white-space:nowrap;
  }
  .hint{font-size:12px;color:var(--text-dim);text-align:center;margin-top:10px;line-height:1.6;}
  .back{
    background:none;border:none;color:var(--text-dim);
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;
    cursor:pointer;margin-bottom:18px;display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .back:hover{color:var(--gold);}
  .viewerTag{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--twitch);
    background:rgba(145,70,255,0.12);border:1px solid rgba(145,70,255,0.35);
    padding:7px 13px;border-radius:var(--r-pill);
  }

  .vrow{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
    padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s;
  }
  .vrow:hover{border-color:var(--twitch);background:var(--panel-2);transform:translateX(3px);}
  .vavatar{
    width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    background:var(--twitch);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-size:16px;color:#fff;
  }
  .vinfo{flex:1;min-width:0;}
  .vinfo .vname{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--text);}
  .vinfo .vsub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-top:2px;}
  .vavg{font-family:'Space Grotesk',sans-serif;font-size:20px;flex:0 0 auto;}

  .mrow{
    display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
    padding:10px 14px;margin-bottom:8px;
  }
  .mrow .mposter{
    width:38px;height:54px;border-radius:var(--r-sm);background:#111111 center/cover no-repeat;
    flex:0 0 auto;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-dim);
  }
  .mrow .mtitle{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:var(--text);}
  .mrow .mscore{font-family:'Space Grotesk',sans-serif;font-size:18px;flex:0 0 auto;}

  .comment{
    background:#111111;border:1px solid var(--border);border-radius:var(--r-md);
    padding:12px 14px;margin-bottom:8px;
  }
  .comment .who{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--twitch);
  }
  .comment .txt{font-size:13px;color:var(--text-dim);line-height:1.5;}
  .commentsTitle{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--text-dim);margin:18px 0 10px;
  }
  .ratersList{max-height:220px;overflow-y:auto;margin-bottom:6px;}
  .raterRow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 0;border-bottom:1px solid var(--border);
    font-family:'Space Grotesk',sans-serif;font-size:13px;
  }
  .raterRow:last-child{border-bottom:none;}
  .raterName{font-weight:600;color:var(--text);}
  .raterScore{font-weight:700;font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:nowrap;}

  .schbtn{
    background:none;border:none;color:var(--text-dim);
    padding:5px 8px;font-size:11px;cursor:pointer;transition:.15s;
  }
  .schbtn:hover{color:var(--gold);}
  .schbtn.del:hover{color:var(--red);}
  .todaytag{
    background:rgba(255,138,92,0.2);color:var(--gold);font-family:'JetBrains Mono',monospace;
    font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:var(--r-pill);margin-left:8px;text-transform:uppercase;
  }

  .weekNav{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-bottom:20px;flex-wrap:wrap;
  }
  .weekLabel{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:1px;color:var(--text);
    background:#111111;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 16px;
  }
  .weekGrid{
    display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:12px;
    overflow-x:auto;padding-bottom:8px;
  }
  .dayCol{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
    padding:12px;min-height:200px;display:flex;flex-direction:column;transition:.15s;
  }
  .dayCol.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .dayColHead{
    text-align:center;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border);
  }
  .dowName{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;
  }
  .dowDate{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--gold);margin-top:3px;}
  .dayColBody{flex:1;display:flex;flex-direction:column;gap:8px;}
  .dayEmpty{
    flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;font-size:12px;opacity:0.5;
  }
  .evCard{
    background:#111111;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;position:relative;
  }
  .evTime{
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:0.5px;margin-bottom:3px;
  }
  .evTitle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;color:var(--text);line-height:1.3;}
  .evNote{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.4;}
  .evActions{display:flex;gap:5px;margin-top:7px;}
  .addDayBtn{
    background:none;border:none;color:var(--text-dim);
    padding:8px 0;font-size:11px;cursor:pointer;font-family:'Space Grotesk',sans-serif;margin-top:auto;
  }
  .addDayBtn:hover{color:var(--gold);}

  @media(max-width:900px){
    .weekGrid{grid-auto-flow:column;grid-template-columns:none;}
    .dayCol{width:150px;flex:0 0 150px;}
  }

  .episodesBtn{
    width:100%;background:var(--panel-3);border:1px solid var(--gold-dim);border-radius:var(--r-sm);
    color:var(--gold);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
    padding:11px;cursor:pointer;margin-bottom:16px;transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .episodesBtn:hover{filter:brightness(1.1);}
  .seasonBlock{margin-bottom:16px;}
  .seasonHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .seasonTitle{font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--gold);letter-spacing:0.5px;}
  .seasonActions{display:flex;gap:6px;}
  .epRow{
    display:flex;align-items:center;gap:10px;
    background:#111111;border:1px solid var(--border);border-radius:var(--r-md);
    padding:8px 12px;margin-bottom:6px;
  }
  .epNum{
    width:30px;text-align:center;font-family:'JetBrains Mono',monospace;color:var(--text-dim);font-size:11px;flex:0 0 auto;
  }
  .epLabel{flex:1;font-family:'Space Grotesk',sans-serif;font-size:12.5px;color:var(--text-dim);}
  .epInput{
    width:52px;background:#131a30;border:1px solid var(--border);border-radius:var(--r-xs);
    padding:6px;color:var(--text);font-family:'Anton',sans-serif;text-align:center;font-size:13px;outline:none;flex:0 0 auto;
  }
  .epInput:focus{border-color:var(--gold);}
  .epDel{
    background:none;border:none;color:var(--text-dim);
    padding:5px 8px;font-size:11px;cursor:pointer;flex:0 0 auto;
  }
  .epDel:hover{color:var(--red);}
  .addEpBtn, .addSeasonBtn{
    background:none;border:none;color:var(--text-dim);
    padding:8px 0;font-size:12px;cursor:pointer;width:100%;margin-top:4px;font-family:'Space Grotesk',sans-serif;text-align:left;
  }
  .addEpBtn:hover, .addSeasonBtn:hover{color:var(--gold);}
  .delSeasonBtn{
    background:none;border:none;color:var(--text-dim);font-size:11px;cursor:pointer;
    font-family:'JetBrains Mono',monospace;
  }
  .delSeasonBtn:hover{color:var(--red);}

  .avatarRow{display:flex;gap:14px;align-items:center;margin-bottom:15px;}
  .avatarPreview{
    width:64px;height:64px;border-radius:50%;flex:0 0 auto;
    background:var(--panel-3) center/cover no-repeat;
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--text-dim);overflow:hidden;
  }
  .avatarPreview img{width:100%;height:100%;object-fit:cover;}

  .statsRow{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;}
  .statBox{
    flex:1;min-width:90px;background:#111111;border:1px solid var(--border);border-radius:var(--r-md);
    padding:12px;text-align:center;
  }
  .statBox .n{font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--gold);}
  .statBox .l{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin-top:3px;}

  .bioText{
    font-size:13px;color:var(--text-dim);line-height:1.6;margin-bottom:16px;
    background:#111111;border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;
  }

  .twitchEmbedWrap{
    position:relative;width:100%;border-radius:var(--r-lg);overflow:hidden;
    border:1px solid var(--border);box-shadow:var(--shadow-md);background:#000;
    aspect-ratio:16/9;
  }
  .twitchEmbedWrap iframe{width:100%;height:100%;border:none;display:block;}
  .streamLayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:stretch;}
  .streamChat{
    position:relative;min-height:440px;border-radius:var(--r-lg);overflow:hidden;
    border:1px solid var(--border);background:#0e0e10;box-shadow:var(--shadow-md);
  }
  .streamChat iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
  @media(max-width:900px){
    .streamLayout{grid-template-columns:1fr;}
    .streamChat{min-height:460px;}
  }
  .watchBar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:14px 18px;margin-top:12px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);
  }
  .watchMine{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .watchMine .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:30px;color:var(--gold);}
  .watchMine .l{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);}
  .watchMine .m{font-size:12.5px;color:var(--text-dim);}
  .watchStatus{
    padding:7px 14px;border-radius:var(--r-pill);background:var(--panel-3);color:var(--text-dim);
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;
  }
  .watchStatus.on{background:rgba(63,174,92,0.15);color:var(--rate-green);}
  .watchCreator{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .watchCreator input[type=text]{width:80px;margin:0;}
  .streamOfflineCard{
    text-align:center;padding:70px 24px;border:1px solid var(--border);border-radius:var(--r-lg);color:var(--text-dim);
  }

  .gamesGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:30px;}
  .gameCard{
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:22px;cursor:pointer;transition:.18s;box-shadow:var(--shadow-sm);
  }
  .gameCard:hover{transform:translateY(-4px);border-color:var(--gold-dim);box-shadow:var(--shadow-md);}
  .gameCard .gicon{font-size:30px;margin-bottom:10px;}
  .gameCard .gtitle{font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--gold);margin-bottom:6px;}
  .gameCard .gdesc{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .myPointsBox{
    display:flex;align-items:center;gap:14px;background:var(--panel-3);border:1px solid var(--gold-dim);
    border-radius:var(--r-lg);padding:16px 20px;margin-bottom:26px;
  }
  .myPointsBox .n{font-family:'Space Grotesk',sans-serif;font-size:30px;color:var(--gold);}
  .myPointsBox .l{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;}
  .lbRow{
    display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--r-md);padding:12px 16px;margin-bottom:8px;
  }
  .lbRow.me{border-color:var(--gold);}
  .lbRank{width:26px;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--text-dim);flex:0 0 auto;}
  .lbRank.top1{color:#ffd700;} .lbRank.top2{color:#c0c0c0;} .lbRank.top3{color:#cd7f32;}
  .lbName{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;}
  .lbPts{font-family:'Space Grotesk',sans-serif;color:var(--gold);font-size:15px;}

  .gameStage{text-align:center;padding:10px 0;}
  .clickTarget{
    width:110px;height:110px;border-radius:50%;margin:20px auto;
    background:var(--gold);
    border:none;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:16px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;user-select:none;
    box-shadow:var(--shadow-md);transition:transform .06s;
  }
  .clickTarget:active{transform:scale(0.92);}
  .gameTimer{font-family:'Space Grotesk',sans-serif;font-size:26px;color:var(--gold);margin-bottom:6px;}
  .gameCount{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);}
  .quizOptions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;}
  .quizOpt{
    flex:1;min-width:140px;background:#111111;border:1px solid var(--border);border-radius:var(--r-md);
    padding:16px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;color:var(--text);
    transition:.15s;
  }
  .quizOpt:hover{border-color:var(--gold-dim);background:var(--panel-3);}
  .quizOpt.correct{border-color:var(--rate-green);background:rgba(34,197,94,0.15);}
  .quizOpt.wrong{border-color:var(--rate-red);background:rgba(229,72,77,0.15);}

  .winnerBanner{
    text-align:center;padding:40px 20px;
  }
  .winnerBanner .wicon{font-size:48px;margin-bottom:14px;}
  .winnerBanner .wname{font-family:'Space Grotesk',sans-serif;font-size:26px;color:var(--gold);}

  /* Blind Test */
  .btCatGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
  .btCatChip{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;text-align:center;
    cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--text-dim);transition:.15s;
  }
  .btCatChip .n{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:4px;font-weight:500;}
  .btCatChip.selected{border-color:var(--gold);color:var(--gold);background:var(--panel-2);}
  .btPlayerBox{text-align:center;padding:20px 0;}
  .btMediaStage{
    width:100%;max-width:640px;margin:0 auto 18px;aspect-ratio:16/9;border-radius:var(--r-lg);
    background:#000;border:1px solid var(--border);
    position:relative;overflow:hidden;
  }
  .btBlackCover{
    position:absolute;inset:0;background:#000;z-index:2;
    display:flex;align-items:center;justify-content:center;font-size:34px;
  }
  .btBlackCover::after{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(90deg, var(--gold) 0 3px, transparent 3px 8px);
    opacity:0.08;animation:btWave 1s linear infinite;
  }
  @keyframes btWave{ from{background-position-x:0;} to{background-position-x:40px;} }
  .btUnlockBtn{
    background:var(--gold);color:var(--ink);border:none;border-radius:var(--r-pill);
    padding:16px 26px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;cursor:pointer;
  }
  .btVolumeRow{
    display:flex;align-items:center;gap:10px;max-width:260px;margin:0 auto 14px;
    font-size:15px;
  }
  .btVolumeRow input[type="range"]{
    flex:1;accent-color:var(--gold);height:4px;cursor:pointer;margin:0;
  }
  .btGuessBox{position:relative;max-width:400px;margin:0 auto;}
  .btGuessBox input{
    width:100%;background:#111111;border:1px solid var(--border);border-radius:var(--r-pill);
    padding:13px 16px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:14px;outline:none;
  }
  .btGuessBox input:focus{border-color:var(--gold);}
  .btSuggestions{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:10;
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-md);
    max-height:260px;overflow-y:auto;
  }
  .btSuggestItem{
    padding:12px 16px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;
    text-align:left;border-bottom:1px solid var(--border);
  }
  .btSuggestItem:last-child{border-bottom:none;}
  .btSuggestItem:hover{background:var(--panel-3);color:var(--gold);}
  .btOpt{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
    padding:16px 12px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;color:var(--text);
    transition:.15s;
  }
  .btOpt:hover:not(:disabled){border-color:var(--gold);}
  .btOpt:disabled{cursor:not-allowed;opacity:0.6;}
  .btOpt.correct{border-color:var(--rate-green);background:rgba(63,174,92,0.15);}
  .btOpt.wrong{border-color:var(--rate-red);background:rgba(229,72,77,0.15);}
  .btTimer{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--gold);margin-bottom:10px;}
  .btRoundPlayerRow{
    display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--r-md);padding:10px 14px;margin-bottom:8px;
  }
  .btRoundPlayerRow .n{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;}
  .btRoundPlayerRow .st{font-family:'JetBrains Mono',monospace;font-size:11px;}
  .btRoundPlayerRow .pts{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--gold);}
  .btTrackList{margin-top:10px;}
  .btDropzone{
    border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 16px;text-align:center;
    cursor:pointer;transition:.15s;background:#111111;margin-bottom:10px;
  }
  .btDropzone:hover, .btDropzone.dragover{border-color:var(--gold);background:var(--panel-2);}
  .btDropzone.dragover{border-style:solid;}
  .btDropIcon{font-size:28px;margin-bottom:8px;}
  .btDropzone .hint{margin:0;}
  .btTrackRow{
    display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--r-md);padding:9px 12px;margin-bottom:7px;
  }
  .btTrackRow .cat{
    font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;
    color:var(--mustard);border:1px solid var(--mustard);border-radius:var(--r-pill);padding:2px 6px;flex:0 0 auto;
  }
  .btTrackRow .t{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;}
  .btTrackRow .del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:13px;}
  .btTrackRow .del:hover{color:var(--red);}


  /* Wheel */
  .wheelLayout{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;}
  .wheelStageBox{flex:0 0 auto;text-align:center;}
  .wheelWrap{position:relative;width:300px;height:300px;margin:0 auto;}
  .wheelSpinner{width:100%;height:100%;border-radius:50%;box-shadow:var(--shadow-lg);border:4px solid var(--panel-3);overflow:hidden;}
  .wheelPointer{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;
    border-top:24px solid var(--gold);z-index:2;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }
  .spinBtn{
    margin-top:22px;background:var(--gold);color:#fff;border:none;
    border-radius:var(--r-pill);padding:14px 34px;font-family:'Space Grotesk',sans-serif;font-size:16px;cursor:pointer;
    box-shadow:none;transition:.15s;
  }
  .spinBtn:hover{filter:brightness(1.3);}
  .spinBtn:disabled{opacity:0.5;cursor:not-allowed;}
  .wheelResult{
    margin-top:16px;font-family:'Space Grotesk',sans-serif;font-size:20px;color:var(--gold);min-height:28px;
  }
  .wheelResultActions{display:flex;gap:8px;justify-content:center;margin-top:10px;}
  .wheelResultActions .btn{flex:0 0 auto;padding:9px 16px;font-size:12px;}
  .wheelManage{flex:1;min-width:260px;}
  .wheelAddRow{display:flex;gap:8px;margin-bottom:16px;}
  .wheelAddRow input{margin-bottom:0;flex:1;}
  .wheelListItem{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;margin-bottom:7px;
  }
  .wheelListItem .wlLabel{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;}
  .wheelListItem .wlDel{background:none;border:none;color:var(--text-dim);padding:5px 9px;cursor:pointer;font-size:11px;}
  .wheelListItem .wlDel:hover{color:var(--red);}

  /* Dashboard */
  .dashGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:28px;}
  .dashStat{
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:18px;text-align:center;
  }
  .dashStat .n{font-family:'Space Grotesk',sans-serif;font-size:28px;color:var(--gold);}
  .dashStat .l{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-top:4px;}
  .dashHighlight{
    display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--r-md);padding:16px;margin-bottom:14px;
  }
  .dashHighlight .dposter{width:56px;height:80px;border-radius:var(--r-xs);background:#111111 center/cover no-repeat;flex:0 0 auto;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-dim);}
  .dashHighlight .dinfo{flex:1;}
  .dashHighlight .dlabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;}
  .dashHighlight .dtitle{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
  .dashHighlight .dvalue{font-family:'Space Grotesk',sans-serif;font-size:18px;color:var(--gold);flex:0 0 auto;}

  /* Badges */
  .badgesRow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .badgeChip{
    display:flex;align-items:center;gap:6px;background:#111111;border:1px solid var(--border);
    border-radius:var(--r-pill);padding:7px 12px 7px 8px;font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;
    color:var(--text-dim);opacity:0.4;
  }
  .badgeChip.earned{opacity:1;border-color:var(--gold-dim);color:var(--text);background:var(--panel-3);}
  .badgeChip .bicon{font-size:15px;}

  /* Décale le contenu pour laisser la place au rail latéral (desktop) */
  .wrap:has(.sidebar){padding-left:calc(220px + clamp(20px,4vw,64px));padding-top:32px;}

  @media(max-width:480px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:13px;}
  }


  /* Boosters, cartes et holographie */
  .packGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;align-items:start;}
  .packTile{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;}
  .packArt{
    position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;
    background:var(--panel-3);border-bottom:2px solid var(--gold);
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--gold);
  }
  .packArt::before{
    content:'BOOSTER';position:absolute;top:12px;left:0;right:0;
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:4px;color:var(--text-dim);
  }
  .packInfo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;}
  .packName{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
  .packMeta{font-size:12px;color:var(--text-dim);}
  .packOdds{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);line-height:1.5;}
  .oddsBox summary{cursor:pointer;font-size:12px;color:var(--gold);padding:2px 0;}
  .oddsTable{width:100%;border-collapse:collapse;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:10px;}
  .oddsWrap{overflow-x:auto;}
  .oddsTable th, .oddsTable td{padding:4px 2px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;}
  .oddsTable th:first-child, .oddsTable td:first-child{text-align:left;}
  .oddsTable th{color:var(--text-dim);font-weight:400;font-size:9px;}
  .addbtn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
  .dailyBox{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:14px 18px;margin:0 0 18px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);
  }
  .dailyBox.ready{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .dailyTitle{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);}
  .dailyText{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
  .dailyBox.ready .dailyText{color:var(--gold);}
  .packArt.img{aspect-ratio:900/1420;padding:0;border-bottom:none;background:var(--panel) center/contain no-repeat;}
  .packArt.img::before{display:none;}
  .packThumb{width:64px;height:100px;flex:none;border-radius:var(--r-sm);background:var(--panel-3) center/contain no-repeat;border:1px solid var(--border);}

  .tcgGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;}
  .tcg{
    --rc:#8b9199;position:relative;aspect-ratio:5/7;border-radius:var(--r-md);padding:6px;
    background:var(--panel);border:2px solid var(--rc);display:flex;flex-direction:column;overflow:hidden;
  }
  .tcg.r-commune{--rc:#8b9199;}
  .tcg.r-rare{--rc:#3b82f6;box-shadow:0 0 10px rgba(59,130,246,0.3);}
  .tcg.r-epique{--rc:#a855f7;box-shadow:0 0 14px rgba(168,85,247,0.38);}
  .tcg.r-legendaire{--rc:#f5b301;box-shadow:0 0 20px rgba(245,179,1,0.5);}
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg;}
  .tcg.r-ultime{
    --rc:#ff5ccd;border:2px solid transparent;
    background:linear-gradient(var(--panel),var(--panel)) padding-box, conic-gradient(from var(--ang), #ff3d81, #ffb02e, #4cf2a0, #35c0ff, #a259ff, #ff3d81) border-box;
    box-shadow:0 0 24px rgba(255,92,205,0.45);animation:ultSpin 6s linear infinite;
  }
  @keyframes ultSpin{to{--ang:360deg;}}
  .tcg .art{
    position:relative;flex:1;min-height:0;border-radius:calc(var(--r-md) - 6px);background:#111111 center 25%/cover no-repeat;
    display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--text-dim);
  }
  .tcg .art.noimg{
    background:repeating-linear-gradient(135deg, hsl(var(--h) 45% 24%) 0 12px, hsl(var(--h) 45% 19%) 12px 24px);
  }
  .tcg .mono{
    display:flex;align-items:center;justify-content:center;width:54%;aspect-ratio:1;border-radius:50%;
    background:hsl(var(--h) 65% 54%);color:#0e0e0e;font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;
  }
  .tcg .credit{
    position:absolute;left:6px;bottom:6px;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    background:rgba(0,0,0,0.68);color:#fff;border-radius:var(--r-pill);padding:2px 8px;
    font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:400;
  }
  .tcg .holotag{
    position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,0.68);color:#fff;border:1px solid rgba(255,255,255,0.35);
    border-radius:var(--r-pill);padding:2px 8px;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1px;
  }
  .tcg .nm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;padding:6px 4px 1px;text-align:center;line-height:1.2;}
  .tcg .rr{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;text-align:center;color:var(--rc);padding-bottom:3px;}
  .tcg .cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.75);border-radius:var(--r-pill);padding:2px 9px;font-size:11px;font-weight:700;z-index:3;}
  .tcg .newtag{position:absolute;top:10px;left:10px;background:var(--gold);color:#fff;border-radius:var(--r-pill);padding:2px 9px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;z-index:3;}
  .tcg.locked{opacity:.5;box-shadow:none;}
  .tcg.locked.r-ultime{animation:none;}
  .tcgGrid .tcg{cursor:pointer;}
  .tcgWrap{display:flex;flex-direction:column;gap:8px;}
  .tcgWrap .tcgRar{width:100%;padding:8px 12px;font-size:12px;}
  .tcgBtns{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;}
  .progressOuter{height:8px;border-radius:var(--r-pill);background:var(--panel-3);overflow:hidden;}
  .progressFill{height:100%;background:var(--gold);border-radius:var(--r-pill);transition:width .4s ease;}

  /* version holographique : seules les cartes holo ont le foil et l'inclinaison */
  .tcg.holo{
    transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
    transition:transform .3s ease, box-shadow .3s ease;will-change:transform;
  }
  .tcg.holo.tilting{transition:transform .06s linear;}
  .tcg .foil, .tcg .glare{position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .25s ease;z-index:2;}
  .tcg .foil{
    background:repeating-linear-gradient(115deg, rgba(255,0,128,0.6) 0%, rgba(255,200,0,0.55) 12%, rgba(0,255,170,0.55) 24%, rgba(0,150,255,0.6) 36%, rgba(170,0,255,0.6) 48%, rgba(255,0,128,0.6) 60%);
    background-size:260% 260%;background-position:var(--bx,50%) var(--by,50%);mix-blend-mode:color-dodge;
  }
  .tcg .glare{
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 55%);
    mix-blend-mode:overlay;
  }
  .tcg.holo .foil{opacity:.24;}
  .tcg.holo.tilting .foil{opacity:.5;}
  .tcg.holo.tilting .glare{opacity:.6;}
  .tcg.holo.r-legendaire.tilting .foil, .tcg.holo.r-ultime.tilting .foil{opacity:.62;}
  .tcg.holo.r-legendaire::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,0.22) 50%,transparent 65%);
    background-size:250% 100%;animation:tcgShine 3.2s linear infinite;
  }
  @keyframes tcgShine{0%{background-position:200% 0;}100%{background-position:-100% 0;}}
  .tcg.holo.r-legendaire.tilting::after{opacity:0;}
  @media (hover:none){
    .tcg.holo .foil{opacity:.34;animation:foilDrift 7s ease-in-out infinite alternate;}
  }
  @keyframes foilDrift{from{background-position:10% 20%;}to{background-position:90% 80%;}}
  @media (prefers-reduced-motion: reduce){
    .tcg.holo{transform:none !important;transition:none;}
    .tcg .foil{animation:none !important;}
    .tcg.holo.r-legendaire::after{animation:none;}
    .tcg.r-ultime{animation:none;}
    .flipInner{transition:none;}
    .flip.burst{animation:none;}
  }

  /* ouverture de booster */
  .packOverlay{align-items:center;background:rgba(5,5,5,0.985);}
  .packStage{width:100%;max-width:900px;margin:auto;text-align:center;}
  .packTitle{font-family:'JetBrains Mono',monospace;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim);font-size:11px;margin-bottom:20px;}
  .packCards{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:22px;}
  .flip{width:clamp(96px,15vw,150px);aspect-ratio:5/7;perspective:900px;cursor:pointer;}
  .flipInner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;}
  .flip.flipped .flipInner{transform:rotateY(180deg);}
  .flipFace{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .flipFront{transform:rotateY(180deg);}
  .flipFront .tcg{width:100%;height:100%;aspect-ratio:auto;}
  .flipBack{
    position:absolute;inset:0;overflow:hidden;border-radius:var(--r-md);background:hsl(var(--h,25) 30% 11%);
    border:2px solid hsl(var(--h,25) 80% 55%);display:block;
  }
  .flipBack .backPattern{
    position:absolute;inset:0;
    background:
      radial-gradient(circle, rgba(255,255,255,0.10) 0 1.5px, transparent 2px) 0 0/22px 22px,
      repeating-linear-gradient(135deg, hsl(var(--h,25) 38% 17%) 0 13px, hsl(var(--h,25) 38% 12%) 13px 26px);
  }
  .flipBack .backFrame{position:absolute;inset:8px;border:2px solid hsl(var(--h,25) 80% 60% / .75);border-radius:calc(var(--r-md) - 6px);}
  .flipBack .backTop, .flipBack .backBottom{
    position:absolute;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:3px;
    text-transform:uppercase;color:rgba(255,255,255,0.85);
  }
  .flipBack .backTop{top:20px;}
  .flipBack .backBottom{bottom:20px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;letter-spacing:1.5px;padding:0 18px;}
  .flipBack .backEmblem{
    position:absolute;left:50%;top:50%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:conic-gradient(from 0deg, hsl(var(--h,25) 90% 62%), hsl(calc(var(--h,25) + 40) 90% 60%), hsl(var(--h,25) 90% 62%), hsl(calc(var(--h,25) - 40) 90% 60%), hsl(var(--h,25) 90% 62%));
    display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px hsl(var(--h,25) 90% 55% / .45);
  }
  .flipBack .backEmblem::before{content:'';position:absolute;inset:7px;border-radius:50%;background:hsl(var(--h,25) 35% 10%);}
  .flipBack .backEmblem span{position:relative;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:56px;color:#fff;line-height:1;}
  .flipBack .backTag{
    position:absolute;left:50%;top:calc(50% + 31%);transform:translateX(-50%);padding:3px 12px;border-radius:var(--r-pill);
    background:rgba(0,0,0,0.65);border:1px solid hsl(var(--h,25) 90% 62%);color:#fff;font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:2px;font-weight:700;
  }
  .flip.burst{animation:cardBurst .7s ease-out;}
  @keyframes cardBurst{0%{transform:scale(1);}40%{transform:scale(1.08);}100%{transform:scale(1);}}
  .packSummary{min-height:22px;margin-bottom:14px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--text);}
  .packBtns{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
  .packBanner{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:-6px 0 16px;}
  .packTestNote{display:inline-block;margin:-10px 0 14px;padding:4px 14px;border-radius:var(--r-pill);background:var(--panel-3);color:var(--text-dim);font-size:12px;font-weight:600;}
  .simLines{margin-top:14px;font-size:13px;line-height:1.8;color:var(--text);}
  .simLines div{border-bottom:1px solid var(--border);padding:2px 0;}
  .packBanner.gold{color:#f5b301;}
  .packBanner.deviant{color:#35c0ff;}
  .packOverlay.gold{background:rgba(22,15,0,0.97);}
  .packOverlay.gold .flipBack{background:#2a2000;border-color:#f5b301;color:#f5b301;box-shadow:0 0 22px rgba(245,179,1,0.55);}
  .packOverlay.gold .packTitle{color:#f5b301;}
  .packOverlay.deviant .flipBack{border-color:#35c0ff;color:#35c0ff;box-shadow:0 0 18px rgba(53,192,255,0.4);}

  /* fiche détaillée */
  .cardDetail{display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:780px;margin:auto;}
  .cardBig .tcg{width:min(300px,72vw);touch-action:none;cursor:default;}
  .cardInfo{flex:1;min-width:240px;max-width:360px;text-align:left;--rc:#8b9199;}
  .cardInfo.r-rare{--rc:#3b82f6;} .cardInfo.r-epique{--rc:#a855f7;} .cardInfo.r-legendaire{--rc:#f5b301;} .cardInfo.r-ultime{--rc:#ff5ccd;}
  .cardRar{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--rc);margin-bottom:14px;}
  .cardDesc{font-size:14.5px;line-height:1.6;color:var(--text);margin-bottom:14px;}
  .cardMeta{font-size:12.5px;color:var(--text-dim);margin-bottom:10px;}

  /* fan arts */
  .faRow{
    display:flex;gap:14px;align-items:center;padding:12px 14px;margin-bottom:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
  }
  .faThumb{width:72px;height:72px;flex:none;border-radius:var(--r-sm);background:#111111 center/cover no-repeat;border:1px solid var(--border);}
  .faThumb.big{width:120px;height:120px;}
  .faInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .faInfo .faName{margin:0;padding:8px 12px;}
  .faInfo .faColSel{padding:8px 12px;font-size:12px;}
  .faMeta{font-size:12px;color:var(--text-dim);}
  .faBtns{display:flex;flex-direction:column;gap:6px;}
  .faStatus{padding:5px 12px;border-radius:var(--r-pill);font-size:12px;font-weight:600;background:var(--panel-3);color:var(--text-dim);white-space:nowrap;}
  .faStatus.approved{background:rgba(63,174,92,0.15);color:var(--rate-green);}
  .faStatus.rejected{background:rgba(229,72,77,0.15);color:var(--rate-red);}
  .checkLine{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5;margin:4px 0 14px;text-transform:none;letter-spacing:0;font-family:'Space Grotesk',sans-serif;color:var(--text);}
  .checkLine input{margin-top:3px;flex:none;}

  /* ouverture de booster : une carte à la fois */
  .deckLayout{display:flex;align-items:center;justify-content:center;gap:36px;margin:52px 0 10px;}
  .deckArea{position:relative;width:min(300px,62vw);aspect-ratio:5/7;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;}
  .deckFx{position:absolute;inset:0;pointer-events:none;z-index:0;}
  .deckCard{
    --rot:1deg;position:absolute;inset:0;z-index:100;perspective:1100px;
    transform:translateY(calc(var(--k,0) * 13px)) scale(calc(1 - var(--k,0) * 0.045)) rotate(calc(var(--k,0) * var(--rot)));
    transition:transform .5s cubic-bezier(.3,.7,.2,1), opacity .3s ease;
  }
  .deckCard.flipped .flipInner{transform:rotateY(180deg);}
  /* surbrillance faible, identique pour toutes les Épiques et Légendaires, plus forte au 1er clic */
  .deckCard.glowy::before{
    content:'';position:absolute;inset:-3px;border-radius:calc(var(--r-md) + 3px);pointer-events:none;
    box-shadow:0 0 18px 4px rgba(255,240,200,0.32);animation:glowFaint 2.4s ease-in-out infinite;
  }
  .deckCard.glowy.lvl1::before{box-shadow:0 0 46px 15px rgba(255,240,200,0.9);animation:glowStrong 0.9s ease-in-out infinite;}
  .deckCard.lvl1:not(.flipped) .flipInner{animation:chargeShake .45s ease-out;}
  @keyframes glowFaint{0%,100%{opacity:.6;}50%{opacity:1;}}
  @keyframes glowStrong{0%,100%{opacity:.85;}50%{opacity:1;}}
  @keyframes chargeShake{
    0%{transform:translate(0,0) rotate(0);}
    20%{transform:translate(-3px,1px) rotate(-.7deg);}
    40%{transform:translate(3px,-1px) rotate(.7deg);}
    60%{transform:translate(-2px,1px) rotate(-.4deg);}
    80%{transform:translate(2px,0) rotate(.3deg);}
    100%{transform:translate(0,0) rotate(0);}
  }
  .deckCard.pop{animation:cardPop .6s ease-out;}
  @keyframes cardPop{0%{transform:scale(1);}35%{transform:scale(1.07);}100%{transform:scale(1);}}
  .deckProgress{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-top:40px;position:relative;z-index:300;}
  .deckHint{font-size:13px;color:var(--text);margin:8px 0 14px;min-height:20px;position:relative;z-index:300;}

  /* tiroir latéral : les cartes déjà révélées */
  .revealedTray{
    display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px;
    min-width:54px;min-height:70px;max-height:min(66vh,470px);
  }
  .miniWrap{position:relative;width:48px;height:67px;flex:none;border-radius:8px;}
  .miniWrap .tcg{position:absolute;left:0;top:0;width:150px;height:210px;aspect-ratio:auto;transform:scale(.32) !important;transform-origin:top left;pointer-events:none;}
  @media (max-width:760px){
    .deckLayout{flex-direction:column;gap:14px;}
    .revealedTray{flex-direction:row;max-height:none;width:100%;justify-content:center;min-height:70px;}
  }

  /* récapitulatif final */
  .recap{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:6px 0 18px;}
  .recapCard{width:clamp(96px,15vw,150px);aspect-ratio:5/7;}
  .recapCard .tcg{width:100%;height:100%;aspect-ratio:auto;}

  /* brillances : de plus en plus fortes avec la rareté */
  .fxGlow{
    position:absolute;inset:-34%;border-radius:50%;
    background:radial-gradient(circle, var(--fx) 0%, transparent 62%);
    opacity:.55;animation:fxPulse 1.6s ease-in-out infinite;
  }
  .fxGlow.rainbow{
    background:conic-gradient(from 0deg, #ff3d81, #ffb02e, #4cf2a0, #35c0ff, #a259ff, #ff3d81);
    -webkit-mask:radial-gradient(circle, #000 0%, transparent 66%);mask:radial-gradient(circle, #000 0%, transparent 66%);
    animation:fxPulse 1.6s ease-in-out infinite, hueSpin 5s linear infinite;
  }
  @keyframes fxPulse{0%,100%{transform:scale(.92);opacity:.5;}50%{transform:scale(1.06);opacity:.85;}}
  @keyframes hueSpin{to{filter:hue-rotate(360deg);}}
  .fxRays{
    position:absolute;inset:-95%;border-radius:50%;
    background:repeating-conic-gradient(from 0deg, var(--fx) 0 6deg, transparent 6deg 20deg);
    -webkit-mask:radial-gradient(circle, #000 12%, transparent 62%);mask:radial-gradient(circle, #000 12%, transparent 62%);
    opacity:.38;animation:raysSpin 9s linear infinite;
  }
  .fxRays.rainbow{
    background:repeating-conic-gradient(from 0deg, #ff3d81 0 5deg, #ffb02e 5deg 10deg, #4cf2a0 10deg 15deg, #35c0ff 15deg 20deg, #a259ff 20deg 25deg, transparent 25deg 30deg);
  }
  @keyframes raysSpin{to{transform:rotate(360deg);}}
  .fxRing{
    position:absolute;left:50%;top:50%;width:60%;aspect-ratio:1;margin:-30% 0 0 -30%;border-radius:50%;
    border:4px solid var(--fx);opacity:0;animation:ringOut 1.1s ease-out var(--delay,0ms) forwards;
  }
  @keyframes ringOut{0%{transform:scale(.4);opacity:.9;}100%{transform:scale(2.6);opacity:0;}}
  .spark{
    position:absolute;left:50%;top:50%;width:var(--s,8px);height:var(--s,8px);
    margin:calc(var(--s,8px) / -2) 0 0 calc(var(--s,8px) / -2);border-radius:50%;
    background:var(--c,#fff);box-shadow:0 0 10px var(--c,#fff);opacity:0;
    animation:sparkOut 1.3s ease-out var(--delay,0ms) forwards;
  }
  @keyframes sparkOut{
    0%{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1);}
    100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.2);}
  }
  .fxFlash{
    position:fixed;inset:0;z-index:9999;pointer-events:none;
    background:radial-gradient(circle at 50% 45%, var(--fx), transparent 72%);animation:flashOut .7s ease-out forwards;
  }
  @keyframes flashOut{0%{opacity:1;}100%{opacity:0;}}
  .fxLabel{
    position:absolute;left:-90px;right:-90px;top:-50px;text-align:center;white-space:nowrap;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:4px;
    color:var(--fx);text-shadow:0 0 18px var(--fx);animation:labelIn .6s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .fxLabel.rainbow{
    background:linear-gradient(90deg, #ff3d81, #ffb02e, #4cf2a0, #35c0ff, #a259ff);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:none;
  }
  @keyframes labelIn{0%{opacity:0;transform:scale(.4);}100%{opacity:1;transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){
    .fxRays, .fxRing, .spark, .fxFlash{display:none;}
    .fxGlow{animation:none;}
    .deckCard{transition:opacity .2s ease;}
    .deckCard.pop{animation:none;}
    .deckCard.glowy::before{animation:none;}
    .deckCard.lvl1:not(.flipped) .flipInner{animation:none;}
  }

  /* Barre de navigation en bas façon TikTok / Instagram en mobile */
  @media(max-width:768px){
    .wrap:has(.sidebar){padding-left:clamp(16px,4vw,64px);padding-bottom:86px;padding-top:20px;}

async function kvGet(key){
  try{
    const { data, error } = await supabaseClient
      .from('app_data').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('kvGet', key, error); return null; }
    return data ? data.value : null;
  }catch(e){ console.error('kvGet failed', key, e); return null; }
}
async function kvSet(key, value){
  try{
    const { error } = await supabaseClient
      .from('app_data').upsert({key, value, updated_at: new Date().toISOString()});
    if(error) console.error('kvSet', key, error);
  }catch(e){ console.error('kvSet failed', key, e); }
}

  const n = (v, d) => { const x = parseInt(v, 10); return isNaN(x) || x < 0 ? d : x; };
  return {first: n(p.first, DEFAULT_PAYOUT.first), second: n(p.second, DEFAULT_PAYOUT.second), third: n(p.third, DEFAULT_PAYOUT.third), other: n(p.other, DEFAULT_PAYOUT.other)};
}
function payoutForPlace(place, cfg){
  return place === 1 ? cfg.first : place === 2 ? cfg.second : place === 3 ? cfg.third : cfg.other;
}
async function addWins(keys){

  await kvSet(k, rec);
}

function isYoutubeUrl(url){
  try{
    const u = new URL(url);
    const host = u.hostname.toLowerCase().replace(/^www\.|^m\./, '');
    return host === 'youtube.com' || host === 'youtu.be';
  }catch(e){
    return false;
  }
}

function stripAccents(str){
  return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function impliedAnimeName(t){
  if(t.animeName && t.animeName.trim()) return t.animeName.trim();
  const parts = (t.title || '').split(/\s[-–—:]\s/);
  return parts.length > 1 ? parts[0].trim() : '';
}

function posterInitial(t){ const c = String(t||'?').trim().charAt(0).toUpperCase(); return escapeHtml(c || '?'); }

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getAllRatersFor(it){
  if(isEpisodic(it.type)){
    const map = {};
    (it.seasons||[]).forEach(s => (s.episodes||[]).forEach(e => {
      (viewerRatings[episodeKey(it.id, s.number, e.number)] || []).forEach(r => {
        const k = r.who.toLowerCase();
        if(!map[k]) map[k] = {display: r.who, scores: []};
        map[k].scores.push(r.score);
      });
    }));
    return Object.values(map)
      .map(v => ({display: v.display, avg: v.scores.reduce((a,b)=>a+b,0)/v.scores.length, count: v.scores.length}))
      .sort((a,b) => b.avg - a.avg);
  }
  return (viewerRatings[it.id] || [])
    .slice()
    .sort((a,b) => (b.score||0) - (a.score||0))
    .map(r => ({display: r.who, avg: r.score, count: 1}));
}

function ratersListHtml(it){

  return `

        </div>
      `).join('')}
    </div>
  `;
}

function ratingColor(v){
  if(v === null || v === undefined || v === '' || isNaN(v) || v <= 0) return 'var(--text-dim)';
  if(v < 3) return 'var(--rate-red)';
  if(v < 5) return 'var(--rate-orange)';
  if(v < 7.5) return 'var(--rate-blue)';
  return 'var(--rate-green)';
}

function typeLabel(type){
  if(type === 'anime') return 'Anime';
  if(type === 'serie') return 'Série';
  return 'Film';
}
function isEpisodic(type){ return type === 'serie' || type === 'anime'; }

function publicStats(movieId){
  const list = viewerRatings[movieId] || [];
  const scores = list.map(r => r.score);
  const it = items.find(x => x.id === movieId);
  if(it && it.rating > 0) scores.push(it.rating);
  if(scores.length === 0) return {avg:0, count:0};
  const sum = scores.reduce((a,b) => a + b, 0);
  return {avg: sum/scores.length, count: scores.length};
}

function getViewersSummary(){
  const map = {};
  Object.keys(viewerProfiles).forEach(key => {
    map[key] = {key, display: viewerProfiles[key].display || key, count: 0, sum: 0, lastTs: 0};
  });
  Object.keys(viewerRatings).forEach(movieId => {
    (viewerRatings[movieId] || []).forEach(r => {
      const key = r.who.toLowerCase();
      if(!map[key]) map[key] = {key, display: r.who, count: 0, sum: 0, lastTs: 0};
      map[key].count++;
      map[key].sum += r.score;
      map[key].lastTs = Math.max(map[key].lastTs, r.ts || 0);
    });
  });
  return Object.values(map)
    .map(v => ({...v, avg: v.count ? v.sum / v.count : 0}))
    .sort((a,b) => b.lastTs - a.lastTs);
}

function getViewerMovies(key){
  const list = [];
  items.forEach(it => {
    const ratings = viewerRatings[it.id] || [];
    const mine = ratings.find(r => r.who.toLowerCase() === key);
    if(mine) list.push({movie: it, score: mine.score, comment: mine.comment || '', ts: mine.ts || 0});
  });
  return list.sort((a,b) => b.ts - a.ts);
}

/* ---------- EPISODES (saisons / épisodes pour séries & animes) ---------- */
function episodeKey(itemId, season, ep){ return itemId + '::s' + season + 'e' + ep; }

function seriesCreatorAvg(it){
  const vals = [];
  (it.seasons||[]).forEach(s => (s.episodes||[]).forEach(e => { if(e.rating) vals.push(e.rating); }));
  if(vals.length === 0) return {avg:0, count:0};
  return {avg: vals.reduce((a,b)=>a+b,0)/vals.length, count: vals.length};
}
function creatorRatingStat(it){
  if(isEpisodic(it.type)){
    const epStat = seriesCreatorAvg(it);
    if(epStat.count > 0) return epStat;
    return {avg: it.rating||0, count: it.rating?1:0};
  }
  return {avg: it.rating||0, count: it.rating?1:0};
}
function seriesPublicStats(it){
  let sum=0, count=0;
  (it.seasons||[]).forEach(s => (s.episodes||[]).forEach(e => {
    const list = viewerRatings[episodeKey(it.id, s.number, e.number)] || [];
    list.forEach(r => { sum += r.score; count++; });
  }));
  const creatorAvg = seriesCreatorAvg(it);
  if(creatorAvg.count > 0){ sum += creatorAvg.avg; count++; }
  return {avg: count ? sum/count : 0, count};
}
function seriesViewerOwnAvg(it, name){
  let sum=0, count=0;
  (it.seasons||[]).forEach(s => (s.episodes||[]).forEach(e => {
    const list = viewerRatings[episodeKey(it.id, s.number, e.number)] || [];
    const mine = list.find(r => r.who.toLowerCase() === (name||'').toLowerCase());
    if(mine){ sum += mine.score; count++; }
  }));
  return {avg: count ? sum/count : 0, count};
}

function getViewerStats(key){
  let filmsRated = 0, showsRated = 0, episodesRated = 0;
  items.forEach(it => {
    if(it.type === 'film'){
      const list = viewerRatings[it.id] || [];
      if(list.some(r => r.who.toLowerCase() === key)) filmsRated++;
    } else if(isEpisodic(it.type)){
      let ratedThisShow = false;
      (it.seasons||[]).forEach(s => (s.episodes||[]).forEach(e => {
        const list = viewerRatings[episodeKey(it.id, s.number, e.number)] || [];
        if(list.some(r => r.who.toLowerCase() === key)){ episodesRated++; ratedThisShow = true; }
      }));
      if(ratedThisShow) showsRated++;
    }
  });
  return {filmsRated, showsRated, episodesRated};
}

    document.getElementById('loginPane').style.display = btn.dataset.t === 'login' ? 'block' : 'none';

  });

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: document.getElementById('loginEmail').value.trim(),
      password: document.getElementById('loginPass').value
    });
    loginBtn.disabled = false;
    loginBtn.textContent = 'Se connecter';

    const ok = await processSession();

    render();
  };

    signupBtn.textContent = 'Création...';

      email, password,
      options: { data: { pseudo } }
    });

    wrapEl.className = mode === 'select' ? 'wrap narrow' : 'wrap';
    render();
  };

  const target = new Date();
  target.setMonth(10, 30); // mois 10 = novembre (0-indexé)
  target.setHours(21, 0, 0, 0);
  if(target.getTime() <= Date.now()) target.setFullYear(target.getFullYear() + 1);
  const updateLoginCountdown = () => {
    const el = document.getElementById('loginCountdown');
    if(!el){ clearInterval(loginCountdownTick); loginCountdownTick = null; return; }
    const ms = target.getTime() - Date.now();
    if(ms <= 0){ el.textContent = "C'est l'heure !"; clearInterval(loginCountdownTick); loginCountdownTick = null; return; }
    const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000), m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
    el.textContent = `${d}j ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  };
  updateLoginCountdown();
  loginCountdownTick = setInterval(updateLoginCountdown, 1000);
}

/* ---------- SCHEDULE (calendrier hebdomadaire, mode paysage) ---------- */
const MONTHS_FR = ['JAN','FÉV','MAR','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'];
const DAYS_FR = ['LUNDI','MARDI','MERCREDI','JEUDI','VENDREDI','SAMEDI','DIMANCHE'];
let weekOffset = 0;

function isoDateLocal(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return isoDateLocal(new Date()); }
function startOfWeek(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function getWeekDates(offset){
  const base = startOfWeek(new Date());
  base.setDate(base.getDate() + offset*7);
  const days = [];
  for(let i=0;i<7;i++){
    const dt = new Date(base);
    dt.setDate(base.getDate()+i);
    days.push(dt);
  }
  return days;
}

function renderSchedule(ctx){
  const isCreator = ctx === 'creator';
  const today = todayISO();
  const days = getWeekDates(weekOffset);
  const weekLabel = `${days[0].getDate()} ${MONTHS_FR[days[0].getMonth()]} — ${days[6].getDate()} ${MONTHS_FR[days[6].getMonth()]} ${days[6].getFullYear()}`;

  app.innerHTML = `
    <div class="page">
      ${navHtml('schedule', isCreator ? 'creator' : 'viewer')}
      <div class="controls" style="align-items:center;">
        <div class="logo" style="flex:1;">
          <h1 style="font-size:26px;">CALENDRIER</h1>
        </div>
        ${isCreator ? `<button class="addbtn" id="openAddSched">+ Programmer</button>` : ''}
      </div>
      <div class="weekNav">
        <button class="pill" id="prevWeek">◀ Semaine préc.</button>
        <div class="weekLabel">${weekLabel}</div>
        <button class="pill" id="todayBtn">Aujourd'hui</button>
        <button class="pill" id="nextWeek">Semaine suiv. ▶</button>
      </div>
      <div class="weekGrid" id="weekGrid"></div>
    </div>
  `;
  wireNav(isCreator ? 'creator' : 'viewer');
  const addBtn = document.getElementById('openAddSched');
  if(addBtn) addBtn.onclick = () => openScheduleModal(null, todayISO());
  document.getElementById('prevWeek').onclick = () => { weekOffset--; renderSchedule(ctx); };
  document.getElementById('nextWeek').onclick = () => { weekOffset++; renderSchedule(ctx); };
  document.getElementById('todayBtn').onclick = () => { weekOffset = 0; renderSchedule(ctx); };

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = days.map(d => {
    const iso = isoDateLocal(d);
    const isToday = iso === today;
    const dayItems = scheduleItems.filter(s => s.date === iso).sort((a,b) => (a.time||'').localeCompare(b.time||''));
    return `
      <div class="dayCol ${isToday ? 'today' : ''}">
        <div class="dayColHead">
          <div class="dowName">${DAYS_FR[d.getDay() === 0 ? 6 : d.getDay()-1]}</div>
          <div class="dowDate">${d.getDate()} ${MONTHS_FR[d.getMonth()]}</div>
        </div>
        <div class="dayColBody">
          ${dayItems.length === 0 ? `<div class="dayEmpty">—</div>` : dayItems.map(s => `
            <div class="evCard" data-id="${s.id}">
              ${s.time ? `<div class="evTime">${escapeHtml(s.time)}</div>` : ''}
              <div class="evTitle">${escapeHtml(s.title)}</div>
              ${s.note ? `<div class="evNote">${escapeHtml(s.note)}</div>` : ''}
              ${isCreator ? `
                <div class="evActions">
                  <button class="schbtn edit" data-id="${s.id}">✎</button>
                  <button class="schbtn del" data-id="${s.id}">✕</button>
                </div>
              ` : ''}
            </div>
          `).join('')}
          ${isCreator ? `<button class="addDayBtn" data-date="${iso}">+ Ajouter</button>` : ''}
        </div>
      </div>
    `;
  }).join('');

  if(isCreator){
    grid.querySelectorAll('.addDayBtn').forEach(b => {
      b.onclick = () => openScheduleModal(null, b.dataset.date);
    });
    grid.querySelectorAll('.schbtn.edit').forEach(b => {
      b.onclick = (e) => { e.stopPropagation(); openScheduleModal(scheduleItems.find(s => s.id === b.dataset.id)); };
    });
    grid.querySelectorAll('.schbtn.del').forEach(b => {
      b.onclick = async (e) => {
        e.stopPropagation();
        scheduleItems = scheduleItems.filter(s => s.id !== b.dataset.id);
        await saveSchedule();
        renderSchedule('creator');
      };
    });
  }
}

function openScheduleModal(existing, prefillDate){
  const isEdit = !!existing;
  const s = existing || {title:'', date: prefillDate || todayISO(), time:'', note:''};
  const root = document.getElementById('modalRoot');

            <input type="text" id="sTime" value="${escapeHtml(s.time||'')}" placeholder="20h30">

        </div>

        <textarea id="sNote" placeholder="Un mot pour teaser">${escapeHtml(s.note||'')}</textarea>

          <button class="btn primary" id="saveBtn">${isEdit ? 'Enregistrer' : 'Programmer'}</button>
