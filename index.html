<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kutsu Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e0e; --panel:#161616; --panel-2:#1c1c1c; --panel-3:#262626;
    --paper:#f0e4c3; --ink:#1b1206;
    --gold:#c8402a; --gold-dim:#7a2718; --mustard:#d9a52c;
    --red:#e0455f;
    --twitch:#9146ff; --twitch-dim:#5c2ea6;
    --rate-red:#e5484d; --rate-orange:#f5a524; --rate-blue:#3b82f6; --rate-green:#3fae5c;
    --text:#f4f4f4; --text-dim:#9a9a9a; --border:rgba(255,255,255,0.12);
    --shadow-sm:0 2px 10px rgba(0,0,0,0.3);
    --shadow-md:0 14px 32px -10px rgba(0,0,0,0.65);
    --shadow-lg:0 30px 70px -20px rgba(0,0,0,0.75);
    --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:26px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text); font-family:'Space Grotesk',sans-serif; min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  ::selection{background:rgba(200,64,42,0.4);}

  .wrap{max-width:1800px;margin:0 auto;padding:0 clamp(20px,4vw,64px) 90px;}
  .wrap.narrow{max-width:440px;padding-top:60px;}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .page{animation:fadeIn .3s ease;}

  /* ---------- sidebar (rail façon YouTube / Twitch) ---------- */
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:220px;z-index:30;
    background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:22px 0;overflow-y:auto;
  }
  .sidebarLogo{
    cursor:pointer;user-select:none;padding:0 22px 22px;margin-bottom:6px;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;line-height:1.15;
    letter-spacing:0.5px;color:var(--gold);border-bottom:1px solid var(--border);
  }
  .sidebarNav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .sidebarLink{
    display:flex;align-items:center;gap:14px;width:calc(100% - 20px);margin:0 10px;
    padding:11px 16px;border:none;background:none;border-radius:var(--r-sm);
    color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;
    cursor:pointer;white-space:nowrap;text-align:left;transition:.15s;
  }
  .sidebarLink .sIcon{font-size:17px;flex:0 0 auto;width:20px;text-align:center;}
  .sidebarLink:hover{background:var(--panel-2);color:var(--text);}
  .sidebarLink.active{background:var(--panel-3);color:var(--gold);}
  .sidebarBottom{
    display:flex;flex-direction:column;gap:2px;padding-top:14px;margin-top:10px;
    border-top:1px solid var(--border);
  }

  .logo h1{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(30px,7vw,44px);
    letter-spacing:1.5px;margin:0;
    color:var(--gold);
  }
  .logo .tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2.5px;color:var(--text-dim);text-transform:uppercase;margin-top:4px;}
  .logo.center{text-align:center;}

  .hero{text-align:center;padding:38px 0 34px;}

  .addbtn{
    background:var(--panel-3);color:var(--text);border:none;border-radius:var(--r-pill);
    padding:11px 20px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;white-space:nowrap;transition:.15s;box-shadow:none;
  }
  .addbtn:hover{filter:brightness(1.25);}
  #openAdd{background:var(--gold);color:#fff;}
  .addbtn:active{filter:brightness(0.9);}

  .pill{
    background:none;border:none;border-radius:0;
    padding:9px 10px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;color:var(--text-dim);
    cursor:pointer;white-space:nowrap;transition:.15s;display:inline-flex;align-items:center;gap:6px;
  }
  .pill:hover{color:var(--text);}
  .pill.active{color:var(--gold);}

  .controls{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center;}
  .search{
    flex:1;min-width:200px;
    display:flex;align-items:center;gap:10px;
    background:#111111;border:1px solid var(--border);border-radius:var(--r-pill);padding:12px 16px;
    transition:border-color .15s;
  }
  .search:focus-within{border-color:var(--gold-dim);}
  .search input{
    flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  .search .ic{color:var(--text-dim);}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;background:none;border:none;padding:0;}
  .tab{
    padding:8px 16px;border-radius:var(--r-pill);border:none;background:var(--panel-2);color:var(--text-dim);
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;
    cursor:pointer;transition:.15s;position:relative;
  }
  .tab.active{background:var(--text);color:var(--bg);}
  .tab:hover:not(.active){background:var(--panel-3);color:var(--text);}

  .selectBox{
    background:#111111;border:1px solid var(--border);border-radius:var(--r-pill);
    padding:11px 14px;color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;
    cursor:pointer;outline:none;transition:border-color .15s;
  }
  .selectBox:focus, .selectBox:hover{border-color:var(--gold-dim);color:var(--text);}
  .selectBox option{background:#1a1a1a;color:var(--text);}

  .sectionLabel{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--text-dim);margin:26px 0 12px;display:flex;align-items:center;gap:10px;
  }
  .sectionLabel::after{content:'';flex:1;height:1px;background:var(--border);}
  .sagaBlock{margin-bottom:8px;}

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px;
  }
  .card{
    cursor:pointer;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    display:flex;flex-direction:column;box-shadow:var(--shadow-sm);
  }
  .card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.28);box-shadow:var(--shadow-md);}
  .card .poster{
    width:100%;aspect-ratio:2/3;background:#111111 center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:30px;
    position:relative;border-radius:0;overflow:hidden;
  }
  .card .poster::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.35));
    pointer-events:none;
  }
  .card .badge{
    position:absolute;top:8px;left:8px;z-index:1;
    background:rgba(11,10,18,0.85);border:1px solid var(--border);
    color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;
    padding:3px 7px;border-radius:var(--r-pill);text-transform:uppercase;
  }
  button.badge{cursor:default;}
  .card .badge.rediff{
    left:auto;right:8px;
    color:var(--red);border-color:rgba(200,30,58,0.4);
    cursor:pointer;transition:.15s;
  }
  .card .badge.rediff:hover{background:rgba(200,30,58,0.25);transform:scale(1.05);}
  .favBtn{
    position:absolute;bottom:8px;right:8px;z-index:1;
    color:#fff;
    width:28px;height:28px;border-radius:50%;
    background:rgba(0,0,0,0.55);border:none;
    display:flex;align-items:center;justify-content:center;font-size:13px;
    cursor:pointer;transition:.15s;
  }
  .favBtn:hover{transform:scale(1.1);border-color:var(--gold-dim);}
  .favBtn.active{color:#ff6b8b;border-color:rgba(255,107,139,0.5);background:rgba(255,107,139,0.15);}
  .card .info{padding:11px 13px 13px;}
  .card .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;line-height:1.3;margin-bottom:6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .year{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);margin-bottom:8px;}
  .ratingsRow{display:flex;gap:5px;flex-wrap:wrap;}
  .rchip{
    display:inline-flex;align-items:center;gap:3px;background:#111111;border:1px solid var(--border);
    border-radius:var(--r-pill);padding:3px 6px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  }

  .empty{
    text-align:center;padding:64px 22px;color:var(--text-dim);
    border:1px solid var(--border);border-radius:var(--r-lg);
    background:var(--panel);
  }
  .empty .ic{
    width:54px;height:54px;border-radius:50%;background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;
  }
  .empty .btn2{
    margin-top:18px;background:var(--gold);color:#fff;border:none;border-radius:var(--r-pill);
    padding:11px 22px;font-weight:700;font-size:13px;cursor:pointer;transition:.15s;
  }
  .empty .btn2:hover{filter:brightness(1.3);}

  /* modal */
  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
  .overlay{
    position:fixed;inset:0;background:rgba(5,4,9,0.78);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;
  }
  .modal{
    background:var(--panel-2);
    border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;max-width:460px;width:100%;
    box-shadow:var(--shadow-lg);animation:modalIn .2s cubic-bezier(.2,.8,.2,1);
  }
  .modal h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:23px;color:var(--gold);margin:0 0 20px;letter-spacing:0.5px;}
  label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:7px;}
  input[type=text], input[type=password], input[type=email], input[type=datetime-local], textarea{
    width:100%;background:#111111;border:1px solid var(--border);border-radius:var(--r-sm);
    padding:11px 13px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:14px;margin-bottom:15px;outline:none;
    transition:border-color .15s;
  }
  input[type=text]:focus, input[type=password]:focus, input[type=email]:focus, input[type=datetime-local]:focus, textarea:focus{border-color:var(--gold);}
  .search input[type=text]{width:auto;flex:1;background:none;border:none;border-radius:0;padding:0;margin:0;}
  .search input[type=text]:focus{border:none;}
  textarea{resize:vertical;min-height:60px;}
  .typetoggle{display:flex;gap:8px;margin-bottom:15px;}
  .typebtn{
    flex:1;padding:10px 12px;border-radius:var(--r-pill);border:none;background:var(--panel-3);
    color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;
  }
  .typebtn.active{background:var(--text);color:var(--bg);}
  .posterrow{display:flex;gap:14px;margin-bottom:15px;align-items:flex-start;}
  .posterpreview{
    width:80px;height:120px;border-radius:var(--r-sm);background:#111111 center/cover no-repeat;
    border:1px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:22px;
  }
  .posterfields{flex:1;}
  .filebtn{
    display:inline-block;background:none;border:none;
    padding:9px 0;font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--gold);cursor:pointer;margin-bottom:8px;transition:.15s;
  }
  .filebtn:hover{filter:brightness(1.3);}
  input[type=file]{display:none;}
  .row2{display:flex;gap:10px;}
  .row2 input{flex:1;}
  .modalbtns{display:flex;gap:10px;margin-top:8px;}
  .btn{flex:1;padding:12px 4px;border-radius:0;border:none;background:none;font-weight:700;font-size:13px;cursor:pointer;transition:.15s;}
  .btn.primary{background:var(--gold);color:#fff;border-radius:var(--r-pill);padding:12px 22px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
  .btn.primary:hover{filter:brightness(1.12);}
  .btn.ghost{background:none;border:none;color:var(--text-dim);}
  .btn.ghost:hover{color:var(--text);}
  .btn.danger{background:none;border:none;color:var(--red);}
  .btn.danger:hover{filter:brightness(1.2);}
  .btn.twitch{background:var(--twitch);color:#fff;border-radius:var(--r-pill);padding:13px 22px;}
  .btn.twitch:hover{filter:brightness(1.12);}

  /* detail */
  .detailhead{display:flex;gap:18px;margin-bottom:18px;}
  .detailposter{width:120px;height:180px;border-radius:var(--r-sm);background:#111111 center/cover no-repeat;border:1px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--text-dim);box-shadow:var(--shadow-sm);}
  .detailinfo h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:var(--text);margin:0 0 6px;}
  .detailinfo .metaline{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-bottom:12px;}
  .ratebox{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .ratebox input{
    width:80px;background:#111111;border:1px solid var(--border);border-radius:var(--r-sm);
    padding:9px 10px;color:var(--gold);font-family:'Space Grotesk',sans-serif;font-size:20px;text-align:center;
    outline:none;margin-bottom:0;
  }
  .ratebox input:focus{border-color:var(--gold);}
  .ratebox .outof{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);}
  .ratebox.viewer input{color:var(--twitch);}
  .synopsis{font-size:13px;color:var(--text-dim);line-height:1.65;margin-bottom:18px;}
  .rediffLink{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(200,30,58,0.12);border:1px solid rgba(200,30,58,0.4);
    color:var(--red);text-decoration:none;font-weight:700;font-size:13px;
    padding:9px 14px;border-radius:var(--r-pill);margin-bottom:18px;transition:.15s;
  }
  .rediffLink:hover{background:rgba(200,30,58,0.2);}
  .pubbox{
    background:#111111;border:1px solid var(--border);border-radius:var(--r-md);
    padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;
  }
  .pubbox .l{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;}
  .pubbox .v{font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--twitch);}
  .pubbox + .pubbox{margin-top:-4px;}
  .pubbox:last-of-type{margin-bottom:18px;}

  /* role select */
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:640px;margin:0 auto;}
  @media (max-width:520px){ .role-grid{grid-template-columns:1fr;} }
  .role-card{
    background:var(--panel-2);
    border:1px solid var(--border);border-radius:var(--r-md);
    padding:30px 24px;text-align:left;cursor:pointer;color:var(--text);
    transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s ease, box-shadow .18s ease;
    box-shadow:var(--shadow-sm);
  }
  .role-card:hover{transform:translateY(-5px);border-color:var(--gold-dim);box-shadow:var(--shadow-md);}
  .role-card .icon{
    width:48px;height:48px;border-radius:var(--r-sm);background:var(--panel-3);
    display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;
  }
  .role-card .title{font-family:'Space Grotesk',sans-serif;font-size:19px;letter-spacing:1px;color:var(--gold);}
  .role-card .desc{font-size:13px;color:var(--text-dim);margin-top:8px;line-height:1.55;}

  .twitchbox{
    background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;
    box-shadow:var(--shadow-sm);
  }
  .loginCountdownBox{
    background:var(--panel-2);border:1px solid var(--gold-dim);border-radius:var(--r-xl);padding:18px;text-align:center;
  }
  .loginCountdownValue{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(20px,5vw,28px);color:var(--gold);letter-spacing:1px;white-space:nowrap;
  }
  .hint{font-size:12px;color:var(--text-dim);text-align:center;margin-top:10px;line-height:1.6;}
  .back{
    background:none;border:none;color:var(--text-dim);
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12px;
    cursor:pointer;margin-bottom:18px;display:flex;align-items:center;gap:6px;transition:.15s;
  }
  .back:hover{color:var(--gold);}
  .viewerTag{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--twitch);
    background:rgba(145,70,255,0.12);border:1px solid rgba(145,70,255,0.35);
    padding:7px 13px;border-radius:var(--r-pill);
  }

  .vrow{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
    padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s;
  }
  .vrow:hover{border-color:var(--twitch);background:var(--panel-2);transform:translateX(3px);}
  .vavatar{
    width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    background:var(--twitch);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;font-size:16px;color:#fff;
  }
  .vinfo{flex:1;min-width:0;}
  .vinfo .vname{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--text);}
  .vinfo .vsub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-top:2px;}
  .vavg{font-family:'Space Grotesk',sans-serif;font-size:20px;flex:0 0 auto;}

  .mrow{
    display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);
    padding:10px 14px;margin-bottom:8px;
  }
  .mrow .mposter{
    width:38px;height:54px;border-radius:var(--r-sm);background:#111111 center/cover no-repeat;
    flex:0 0 auto;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-dim);
  }
  .mrow .mtitle{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:var(--text);}
  .mrow .mscore{font-family:'Space Grotesk',sans-serif;font-size:18px;flex:0 0 auto;}

  .comment{
    background:#111111;border:1px solid var(--border);border-radius:var(--r-md);
    padding:12px 14px;margin-bottom:8px;
  }
  .comment .who{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--twitch);
  }
  .comment .txt{font-size:13px;color:var(--text-dim);line-height:1.5;}
  .commentsTitle{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;
    color:var(--text-dim);margin:18px 0 10px;
  }
  .ratersList{max-height:220px;overflow-y:auto;margin-bottom:6px;}
  .raterRow{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 0;border-bottom:1px solid var(--border);
    font-family:'Space Grotesk',sans-serif;font-size:13px;
  }
  .raterRow:last-child{border-bottom:none;}
  .raterName{font-weight:600;color:var(--text);}
  .raterScore{font-weight:700;font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:nowrap;}

  .schbtn{
    background:none;border:none;color:var(--text-dim);
    padding:5px 8px;font-size:11px;cursor:pointer;transition:.15s;
  }
  .schbtn:hover{color:var(--gold);}
  .schbtn.del:hover{color:var(--red);}
  .todaytag{
    background:rgba(255,138,92,0.2);color:var(--gold);font-family:'JetBrains Mono',monospace;
    font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:var(--r-pill);margin-left:8px;text-transform:uppercase;
  }

  .weekNav{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin-bottom:20px;flex-wrap:wrap;
  }
  .weekLabel{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:1px;color:var(--text);
    background:#111111;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 16px;
  }
  .weekGrid{

/* ---------- STOCKAGE (Supabase) ---------- */
async function kvGet(key){
  try{
    const { data, error } = await supabaseClient
      .from('app_data').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('kvGet', key, error); return null; }
    return data ? data.value : null;
  }catch(e){ console.error('kvGet failed', key, e); return null; }
}
async function kvSet(key, value){
  try{
    const { error } = await supabaseClient
      .from('app_data').upsert({key, value, updated_at: new Date().toISOString()});
    if(error) console.error('kvSet', key, error);
  }catch(e){ console.error('kvSet failed', key, e); }
}

function isYoutubeUrl(url){
  try{
    const u = new URL(url);
    const host = u.hostname.toLowerCase().replace(/^www\.|^m\./, '');
    return host === 'youtube.com' || host === 'youtu.be';
  }catch(e){
    return false;
  }
}

function stripAccents(str){
  return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function impliedAnimeName(t){
  if(t.animeName && t.animeName.trim()) return t.animeName.trim();
  const parts = (t.title || '').split(/\s[-–—:]\s/);
  return parts.length > 1 ? parts[0].trim() : '';
}

function posterInitial(t){ const c = String(t||'?').trim().charAt(0).toUpperCase(); return escapeHtml(c || '?'); }

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getAllRatersFor(it){
  if(isEpisodic(it.type)){
    const map = {};
    (it.seasons||[]).forEach(s => (s.episodes||[]).forEach(e => {
      (viewerRatings[episodeKey(it.id, s.number, e.number)] || []).forEach(r => {
        const k = r.who.toLowerCase();
        if(!map[k]) map[k] = {display: r.who, scores: []};
        map[k].scores.push(r.score);
      });
    }));
    return Object.values(map)
      .map(v => ({display: v.display, avg: v.scores.reduce((a,b)=>a+b,0)/v.scores.length, count: v.scores.length}))
      .sort((a,b) => b.avg - a.avg);
  }
  return (viewerRatings[it.id] || [])
    .slice()
    .sort((a,b) => (b.score||0) - (a.score||0))
    .map(r => ({display: r.who, avg: r.score, count: 1}));
}

function ratersListHtml(it){
  const raters = getAllRatersFor(it);
  if(raters.length === 0) return '';
  return `
    <div class="commentsTitle">Notes des viewers (${raters.length})</div>
    <div class="ratersList">
      ${raters.map(r => `
        <div class="raterRow">

          <span class="raterScore" style="color:${ratingColor(r.avg)}">${r.avg % 1 === 0 ? r.avg : r.avg.toFixed(1)}/10${r.count>1 ? ` <span style="opacity:0.6;">(${r.count} ép.)</span>` : ''}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function ratingColor(v){
  if(v === null || v === undefined || v === '' || isNaN(v) || v <= 0) return 'var(--text-dim)';
  if(v < 3) return 'var(--rate-red)';
  if(v < 5) return 'var(--rate-orange)';
  if(v < 7.5) return 'var(--rate-blue)';
  return 'var(--rate-green)';
}

function typeLabel(type){
  if(type === 'anime') return 'Anime';
  if(type === 'serie') return 'Série';
  return 'Film';
}
function isEpisodic(type){ return type === 'serie' || type === 'anime'; }

function publicStats(movieId){
  const list = viewerRatings[movieId] || [];
  const scores = list.map(r => r.score);
  const it = items.find(x => x.id === movieId);
  if(it && it.rating > 0) scores.push(it.rating);
  if(scores.length === 0) return {avg:0, count:0};
  const sum = scores.reduce((a,b) => a + b, 0);
  return {avg: sum/scores.length, count: scores.length};
}

function getViewersSummary(){
  const map = {};
  Object.keys(viewerProfiles).forEach(key => {
    map[key] = {key, display: viewerProfiles[key].display || key, count: 0, sum: 0, lastTs: 0};
  });
  Object.keys(viewerRatings).forEach(movieId => {
    (viewerRatings[movieId] || []).forEach(r => {
      const key = r.who.toLowerCase();
      if(!map[key]) map[key] = {key, display: r.who, count: 0, sum: 0, lastTs: 0};
      map[key].count++;
      map[key].sum += r.score;
      map[key].lastTs = Math.max(map[key].lastTs, r.ts || 0);
    });
  });
  return Object.values(map)
    .map(v => ({...v, avg: v.count ? v.sum / v.count : 0}))
    .sort((a,b) => b.lastTs - a.lastTs);
}

function getViewerMovies(key){
  const list = [];
  items.forEach(it => {
    const ratings = viewerRatings[it.id] || [];
    const mine = ratings.find(r => r.who.toLowerCase() === key);
    if(mine) list.push({movie: it, score: mine.score, comment: mine.comment || '', ts: mine.ts || 0});
  });
  return list.sort((a,b) => b.ts - a.ts);
}

/* ---------- EPISODES (saisons / épisodes pour séries & animes) ---------- */
function episodeKey(itemId, season, ep){ return itemId + '::s' + season + 'e' + ep; }

function seriesCreatorAvg(it){
  const vals = [];
  (it.seasons||[]).forEach(s => (s.episodes||[]).forEach(e => { if(e.rating) vals.push(e.rating); }));
  if(vals.length === 0) return {avg:0, count:0};
  return {avg: vals.reduce((a,b)=>a+b,0)/vals.length, count: vals.length};
}
function creatorRatingStat(it){
  if(isEpisodic(it.type)){
    const epStat = seriesCreatorAvg(it);
    if(epStat.count > 0) return epStat;
    return {avg: it.rating||0, count: it.rating?1:0};
  }
  return {avg: it.rating||0, count: it.rating?1:0};
}
function seriesPublicStats(it){
  let sum=0, count=0;
  (it.seasons||[]).forEach(s => (s.episodes||[]).forEach(e => {
    const list = viewerRatings[episodeKey(it.id, s.number, e.number)] || [];
    list.forEach(r => { sum += r.score; count++; });
  }));
  const creatorAvg = seriesCreatorAvg(it);
  if(creatorAvg.count > 0){ sum += creatorAvg.avg; count++; }
  return {avg: count ? sum/count : 0, count};
}
function seriesViewerOwnAvg(it, name){
  let sum=0, count=0;
  (it.seasons||[]).forEach(s => (s.episodes||[]).forEach(e => {
    const list = viewerRatings[episodeKey(it.id, s.number, e.number)] || [];
    const mine = list.find(r => r.who.toLowerCase() === (name||'').toLowerCase());
    if(mine){ sum += mine.score; count++; }
  }));
  return {avg: count ? sum/count : 0, count};
}

function getViewerStats(key){
  let filmsRated = 0, showsRated = 0, episodesRated = 0;
  items.forEach(it => {
    if(it.type === 'film'){
      const list = viewerRatings[it.id] || [];
      if(list.some(r => r.who.toLowerCase() === key)) filmsRated++;
    } else if(isEpisodic(it.type)){
      let ratedThisShow = false;
      (it.seasons||[]).forEach(s => (s.episodes||[]).forEach(e => {
        const list = viewerRatings[episodeKey(it.id, s.number, e.number)] || [];
        if(list.some(r => r.who.toLowerCase() === key)){ episodesRated++; ratedThisShow = true; }
      }));
      if(ratedThisShow) showsRated++;
    }
  });
  return {filmsRated, showsRated, episodesRated};
}

  const brand = document.getElementById('navBrand');
  if(brand) brand.onclick = () => setMode('select');
  if(ctx === 'creator'){
    const sw = document.getElementById('navSwitch');
    if(sw) sw.onclick = () => setMode('viewer');
    const st = document.getElementById('navSettings');
    if(st) st.onclick = () => openCreatorSettings();
  } else {

    if(!el){ clearInterval(loginCountdownTick); loginCountdownTick = null; return; }
    const ms = target.getTime() - Date.now();
    if(ms <= 0){ el.textContent = "C'est l'heure !"; clearInterval(loginCountdownTick); loginCountdownTick = null; return; }
    const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000), m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
    el.textContent = `${d}j ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  };
  updateLoginCountdown();
  loginCountdownTick = setInterval(updateLoginCountdown, 1000);
}

/* ---------- SCHEDULE (calendrier hebdomadaire, mode paysage) ---------- */
const MONTHS_FR = ['JAN','FÉV','MAR','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'];
const DAYS_FR = ['LUNDI','MARDI','MERCREDI','JEUDI','VENDREDI','SAMEDI','DIMANCHE'];
let weekOffset = 0;

function isoDateLocal(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return isoDateLocal(new Date()); }
function startOfWeek(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function getWeekDates(offset){
  const base = startOfWeek(new Date());
  base.setDate(base.getDate() + offset*7);
  const days = [];
  for(let i=0;i<7;i++){
    const dt = new Date(base);
    dt.setDate(base.getDate()+i);
    days.push(dt);
  }
  return days;
}

function renderSchedule(ctx){
  const isCreator = ctx === 'creator';
  const today = todayISO();
  const days = getWeekDates(weekOffset);
  const weekLabel = `${days[0].getDate()} ${MONTHS_FR[days[0].getMonth()]} — ${days[6].getDate()} ${MONTHS_FR[days[6].getMonth()]} ${days[6].getFullYear()}`;

  app.innerHTML = `
    <div class="page">
      ${navHtml('schedule', isCreator ? 'creator' : 'viewer')}
      <div class="controls" style="align-items:center;">
        <div class="logo" style="flex:1;">
          <h1 style="font-size:26px;">CALENDRIER</h1>
        </div>
        ${isCreator ? `<button class="addbtn" id="openAddSched">+ Programmer</button>` : ''}
      </div>
      <div class="weekNav">
        <button class="pill" id="prevWeek">◀ Semaine préc.</button>
        <div class="weekLabel">${weekLabel}</div>
        <button class="pill" id="todayBtn">Aujourd'hui</button>
        <button class="pill" id="nextWeek">Semaine suiv. ▶</button>
      </div>
      <div class="weekGrid" id="weekGrid"></div>
    </div>
  `;
  wireNav(isCreator ? 'creator' : 'viewer');
  const addBtn = document.getElementById('openAddSched');
  if(addBtn) addBtn.onclick = () => openScheduleModal(null, todayISO());
  document.getElementById('prevWeek').onclick = () => { weekOffset--; renderSchedule(ctx); };
  document.getElementById('nextWeek').onclick = () => { weekOffset++; renderSchedule(ctx); };
  document.getElementById('todayBtn').onclick = () => { weekOffset = 0; renderSchedule(ctx); };

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = days.map(d => {
    const iso = isoDateLocal(d);
    const isToday = iso === today;
    const dayItems = scheduleItems.filter(s => s.date === iso).sort((a,b) => (a.time||'').localeCompare(b.time||''));
    return `
      <div class="dayCol ${isToday ? 'today' : ''}">
        <div class="dayColHead">
          <div class="dowName">${DAYS_FR[d.getDay() === 0 ? 6 : d.getDay()-1]}</div>
          <div class="dowDate">${d.getDate()} ${MONTHS_FR[d.getMonth()]}</div>
        </div>
        <div class="dayColBody">
          ${dayItems.length === 0 ? `<div class="dayEmpty">—</div>` : dayItems.map(s => `
            <div class="evCard" data-id="${s.id}">
              ${s.time ? `<div class="evTime">${escapeHtml(s.time)}</div>` : ''}
              <div class="evTitle">${escapeHtml(s.title)}</div>
              ${s.note ? `<div class="evNote">${escapeHtml(s.note)}</div>` : ''}
              ${isCreator ? `
                <div class="evActions">
                  <button class="schbtn edit" data-id="${s.id}">✎</button>
                  <button class="schbtn del" data-id="${s.id}">✕</button>
                </div>
              ` : ''}
            </div>
          `).join('')}
          ${isCreator ? `<button class="addDayBtn" data-date="${iso}">+ Ajouter</button>` : ''}
        </div>
      </div>
    `;
  }).join('');

  if(isCreator){
    grid.querySelectorAll('.addDayBtn').forEach(b => {
      b.onclick = () => openScheduleModal(null, b.dataset.date);
    });
    grid.querySelectorAll('.schbtn.edit').forEach(b => {
      b.onclick = (e) => { e.stopPropagation(); openScheduleModal(scheduleItems.find(s => s.id === b.dataset.id)); };
    });
    grid.querySelectorAll('.schbtn.del').forEach(b => {
      b.onclick = async (e) => {
        e.stopPropagation();
        scheduleItems = scheduleItems.filter(s => s.id !== b.dataset.id);
        await saveSchedule();
        renderSchedule('creator');
      };
    });
  }
}

function openScheduleModal(existing, prefillDate){

}

/* ---------- GRID (shared by creator/viewer) ---------- */
function getGenres(){
  const set = new Set();
  items.forEach(it => { if(it.genre && it.genre.trim()) set.add(it.genre.trim()); });
  return Array.from(set).sort((a,b) => a.localeCompare(b));
}

function getSagas(){
  const set = new Set();
  items.forEach(it => { if(it.saga && it.saga.trim()) set.add(it.saga.trim()); });
  return Array.from(set).sort((a,b) => a.localeCompare(b));
}

function getSagaGroups(){
  const map = {};
  items.forEach(it => {
    if(it.saga && it.saga.trim()){
      const key = it.saga.trim();
      if(!map[key]) map[key] = [];
      map[key].push(it);
    }
  });
  return Object.keys(map).sort((a,b) => a.localeCompare(b)).map(name => ({
    name,
    items: map[name].sort((a,b) => (parseInt(a.year,10)||0) - (parseInt(b.year,10)||0))
  }));
}

function filterControlsHtml(){
  const genres = getGenres();
  const sagas = getSagas();
  return `
    <select class="selectBox" id="genreFilter">
      <option value="all">Tous les genres</option>
      ${genres.map(g => `<option value="${escapeHtml(g)}" ${genreFilter===g?'selected':''}>${escapeHtml(g)}</option>`).join('')}
    </select>
    ${sagas.length ? `
    <select class="selectBox" id="sagaFilter">
      <option value="all">Toutes les sagas</option>
      ${sagas.map(s => `<option value="${escapeHtml(s)}" ${sagaFilter===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
    </select>
    ` : ''}
    <select class="selectBox" id="sortFilter">
      <option value="recent" ${sortBy==='recent'?'selected':''}>Récemment ajoutés</option>
      <option value="alpha" ${sortBy==='alpha'?'selected':''}>Alphabétique (A→Z)</option>
      <option value="rating_desc" ${sortBy==='rating_desc'?'selected':''}>Note décroissante</option>
      <option value="rating_asc" ${sortBy==='rating_asc'?'selected':''}>Note croissante</option>
      <option value="year" ${sortBy==='year'?'selected':''}>Date (année)</option>
    </select>
  `;
}
function wireFilterControls(ctx){
  const g = document.getElementById('genreFilter');
  const s = document.getElementById('sortFilter');
  const sg = document.getElementById('sagaFilter');
  g.value = genreFilter;
  s.value = sortBy;
  g.addEventListener('change', (e) => { genreFilter = e.target.value; renderGrid(ctx); });
  s.addEventListener('change', (e) => { sortBy = e.target.value; renderGrid(ctx); });
  if(sg){
    sg.value = sagaFilter;
    sg.addEventListener('change', (e) => { sagaFilter = e.target.value; renderGrid(ctx); });
  }
}

function overallRating(it){
  return creatorRatingStat(it).avg;
}

function isFavorite(it, ctx){
  if(ctx === 'creator') return !!it.favorite;
  const key = (viewerName||'').toLowerCase();
  const p = viewerProfiles[key];
  return !!(p && p.favorites && p.favorites.includes(it.id));
}
async function toggleFavorite(it, ctx){
  if(ctx === 'creator'){
    await loadCatalog();
    const fresh = items.find(x => x.id === it.id);
    if(fresh) fresh.favorite = !fresh.favorite;
    await saveCatalog();
  } else {
    const key = (viewerName||'').toLowerCase();
    if(!viewerProfiles[key]) viewerProfiles[key] = {display: viewerName, avatar:'', bio:'', favorites: []};
    if(!viewerProfiles[key].favorites) viewerProfiles[key].favorites = [];
    const favs = viewerProfiles[key].favorites;
    const idx = favs.indexOf(it.id);
    if(idx >= 0) favs.splice(idx, 1); else favs.push(it.id);
    await saveProfiles();
  }
}

function renderSagaCards(grid, ctx){
  const summaries = getSagaGroups().map(g => {
    const rated = g.items.filter(it => overallRating(it) > 0);
    const avg = rated.length ? rated.reduce((a,it) => a + overallRating(it), 0) / rated.length : 0;
    const cover = (g.items.find(it => it.poster) || {}).poster || '';
    return {name: g.name, items: g.items, avg, count: g.items.length, cover};
  });

  if(summaries.length === 0){
    grid.innerHTML = `
      <div class="empty">
        
        <div>${ctx === 'creator'
          ? "Aucune saga pour l'instant. Ouvre un titre → Modifier, et remplis le champ « Saga » (ex : Harry Potter, MCU, Spider-Man) pour le regrouper avec d'autres."
          : "Le créateur n'a pas encore organisé de sagas."}</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = `<div class="grid">${summaries.map(s => `
    <div class="card sagaCard" data-saga="${escapeHtml(s.name)}">
      <div class="poster" style="${s.cover ? `background-image:url('${s.cover}')` : ''}">
        ${s.cover ? '' : posterInitial(s.name)}
        <span class="badge">${s.count} titre${s.count>1?'s':''}</span>
      </div>
      <div class="info">
        <div class="title">${escapeHtml(s.name)}</div>
        <div class="ratingsRow">
          <span class="rchip" style="color:${ratingColor(s.avg)}" title="Note moyenne de la saga">Moy ${s.avg ? s.avg.toFixed(1).replace(/\.0$/,'') : '—'}</span>
        </div>
      </div>
    </div>
  `).join('')}</div>`;

  grid.querySelectorAll('.sagaCard').forEach(c => {
    c.onclick = () => { selectedSaga = c.dataset.saga; renderGrid(ctx); };
  });
}

function renderGrid(ctx){
  const grid = document.getElementById('grid');

  if(filter === 'sagas' && !selectedSaga){
    renderSagaCards(grid, ctx);
    return;
  }

  const backHtml = (filter === 'sagas' && selectedSaga) ? `
    <button class="back" id="backToSagas" style="margin-bottom:16px;">← Toutes les sagas</button>
    <div class="sectionLabel" style="margin-top:0;">${escapeHtml(selectedSaga)}</div>
  ` : '';

  let list;
  if(filter === 'sagas' && selectedSaga){
    list = items.filter(it => (it.saga||'').trim() === selectedSaga);
  } else {
    list = items.filter(it => filter==='all' || filter==='favorites' || it.type===filter);
    if(filter === 'favorites'){
      list = list.filter(it => isFavorite(it, ctx));
    }
  }
  if(genreFilter !== 'all'){
    list = list.filter(it => (it.genre||'').trim() === genreFilter);
  }
  if(sagaFilter !== 'all'){
    list = list.filter(it => (it.saga||'').trim() === sagaFilter);
  }
  if(query.trim()){
    const q = query.trim().toLowerCase();
    list = list.filter(it => (it.title||'').toLowerCase().includes(q) || (it.genre||'').toLowerCase().includes(q));
  }
  list = list.slice();
  if(sortBy === 'alpha'){
    list.sort((a,b) => (a.title||'').localeCompare(b.title||''));
  } else if(sortBy === 'rating_desc'){
    list.sort((a,b) => overallRating(b) - overallRating(a));
  } else if(sortBy === 'rating_asc'){
    list.sort((a,b) => overallRating(a) - overallRating(b));
  } else if(sortBy === 'year'){
    list.sort((a,b) => (parseInt(b.year,10)||0) - (parseInt(a.year,10)||0));
  } else {
    list.sort((a,b) => (b.addedAt||0) - (a.addedAt||0));
  }

  if(items.length === 0){
    grid.innerHTML = ctx === 'creator'
      ? `<div class="empty"><div>Ta collection est vide pour l'instant.</div><button class="btn2" id="emptyAdd">Ajouter ton premier titre</button></div>`
      : `<div class="empty"><div>Le créateur n'a pas encore ajouté de titres.</div></div>`;
    const btn = document.getElementById('emptyAdd');
    if(btn) btn.onclick = () => openModal();
    return;
  }
  if(list.length === 0){
    grid.innerHTML = backHtml + (filter === 'favorites'
      ? `<div class="empty"><div>Aucun favori pour l'instant.</div></div>`
      : `<div class="empty"><div>Aucun résultat pour cette recherche.</div></div>`);
    const bb = document.getElementById('backToSagas');
    if(bb) bb.onclick = () => { selectedSaga = null; renderGrid(ctx); };
    return;
  }
  grid.innerHTML = backHtml + `<div class="grid">${list.map(it => {
    const episodic = isEpisodic(it.type);
    const creatorStat = creatorRatingStat(it);
    const pub = episodic ? seriesPublicStats(it) : publicStats(it.id);
    const mineStat = ctx === 'viewer'
      ? (episodic ? seriesViewerOwnAvg(it, viewerName) : {avg: (viewerRatings[it.id]||[]).find(r=>r.who.toLowerCase()===viewerName.toLowerCase())?.score || 0, count: (viewerRatings[it.id]||[]).find(r=>r.who.toLowerCase()===viewerName.toLowerCase()) ? 1 : 0})
      : null;
    const fav = isFavorite(it, ctx);
    return `
    <div class="card" data-id="${it.id}">
      <div class="poster" style="${it.poster ? `background-image:url('${it.poster}')` : ''}">
        ${it.poster ? '' : posterInitial(it.title)}
        <span class="badge">${typeLabel(it.type)}</span>
        ${it.rediff ? `<a href="${escapeHtml(it.rediff)}" target="_blank" rel="noopener noreferrer" class="badge rediff" title="Voir la rediff">▶ Rediff</a>` : ''}
        <button class="favBtn ${fav ? 'active' : ''}" data-fav="${it.id}" title="Favori">${fav ? '♥' : '♡'}</button>
      </div>
      <div class="info">
        <div class="title">${escapeHtml(it.title)}</div>
        ${it.year ? `<div class="year">${escapeHtml(it.year)}</div>` : ''}
        <div class="ratingsRow">
          <span class="rchip" style="color:${ratingColor(creatorStat.avg)}" title="Note du créateur">Créa ${creatorStat.count ? creatorStat.avg.toFixed(1).replace(/\.0$/,'') : '—'}</span>
          ${ctx === 'viewer' ? `<span class="rchip" style="color:${ratingColor(mineStat.avg)}" title="Ta note">Toi ${mineStat.count ? mineStat.avg.toFixed(1).replace(/\.0$/,'') : '—'}</span>` : ''}
          <span class="rchip" style="color:${ratingColor(pub.avg)}" title="Note moyenne${pub.count ? ' ('+pub.count+')' : ''}">Moy ${pub.count ? pub.avg.toFixed(1) : '—'}</span>
        </div>
      </div>
    </div>
  `}).join('')}</div>`;

  grid.querySelectorAll('.favBtn').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const it = items.find(x => x.id === b.dataset.fav);
      await toggleFavorite(it, ctx);
      renderGrid(ctx);
    };
  });

  grid.querySelectorAll('.badge.rediff').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); };
  });

  grid.querySelectorAll('.card').forEach(c => {
    c.onclick = () => {
      if(ctx === 'creator'){
        openDetail(c.dataset.id);
      } else {
        openViewerRate(c.dataset.id);
      }
    };
  });

  const backBtn = document.getElementById('backToSagas');
  if(backBtn) backBtn.onclick = () => { selectedSaga = null; renderGrid(ctx); };
}

/* ---------- CREATOR: add/edit modal ---------- */
function openModal(existing){
  const isEdit = !!existing;
  const it = existing || {type:'film', title:'', year:'', genre:'', saga:'', synopsis:'', poster:'', rating:0, rediff:''};
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h3>${isEdit ? 'Modifier le titre' : 'Ajouter un titre'}</h3>
        <div class="typetoggle">
          <button type="button" class="typebtn ${it.type==='film'?'active':''}" data-t="film">Film</button>
          <button type="button" class="typebtn ${it.type==='serie'?'active':''}" data-t="serie">Série</button>
          <button type="button" class="typebtn ${it.type==='anime'?'active':''}" data-t="anime">Anime</button>
        </div>
        <label>Titre</label>
        <input type="text" id="fTitle" value="${escapeHtml(it.title)}" placeholder="ex : Parasite">
        <div class="row2">
          <div style="flex:1;"><label>Année</label><input type="text" id="fYear" value="${escapeHtml(it.year)}" placeholder="2019"></div>
          <div style="flex:1;"><label>Genre</label><input type="text" id="fGenre" value="${escapeHtml(it.genre)}" placeholder="Thriller"></div>
        </div>
        <label>Saga (optionnel)</label>
        <input type="text" id="fSaga" list="sagaList" value="${escapeHtml(it.saga||'')}" placeholder="ex : Harry Potter">
        <datalist id="sagaList">
          ${getSagas().map(s => `<option value="${escapeHtml(s)}"></option>`).join('')}
        </datalist>
        <label>Affiche</label>
        <div class="posterrow">
          <div class="posterpreview" id="posterPreview" style="${it.poster ? `background-image:url('${it.poster}')`:''}">${it.poster ? '' : '+'}</div>
          <div class="posterfields">
            <label class="filebtn" for="fFile">Importer une image</label>
            <input type="file" id="fFile" accept="image/*">
            <label style="margin-top:4px;">ou coller une URL</label>
            <input type="text" id="fPosterUrl" value="${it.poster && it.poster.startsWith('http') ? escapeHtml(it.poster) : ''}" placeholder="https://...">
          </div>
        </div>
        <label>Synopsis (optionnel)</label>
        <textarea id="fSynopsis" placeholder="Une phrase pour se souvenir de quoi ça parle">${escapeHtml(it.synopsis)}</textarea>
        <label>Lien de la rediff (optionnel)</label>
        <input type="text" id="fRediff" value="${escapeHtml(it.rediff||'')}" placeholder="https://twitch.tv/videos/...">
        <div class="modalbtns">
          <button class="btn ghost" id="cancelBtn">Annuler</button>
          <button class="btn primary" id="saveBtn">${isEdit ? 'Enregistrer' : 'Ajouter'}</button>
        </div>
      </div>
    </div>
  `;
  let currentType = it.type;
  let posterData = it.poster || '';

  root.querySelectorAll('.typebtn').forEach(b => {
    b.onclick = () => {
      currentType = b.dataset.t;
      root.querySelectorAll('.typebtn').forEach(x => x.classList.toggle('active', x===b));
    };
  });

  document.getElementById('fFile').onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (ev) => {
      img.onload = () => {
        const maxW = 600;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx2 = canvas.getContext('2d');
        ctx2.imageSmoothingEnabled = true;
        ctx2.imageSmoothingQuality = 'high';
        ctx2.drawImage(img, 0, 0, canvas.width, canvas.height);
        posterData = canvas.toDataURL('image/jpeg', 0.85);
        document.getElementById('posterPreview').style.backgroundImage = `url('${posterData}')`;
        document.getElementById('posterPreview').textContent = '';
        document.getElementById('fPosterUrl').value = '';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('fPosterUrl').addEventListener('input', (e) => {
    const val = e.target.value.trim();
    if(val){
      posterData = val;
      document.getElementById('posterPreview').style.backgroundImage = `url('${val}')`;
      document.getElementById('posterPreview').textContent = '';
    }
  });

  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') closeModal(); };

  document.getElementById('saveBtn').onclick = async () => {
    const title = document.getElementById('fTitle').value.trim();
    if(!title) return;
    const year = document.getElementById('fYear').value.trim();
    const genre = document.getElementById('fGenre').value.trim();
    const saga = document.getElementById('fSaga').value.trim();
    const synopsis = document.getElementById('fSynopsis').value.trim();
    const rediff = document.getElementById('fRediff').value.trim();
    const urlVal = document.getElementById('fPosterUrl').value.trim();
    if(urlVal) posterData = urlVal;

    await loadCatalog();
    if(isEdit){
      const idx = items.findIndex(x => x.id === it.id);
      if(idx >= 0){
        items[idx] = {...items[idx], title, year, genre, saga, synopsis, rediff, poster: posterData, type: currentType};
      }
    } else {
      items.push({
        id: 'm-' + Math.random().toString(36).slice(2,10),
        title, year, genre, saga, synopsis, rediff, poster: posterData, type: currentType,
        rating: 0, seasons: [], addedAt: Date.now()
      });
    }
    await saveCatalog();
    closeModal();
    renderGrid('creator');
  };
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

      <div class="modal">
        <div class="detailhead">
          <div class="detailposter" style="${it.poster?`background-image:url('${it.poster}')`:''}">${it.poster?'':posterInitial(it.title)}</div>

            <h3>${escapeHtml(it.title)}</h3>
            <div class="metaline">${typeLabel(it.type)}${it.year ? ' · '+escapeHtml(it.year):''}${it.genre ? ' · '+escapeHtml(it.genre):''}</div>
            <label>Ma note</label>
            <div class="ratebox">
              <input type="text" inputmode="decimal" id="rateInput" style="color:${ratingColor(it.rating)}" value="${it.rating ? it.rating : ''}" placeholder="—">

        ${isEpisodic(it.type) ? `<button class="episodesBtn" id="epsBtn">Noter les saisons & épisodes</button>` : ''}
        ${it.synopsis ? `<div class="synopsis">${escapeHtml(it.synopsis)}</div>` : ''}
        ${it.rediff ? `<a href="${escapeHtml(it.rediff)}" target="_blank" rel="noopener noreferrer" class="rediffLink">▶ Voir la rediff</a>` : ''}
        ${(viewerRatings[id]||[]).some(r=>r.comment) ? `
          <div class="commentsTitle">Avis des viewers</div>
          ${(viewerRatings[id]||[]).filter(r=>r.comment).slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).map(r => `
            <div class="comment">
              <div class="who"><span>${escapeHtml(r.who)}</span><span style="color:${ratingColor(r.score)}">${r.score % 1 === 0 ? r.score : r.score.toFixed(1)}/10</span></div>
              <div class="txt">${escapeHtml(r.comment)}</div>
            </div>
          `).join('')}
        ` : ''}
        ${ratersListHtml(it)}
        <div class="modalbtns">
          <button class="btn danger" id="delBtn">Supprimer</button>
          <button class="btn ghost" id="editBtn">Modifier</button>
          <button class="btn primary" id="closeBtn">Fermer</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') closeModal(); };
  document.getElementById('closeBtn').onclick = closeModal;
  document.getElementById('editBtn').onclick = () => openModal(it);
  const epsBtn = document.getElementById('epsBtn');
  if(epsBtn) epsBtn.onclick = () => openEpisodesManager(it);
  document.getElementById('delBtn').onclick = async () => {
    await loadCatalog();
    items = items.filter(x => x.id !== id);
    delete viewerRatings[id];
    await saveCatalog();
    await saveRatings();
    closeModal();
    renderGrid('creator');
  };
  const rateInput = root.querySelector('#rateInput');
  const commitRating = async () => {
    const raw = rateInput.value.replace(',', '.').trim();
    let val = parseFloat(raw);
    let newRating;
    if(raw === '' || isNaN(val)){
      newRating = 0;
      rateInput.value = '';
    } else {
      val = Math.max(0, Math.min(10, val));
      val = Math.round(val * 10) / 10;
      newRating = val;
      rateInput.value = val;
    }
    await loadCatalog();
    const fresh = items.find(x => x.id === it.id);
    if(fresh) fresh.rating = newRating;
    it.rating = newRating;
    await saveCatalog();
    renderGrid('creator');
  };
  rateInput.addEventListener('input', () => {
    const v = parseFloat(rateInput.value.replace(',', '.'));
    rateInput.style.color = ratingColor(isNaN(v) ? 0 : v);
  });
  rateInput.addEventListener('blur', commitRating);
  rateInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ rateInput.blur(); } });
}

/* ---------- CREATOR: manage seasons & episodes ---------- */
function openEpisodesManager(it){
  if(!it.seasons) it.seasons = [];
  const root = document.getElementById('modalRoot');

  function draw(){
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="modal">
          <h3>${escapeHtml(it.title)}</h3>
          <div id="seasonsWrap"></div>
          <button class="addSeasonBtn" id="addSeasonBtn">+ Ajouter une saison</button>
          <div class="modalbtns" style="margin-top:18px;">
            <button class="btn ghost" id="closeBtn">Fermer</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') closeModal(); };
    document.getElementById('closeBtn').onclick = closeModal;

    const wrap = document.getElementById('seasonsWrap');
    if(it.seasons.length === 0){
      wrap.innerHTML = `<div class="empty" style="padding:36px 18px;"><div>Aucune saison pour l'instant. Ajoute ta première saison ci-dessous.</div></div>`;
    } else {
      wrap.innerHTML = it.seasons.map(s => `
        <div class="seasonBlock">
          <div class="seasonHead">
            <span class="seasonTitle">Saison ${s.number}</span>
            <button class="delSeasonBtn" data-season="${s.id}">Supprimer la saison ✕</button>
          </div>
          ${(s.episodes||[]).map(e => `
            <div class="epRow">
              <span class="epNum">E${e.number}</span>
              <span class="epLabel">Épisode ${e.number}</span>
              <input type="text" inputmode="decimal" class="epInput" data-season="${s.id}" data-ep="${e.id}"
                style="color:${ratingColor(e.rating)}" value="${e.rating ? e.rating : ''}" placeholder="—">
              <button class="epDel" data-season="${s.id}" data-ep="${e.id}">✕</button>
            </div>
          `).join('')}
          <button class="addEpBtn" data-season="${s.id}">+ Ajouter un épisode</button>
        </div>
      `).join('');
    }

    document.getElementById('addSeasonBtn').onclick = async () => {
      await loadCatalog();
      it = items.find(x => x.id === it.id) || it;
      if(!it.seasons) it.seasons = [];
      const nextNum = it.seasons.length ? Math.max(...it.seasons.map(s => s.number)) + 1 : 1;
      it.seasons.push({id: 'se-' + Math.random().toString(36).slice(2,9), number: nextNum, episodes: []});
      await saveCatalog();
      draw();
    };

    wrap.querySelectorAll('.delSeasonBtn').forEach(b => {
      b.onclick = async () => {
        await loadCatalog();
        it = items.find(x => x.id === it.id) || it;
        const season = it.seasons.find(s => s.id === b.dataset.season);
        (season.episodes||[]).forEach(e => { delete viewerRatings[episodeKey(it.id, season.number, e.number)]; });
        it.seasons = it.seasons.filter(s => s.id !== b.dataset.season);
        await saveCatalog();
        await saveRatings();
        draw();
      };
    });

    wrap.querySelectorAll('.addEpBtn').forEach(b => {
      b.onclick = async () => {
        await loadCatalog();
        it = items.find(x => x.id === it.id) || it;
        const season = it.seasons.find(s => s.id === b.dataset.season);
        if(!season.episodes) season.episodes = [];
        const nextNum = season.episodes.length ? Math.max(...season.episodes.map(e => e.number)) + 1 : 1;
        season.episodes.push({id: 'ep-' + Math.random().toString(36).slice(2,9), number: nextNum, rating: 0});
        await saveCatalog();
        draw();
      };
    });

    wrap.querySelectorAll('.epDel').forEach(b => {
      b.onclick = async () => {
        await loadCatalog();
        it = items.find(x => x.id === it.id) || it;
        const season = it.seasons.find(s => s.id === b.dataset.season);
        const ep = season.episodes.find(e => e.id === b.dataset.ep);
        delete viewerRatings[episodeKey(it.id, season.number, ep.number)];
        season.episodes = season.episodes.filter(e => e.id !== b.dataset.ep);
        await saveCatalog();
        await saveRatings();
        draw();
      };
    });

    wrap.querySelectorAll('.epInput').forEach(inp => {
      const commit = async () => {
        const raw = inp.value.replace(',', '.').trim();
        let val = parseFloat(raw);
        let newVal;
        if(raw === '' || isNaN(val)){
          newVal = 0; inp.value = '';
        } else {
          val = Math.max(0, Math.min(10, val));
          val = Math.round(val * 10) / 10;
          newVal = val; inp.value = val;
        }
        inp.style.color = ratingColor(newVal);
        await loadCatalog();
        it = items.find(x => x.id === it.id) || it;
        const season = it.seasons.find(s => s.id === inp.dataset.season);
        const ep = season.episodes.find(e => e.id === inp.dataset.ep);
        ep.rating = newVal;
        await saveCatalog();
        renderGrid('creator');
      };
      inp.addEventListener('input', () => {
        const v = parseFloat(inp.value.replace(',', '.'));
        inp.style.color = ratingColor(isNaN(v) ? 0 : v);
      });
      inp.addEventListener('blur', commit);

}

/* ---------- VIEWER: rate seasons & episodes ---------- */
function openViewerEpisodes(it){
  const root = document.getElementById('modalRoot');

  function draw(){
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="modal">
          <h3>${escapeHtml(it.title)}</h3>
          <div id="seasonsWrap"></div>
          <div class="modalbtns" style="margin-top:18px;">
            <button class="btn primary" id="closeBtn">Fermer</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') closeModal(); };
    document.getElementById('closeBtn').onclick = closeModal;

    const wrap = document.getElementById('seasonsWrap');
    const seasons = it.seasons || [];
    if(seasons.length === 0){
      wrap.innerHTML = `<div class="empty" style="padding:36px 18px;"><div>Le créateur n'a pas encore ajouté de saisons pour ce titre.</div></div>`;
      return;
    }
    wrap.innerHTML = seasons.map(s => `
      <div class="seasonBlock">
        <div class="seasonHead"><span class="seasonTitle">Saison ${s.number}</span></div>
        ${(s.episodes||[]).map(e => {
          const key = episodeKey(it.id, s.number, e.number);
          const list = viewerRatings[key] || [];
          const mine = list.find(r => r.who.toLowerCase() === viewerName.toLowerCase());
          return `
            <div class="epRow">
              <span class="epNum">E${e.number}</span>
              <span class="epLabel">Épisode ${e.number}${e.rating ? ` · ${e.rating}/10` : ''}</span>
              <input type="text" inputmode="decimal" class="epInput" data-season="${s.number}" data-ep="${e.number}"
                style="color:${ratingColor(mine ? mine.score : 0)}" value="${mine ? mine.score : ''}" placeholder="—">
            </div>
          `;
        }).join('')}
      </div>
    `).join('');

    wrap.querySelectorAll('.epInput').forEach(inp => {
      const commit = async () => {
        const season = parseInt(inp.dataset.season, 10);
        const ep = parseInt(inp.dataset.ep, 10);
        const key = episodeKey(it.id, season, ep);
        const raw = inp.value.replace(',', '.').trim();
        let val = parseFloat(raw);
        if(raw === '' || isNaN(val)) return;
        val = Math.max(0, Math.min(10, val));
        val = Math.round(val * 10) / 10;
        if(!viewerRatings[key]) viewerRatings[key] = [];
        const idx = viewerRatings[key].findIndex(r => r.who.toLowerCase() === viewerName.toLowerCase());
        const entry = {who: viewerName, score: val, ts: Date.now()};
        if(idx >= 0) viewerRatings[key][idx] = entry; else viewerRatings[key].push(entry);
        await saveRatings();
        inp.style.color = ratingColor(val);
        renderGrid('viewer');
      };
      inp.addEventListener('input', () => {
        const v = parseFloat(inp.value.replace(',', '.'));
        inp.style.color = ratingColor(isNaN(v) ? 0 : v);
      });
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', (e) => { if(e.key === 'Enter') inp.blur(); });
    });
  }
  draw();
}

    const file = e.target.files[0];
    if(!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (ev) => {
      img.onload = () => {
        const maxW = 320;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const c2 = canvas.getContext('2d');
        c2.imageSmoothingEnabled = true;
        c2.imageSmoothingQuality = 'high';
        c2.drawImage(img, 0, 0, canvas.width, canvas.height);
        localAvatar = canvas.toDataURL('image/jpeg', 0.85);
        document.getElementById('avatarPreview').innerHTML = `<img src="${localAvatar}">`;
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

    viewerProfiles[key] = {display: newDisplay, avatar: localAvatar, bio};

  const MAX_BT_SIZE = 50 * 1024 * 1024; // 50 Mo (limite du plan gratuit Supabase)
  let pendingFile = null;
  const dropzone = document.getElementById('btDropzone');
  const fileInput = document.getElementById('btFile');
  const dropText = document.getElementById('btDropText');
  const statusEl0 = document.getElementById('btUploadStatus');

  function handlePickedFile(file){
    if(!file) return;
    if(file.size > MAX_BT_SIZE){
      const mo = (file.size / (1024*1024)).toFixed(1);
      statusEl0.style.color = 'var(--rate-red)';
      statusEl0.textContent = `Fichier trop lourd (${mo} Mo) — 50 Mo maximum. Raccourcis l'extrait à 15-30 secondes.`;
      pendingFile = null;
      dropText.innerHTML = 'Glisse ton fichier ici<br><span style="opacity:0.6;">ou clique pour parcourir</span>';
      return;
    }
    statusEl0.textContent = '';
    pendingFile = file;
    dropText.innerHTML = `✓ ${escapeHtml(file.name)}<br><span style="opacity:0.6;">(${(file.size/(1024*1024)).toFixed(1)} Mo) — clique pour changer</span>`;
  }

  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();

      statusEl.style.color = 'var(--rate-red)';
      statusEl.textContent = 'Erreur : ' + upErr.message;
      return;
    }
    const { data: urlData } = supabaseClient.storage.from(BT_BUCKET).getPublicUrl(path);
    await loadBtTracks();
    const mediaType = pendingFile.type.startsWith('video') ? 'video' : 'audio';

    statusEl.style.color = 'var(--rate-green)';
    statusEl.textContent = '✓ Ajouté !';
    document.getElementById('btTitle').value = '';
    document.getElementById('btAnimeName').value = '';
    document.getElementById('btAliases').value = '';
    document.getElementById('btFile').value = '';
    pendingFile = null;
    dropText.innerHTML = 'Glisse ton fichier ici<br><span style="opacity:0.6;">ou clique pour parcourir</span>';
    drawBtTrackList();
  };

  wrap.innerHTML = btTracks.map(t => `

      <span class="cat" style="color:${t.difficulty==='Facile'?'var(--rate-green)':t.difficulty==='Difficile'?'var(--rate-red)':'var(--mustard)'};border-color:currentColor;">${escapeHtml(t.difficulty||'Normal')}</span>

    b.onclick = async () => {
      await loadBtTracks();
      const track = btTracks.find(t => t.id === b.dataset.id);
      if(track && track.path){
        try{ await supabaseClient.storage.from(BT_BUCKET).remove([track.path]); }catch(e){}
      }
      btTracks = btTracks.filter(t => t.id !== b.dataset.id);
      await saveBtTracks();
      drawBtTrackList();
    };
  });
}

      fresh.difficulty = difficulty;
    }
    await saveBtTracks();
    closeModal();
    drawBtTrackList();
  };
}

let btPollTimer = null;

function stopBtPoll(){ if(btPollTimer){ clearInterval(btPollTimer); btPollTimer = null; } }

function btPlayerRows(){

          ? (p.answered ? '✓ a répondu' : '…')
          : (btGame.status==='revealed' && p.answered ? `${p.lastCorrect ? '✓' : '✗'} « ${escapeHtml(p.lastAnswerText||'')} »${p.lastPoints ? ' +'+p.lastPoints+' pts' : ''}` : '')}

      <span class="pts">${p.score||0} pts</span>

}

  const g = btGame;

      <div class="btCatGrid" id="btDiffGrid">

        const trackEntries = poolTracks.map(t => {
          const anime = impliedAnimeName(t);
          const fullText = stripAccents((t.title||'').toLowerCase());
          const wideText = stripAccents([anime, ...(t.aliases||[]), t.category, t.title].filter(Boolean).join(' ').toLowerCase());
          return {title: t.title, fullText, wideText};
        });
        const renderSuggestions = (q) => {
          if(!q){ suggBox.innerHTML = ''; return; }
          const tokens = q.split(/\s+/).filter(Boolean);
          const results = [];
          trackEntries.forEach(e => {
            const inFull = tokens.every(tok => e.fullText.includes(tok));
            const inWide = tokens.every(tok => e.wideText.includes(tok));
            if(inFull) results.push({title: e.title, tier: 'full'});
            else if(inWide) results.push({title: e.title, tier: 'partial'});

        if(btDraftAnswer){
          renderSuggestions(stripAccents(btDraftAnswer.trim().toLowerCase()));
        }
        if(document.activeElement !== guessInput){

async function startBtRound(inCreator){
  await loadBtGame();
  await loadBtTracks();
  if(!btGame.pool || btGame.pool.length === 0){
    btGame.status = 'finished';
    await saveBtGame();
    drawBt(inCreator);
    return;
  }
  const idx = Math.floor(Math.random()*btGame.pool.length);
  const trackId = btGame.pool[idx];
  btGame.pool = btGame.pool.filter(id => id !== trackId);
  const track = btTracks.find(t => t.id === trackId);
  if(!track){ await saveBtGame(); drawBt(inCreator); return; }

  Object.values(btGame.players).forEach(p => { p.answered = false; p.lastCorrect = null; p.lastPoints = 0; });
  btGame.currentTrack = {
    id: track.id, title: track.title, animeName: track.animeName||'', category: track.category,
    audioUrl: track.audioUrl, mediaType: track.mediaType||'audio', difficulty: track.difficulty||'Normal'
  };
  btGame.playStartedAt = Date.now();
  btGame.status = 'playing';
  btGame.round = (btGame.round||0) + 1;
  await saveBtGame();
  drawBt(inCreator);
}

let btSubmitLock = false;
async function submitBtAnswer(rawText, inCreator){
  if(btSubmitLock) return;
  if(!rawText || !rawText.trim()) return;
  btSubmitLock = true;
  try{
    await loadBtGame();
    const key = (viewerName||'').toLowerCase();
    const me = btGame.players[key];
    if(!me || me.answered || btGame.status !== 'playing'){ drawBt(inCreator); return; }
    const track = btGame.currentTrack;
    const trackFull = btTracks.find(t => t.id === track.id) || {};
    const anime = impliedAnimeName(trackFull) || track.animeName || '';
    const tokens = stripAccents((rawText||'').trim().toLowerCase()).split(/\s+/).filter(Boolean);
    const fullText = stripAccents((track.title||'').toLowerCase());
    const wideText = stripAccents([anime, ...(trackFull.aliases||[]), track.category, track.title].filter(Boolean).join(' ').toLowerCase());

    let tier = null;
    if(tokens.length && tokens.every(tok => fullText.includes(tok))) tier = 'full';
    else if(tokens.length && tokens.every(tok => wideText.includes(tok))) tier = 'partial';
    const correct = tier !== null;

    const elapsed = btLocalRoundStartedAt ? (Date.now() - btLocalRoundStartedAt) / 1000 : 0;
    let points = 0;
    if(correct){
      const timer = btGame.timerSeconds || 30;
      const decayRate = 100 / timer;
      const base = Math.max(0, 100 - elapsed*decayRate);
      const diff = track.difficulty || 'Normal';
      const diffMult = diff === 'Difficile' ? 1.75 : diff === 'Normal' ? 1.25 : 1;
      const tierMult = tier === 'partial' ? 0.5 : 1;
      points = Math.max(20, Math.round(base * diffMult * tierMult));
    }
    me.answered = true;
    me.lastCorrect = correct;
    me.lastPoints = points;
  me.lastAnswerText = rawText;
  btDraftAnswer = '';
    me.score = (me.score||0) + points;
    await saveBtGame();
    if(points > 0) await addPoints(key, points);
    drawBt(inCreator);
  } finally {
    btSubmitLock = false;
  }
}

function revealBtRound(inCreator){
  (async () => {
    await loadBtGame();
    btGame.status = 'revealed';
    await saveBtGame();
    drawBt(inCreator);
  })();
}

/* ---------- ROUE DES FILMS ---------- */
let wheelViewFromCreator = true;
let wheelSpinning = false;

function polarToCartesian(cx, cy, r, angleDeg){
  const a = (angleDeg - 90) * Math.PI / 180.0;
  return {x: cx + r * Math.cos(a), y: cy + r * Math.sin(a)};
}
function describeArc(cx, cy, r, startAngle, endAngle){
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 0 ${end.x} ${end.y} Z`;
}
function truncateLabel(s, n){
  s = s || '';
  return s.length > n ? s.slice(0, n-1) + '…' : s;
}
function buildWheelSVG(wItems){
  const size = 300, cx = size/2, cy = size/2, r = size/2 - 4;
  const n = wItems.length;
  const segAngle = 360 / n;
  const palette = ['#e6b325','#c99a1e','#8a6a15','#f0d060','#b8860b','#9146ff','#d4af37'];
  let paths = '', texts = '';
  wItems.forEach((it, i) => {
    const start = i*segAngle, end = start+segAngle;
    const color = palette[i % palette.length];
    paths += `<path d="${describeArc(cx,cy,r,start,end)}" fill="${color}" stroke="#071a17" stroke-width="1.5"/>`;
    const mid = start + segAngle/2;
    const tx = polarToCartesian(cx, cy, r*0.62, mid);
    texts += `<text x="${tx.x}" y="${tx.y}" fill="var(--ink)" font-size="10" font-family="Space Grotesk, sans-serif" font-weight="700" text-anchor="middle" transform="rotate(${mid}, ${tx.x}, ${tx.y})">${escapeHtml(truncateLabel(it.label,16))}</text>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%">${paths}${texts}</svg>`;
}

async function startUcGame(inCreator){
  await loadUc();
  const keys = Object.keys(ucGame.players);
  const shuffled = keys.slice().sort(() => Math.random()-0.5);
  const numUndercover = Math.min(ucGame.numUndercover, Math.max(1, Math.floor(shuffled.length/3)));
  const mrWhiteKey = ucGame.includeMrWhite ? shuffled[0] : null;
  const undercoverKeys = shuffled.slice(mrWhiteKey ? 1 : 0, (mrWhiteKey?1:0) + numUndercover);

  shuffled.forEach(k => {
    const p = ucGame.players[k];
    if(k === mrWhiteKey){ p.role = 'mrwhite'; p.word = ''; }
    else if(undercoverKeys.includes(k)){ p.role = 'undercover'; p.word = ucGame.undercoverWord; }
    else { p.role = 'civilian'; p.word = ucGame.civilianWord; }
    p.alive = true;
  });

  ucGame.status = 'playing';
  ucGame.round = 1;
  ucGame.votes = {};
  ucGame.lastElimination = null;
  await saveUc();
  drawUc(inCreator);
}

async function castUcVote(targetKey, inCreator){
  await loadUc();
  const key = (viewerName||'').toLowerCase();
  const me = ucGame.players[key];
  if(!me || !me.alive || ucGame.status !== 'voting') { drawUc(inCreator); return; }
  if(!ucGame.votes) ucGame.votes = {};
  ucGame.votes[key] = targetKey;
  await saveUc();
  drawUc(inCreator);
}

function ucCheckWinner(){
  const alive = ucAlivePlayers();
  const civ = alive.filter(([,p]) => p.role === 'civilian').length;
  const bad = alive.filter(([,p]) => p.role !== 'civilian').length;
  if(bad === 0) return 'civilians';
  if(bad >= civ) return 'undercover';
  return null;
}

async function closeUcVote(inCreator){
  await loadUc();
  const tally = {};
  Object.values(ucGame.votes||{}).forEach(v => { tally[v] = (tally[v]||0) + 1; });
  let topKey = null, topCount = -1;
  Object.entries(tally).forEach(([k,c]) => { if(c > topCount){ topCount = c; topKey = k; } });
  if(!topKey){ ucGame.status = 'playing'; await saveUc(); drawUc(inCreator); return; }

  const eliminated = ucGame.players[topKey];
  eliminated.alive = false;
  ucGame.eliminatedHistory.push({key:topKey, display:eliminated.display, role:eliminated.role});
  ucGame.lastElimination = {display:eliminated.display, role:eliminated.role};

  if(eliminated.role === 'mrwhite'){
    const guessed = confirm(`${eliminated.display} était Mr White. A-t-il/elle deviné le mot des civils (« ${ucGame.civilianWord} ») ?`);
    if(guessed){
      ucGame.status = 'ended';
      ucGame.winner = 'mrwhite';
      await saveUc();
      drawUc(inCreator);
      return;
    }
  }

  const winner = ucCheckWinner();
  if(winner){
    ucGame.status = 'ended';
    ucGame.winner = winner;
  } else {
    ucGame.status = 'playing';
    ucGame.round += 1;
    ucGame.votes = {};
  }
  await saveUc();
  drawUc(inCreator);
}

function drawWheelSuggestions(){
  const wrap = document.getElementById('wheelSuggList');
  if(!wrap) return;
  const pending = wheelSuggestions.filter(s => s.status === 'pending');
  if(pending.length === 0){
    wrap.innerHTML = `<div class="empty" style="padding:20px 14px;"><div>Aucune proposition en attente.</div></div>`;
    return;
  }
  wrap.innerHTML = pending.map(s => `
    <div class="btTrackRow">
      <span class="t">${escapeHtml(s.title)} <span style="color:var(--text-dim);font-size:11px;">— par ${escapeHtml(s.submittedBy)}</span></span>
      ${s.trailerUrl ? `<a href="${escapeHtml(s.trailerUrl)}" target="_blank" rel="noopener" class="pill" style="text-decoration:none;">Trailer</a>` : ''}
      <button class="del" id="wsApprove-${s.id}" title="Ajouter à la roue">✓</button>
      <button class="del" id="wsReject-${s.id}" title="Refuser">✕</button>
    </div>
  `).join('');
  pending.forEach(s => {
    const app_ = document.getElementById(`wsApprove-${s.id}`);
    if(app_) app_.onclick = async () => {
      await loadWheel();
      await loadWheelSuggestions();
      wheelItems.push({id: 'w-' + Math.random().toString(36).slice(2,9), label: s.title});
      await saveWheel();
      const fresh = wheelSuggestions.find(x => x.id === s.id);
      if(fresh) fresh.status = 'approved';
      await saveWheelSuggestions();
      renderWheel();
    };
    const rej = document.getElementById(`wsReject-${s.id}`);
    if(rej) rej.onclick = async () => {
      await loadWheelSuggestions();
      const fresh = wheelSuggestions.find(x => x.id === s.id);
      if(fresh) fresh.status = 'rejected';
      await saveWheelSuggestions();
      drawWheelSuggestions();
      const countEl = document.getElementById('wsCount');
      if(countEl) countEl.textContent = wheelSuggestions.filter(x=>x.status==='pending').length;
    };
  });
}
