<script>
/* filet de sécurité : si le site ne démarre pas (bibliothèque Supabase bloquée, erreur de code…), on affiche la raison au lieu d'une page vide */
(function(){
  var box = null;
  function started(){ try{ return typeof mode !== 'undefined' && mode !== 'select'; }catch(e){ return false; } }
  function show(msg){
    if(box || started()) return;
    box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#2a1210;color:#fff;border:1px solid #c8402a;border-radius:12px;padding:14px 16px;font:14px/1.5 system-ui,sans-serif;';
    box.textContent = "Le site n'a pas pu démarrer : " + msg + ". Recharge la page (Ctrl+F5). Si ça continue, envoie ce message.";
    (document.body || document.documentElement).appendChild(box);
    var t = setInterval(function(){ if(started()){ box.remove(); clearInterval(t); } }, 1000);   // fausse alerte : le site a fini par démarrer
  }
  window.addEventListener('error', function(e){ show(e.message || 'erreur inconnue'); });
  window.addEventListener('unhandledrejection', function(e){ show(String((e.reason && e.reason.message) || e.reason || 'erreur inconnue')); });
})();
</script>

<style>:root{--bg:#0e0e0e;--panel:#161616;--panel-2:#1c1c1c;--panel-3:#262626;--ink:#1b1206;--gold:#c8402a;--gold-dim:#7a2718;--mustard:#d9a52c;--red:#e0455f;--twitch:#9146ff;--rate-red:#e5484d;--rate-orange:#f5a524;--rate-blue:#3b82f6;--rate-green:#3fae5c;--text:#f4f4f4;--text-dim:#9a9a9a;--border:rgba(255,255,255,0.12);--shadow-sm:0 2px 10px rgba(0,0,0,0.3);--shadow-md:0 14px 32px -10px rgba(0,0,0,0.65);--shadow-lg:0 30px 70px -20px rgba(0,0,0,0.75);--r-xs:8px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:26px;--r-pill:999px}
*{box-sizing:border-box}
body,html{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
::selection{background:rgba(200,64,42,.4)}
.wrap{max-width:1800px;margin:0 auto;padding:0 clamp(20px,4vw,64px) 90px}
.wrap.narrow{max-width:440px;padding-top:60px}
@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}
.page{animation:fadeIn .3s ease}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;z-index:30;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 0;overflow-y:auto}
.sidebarLogo{cursor:pointer;user-select:none;padding:0 22px 22px;margin-bottom:6px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;line-height:1.15;letter-spacing:.5px;color:var(--gold);border-bottom:1px solid var(--border)}
.sidebarNav{display:flex;flex-direction:column;gap:2px;flex:1}
.sidebarLink{display:flex;align-items:center;gap:14px;width:calc(100% - 20px);margin:0 10px;padding:11px 16px;border:none;background:0 0;border-radius:var(--r-sm);color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-align:left;transition:.15s}
.sidebarLink:hover{background:var(--panel-2);color:var(--text)}
.sidebarLink.active{background:var(--panel-3);color:var(--gold)}
.sidebarLogin{background:var(--gold);color:#fff;font-weight:700;justify-content:center}
.sidebarLogin:hover{background:var(--gold);color:#fff;filter:brightness(1.12)}
.appVer{padding:6px 14px 12px;font-family:'JetBrains Mono',monospace;font-size:9px;line-height:1.35;color:var(--text-dim);opacity:.55}
@media (max-width:768px){
.appVer{display:none}
}
.sidebarBottom{display:flex;flex-direction:column;gap:2px;padding-top:14px;margin-top:10px;border-top:1px solid var(--border)}
.logo h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(30px,7vw,44px);letter-spacing:1.5px;margin:0;color:var(--gold)}
.logo .tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2.5px;color:var(--text-dim);text-transform:uppercase;margin-top:4px}
.logo.center{text-align:center}
.hero{text-align:center;padding:38px 0 34px}
.addbtn{background:var(--panel-3);color:var(--text);border:none;border-radius:var(--r-pill);padding:11px 20px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s;box-shadow:none}
.addbtn:hover{filter:brightness(1.25)}
#openAdd{background:var(--gold);color:#fff}
.addbtn:active{filter:brightness(.9)}
.pill{background:0 0;border:none;border-radius:0;padding:9px 10px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;color:var(--text-dim);cursor:pointer;white-space:nowrap;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.pill:hover{color:var(--text)}
.pill.active{color:var(--gold)}
.controls{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:#111;border:1px solid var(--border);border-radius:var(--r-pill);padding:12px 16px;transition:border-color .15s}
.search:focus-within{border-color:var(--gold-dim)}
.search input{flex:1;background:0 0;border:none;outline:0;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;background:0 0;border:none;padding:0}
.tab{padding:8px 16px;border-radius:var(--r-pill);border:none;background:var(--panel-2);color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;transition:.15s;position:relative}
.tab.active{background:var(--text);color:var(--bg)}
.tab:hover:not(.active){background:var(--panel-3);color:var(--text)}
.selectBox{background:#111;border:1px solid var(--border);border-radius:var(--r-pill);padding:11px 14px;color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;outline:0;transition:border-color .15s}
.selectBox:focus,.selectBox:hover{border-color:var(--gold-dim);color:var(--text)}
.selectBox option{background:#1a1a1a;color:var(--text)}
.sectionLabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-dim);margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sectionLabel::after{content:'';flex:1;height:1px;background:var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:22px}
.card{cursor:pointer;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.28);box-shadow:var(--shadow-md)}
.card .poster{width:100%;aspect-ratio:2/3;background:#111 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:30px;position:relative;border-radius:0;overflow:hidden}
.card .poster::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35));pointer-events:none}
.card .badge{position:absolute;top:8px;left:8px;z-index:1;background:rgba(11,10,18,.85);border:1px solid var(--border);color:var(--gold);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;padding:3px 7px;border-radius:var(--r-pill);text-transform:uppercase}
button.badge{cursor:default}
.card .badge.rediff{left:auto;right:8px;color:var(--red);border-color:rgba(200,30,58,.4);cursor:pointer;transition:.15s}
.card .badge.rediff:hover{background:rgba(200,30,58,.25);transform:scale(1.05)}
.favBtn{position:absolute;bottom:8px;right:8px;z-index:1;color:#fff;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);border:none;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:.15s}
.favBtn:hover{transform:scale(1.1);border-color:var(--gold-dim)}
.favBtn.active{color:#ff6b8b;border-color:rgba(255,107,139,.5);background:rgba(255,107,139,.15)}
.card .info{padding:11px 13px 13px}
.card .title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13.5px;line-height:1.3;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .year{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);margin-bottom:8px}
.ratingsRow{display:flex;gap:5px;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;gap:3px;background:#111;border:1px solid var(--border);border-radius:var(--r-pill);padding:3px 6px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700}
.rchip.avg{font-size:13px;padding:4px 12px}
.empty{text-align:center;padding:64px 22px;color:var(--text-dim);border:1px solid var(--border);border-radius:var(--r-lg);background:var(--panel)}
.empty .btn2{margin-top:18px;background:var(--gold);color:#fff;border:none;border-radius:var(--r-pill);padding:11px 22px;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.empty .btn2:hover{filter:brightness(1.3)}
@keyframes modalIn{
from{opacity:0;transform:translateY(14px) scale(.98)}
to{opacity:1;transform:translateY(0) scale(1)}
}
.overlay{position:fixed;inset:0;background:rgba(5,4,9,.78);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-xl);padding:28px;max-width:460px;width:100%;box-shadow:var(--shadow-lg);animation:modalIn .2s cubic-bezier(.2,.8,.2,1)}
.modal h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:23px;color:var(--gold);margin:0 0 20px;letter-spacing:.5px}
label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:7px}
input[type=datetime-local],input[type=email],input[type=password],input[type=text],textarea{width:100%;background:#111;border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:14px;margin-bottom:15px;outline:0;transition:border-color .15s}
input[type=datetime-local]:focus,input[type=email]:focus,input[type=password]:focus,input[type=text]:focus,textarea:focus{border-color:var(--gold)}
.search input[type=text]{width:auto;flex:1;background:0 0;border:none;border-radius:0;padding:0;margin:0}
.search input[type=text]:focus{border:none}
textarea{resize:vertical;min-height:60px}
.typetoggle{display:flex;gap:8px;margin-bottom:15px}
.typebtn{flex:1;padding:10px 12px;border-radius:var(--r-pill);border:none;background:var(--panel-3);color:var(--text-dim);font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:.15s}
.typebtn.active{background:var(--text);color:var(--bg)}
.posterrow{display:flex;gap:14px;margin-bottom:15px;align-items:flex-start}
.posterpreview{width:80px;height:120px;border-radius:var(--r-sm);background:#111 center/cover no-repeat;border:1px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:22px}
.posterfields{flex:1}
.filebtn{display:inline-block;background:0 0;border:none;padding:9px 0;font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--gold);cursor:pointer;margin-bottom:8px;transition:.15s}
.filebtn:hover{filter:brightness(1.3)}
input[type=file]{display:none}
.row2{display:flex;gap:10px}
.row2 input{flex:1}
.modalbtns{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:12px 4px;border-radius:0;border:none;background:0 0;font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.btn.primary{background:var(--gold);color:#fff;border-radius:var(--r-pill);padding:12px 22px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:0 0;border:none;color:var(--text-dim)}
.btn.ghost:hover{color:var(--text)}
.btn.danger{background:0 0;border:none;color:var(--red)}
.btn.danger:hover{filter:brightness(1.2)}
.btn.twitch{background:var(--twitch);color:#fff;border-radius:var(--r-pill);padding:13px 22px}
.btn.twitch:hover{filter:brightness(1.12)}
.detailhead{display:flex;gap:18px;margin-bottom:18px}
.detailposter{width:120px;height:180px;border-radius:var(--r-sm);background:#111 center/cover no-repeat;border:1px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--text-dim);box-shadow:var(--shadow-sm)}
.detailinfo h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:var(--text);margin:0 0 6px}
.detailinfo .metaline{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-bottom:12px}
.ratebox{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ratebox input{width:80px;background:#111;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;color:var(--gold);font-family:'Space Grotesk',sans-serif;font-size:20px;text-align:center;outline:0;margin-bottom:0}
.ratebox input:focus{border-color:var(--gold)}
.ratebox .outof{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim)}

.tcg.r-ultime{--rc:#ff5ccd;border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,conic-gradient(from var(--ang),#ff3d81,#ffb02e,#4cf2a0,#35c0ff,#a259ff,#ff3d81) border-box;box-shadow:0 0 24px rgba(255,92,205,.45);animation:ultSpin 6s linear infinite}

to{--ang:360deg}
}
.tcg .art{position:relative;flex:1;min-height:0;border-radius:calc(var(--r-md) - 6px);background:#111 center 25%/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:700;color:var(--text-dim)}

.tcg .mono{display:flex;align-items:center;justify-content:center;width:54%;aspect-ratio:1;border-radius:50%;background:hsl(var(--h) 65% 54%);color:#0e0e0e;font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700}

.tcg .rr{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;text-align:center;color:var(--rc);padding-bottom:3px;white-space:nowrap;position:relative;z-index:1}
.tcg .rr::before{content:var(--st,'');letter-spacing:1px;margin-right:6px;font-size:8px;vertical-align:1px;opacity:.95}
.tcg.r-commune{--st:'★'}
.tcg.r-rare{--st:'★★'}
.tcg.r-epique{--st:'★★★'}

.tcg .cnt{position:absolute;top:9px;right:9px;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.22);border-radius:var(--r-pill);padding:1px 8px;font-size:11px;font-weight:700;z-index:3}

.tcg.locked{opacity:.58;box-shadow:none;filter:saturate(.7)}

d:"Peter Parker, lycéen de Queens aux pouvoirs d'araignée. Le héros sympa du quartier qui rêve de grandes choses."},{n:"Black Panther",h:270,
d:"T'Challa, roi du Wakanda et protecteur de son peuple. Costume en vibranium et honneur à toute épreuve."},{n:"Doctor Strange",h:12,
d:"Ancien chirurgien de génie devenu Sorcier Suprême. Il veille sur la Terre face aux menaces mystiques."},{n:"Loki",h:140,
d:"Dieu de la malice, frère adoptif de Thor. Charmeur, rusé, jamais là où on l'attend."},{n:"Star-Lord",h:18,
d:"Peter Quill, pilleur de l'espace et chef des Gardiens de la Galaxie. Walkman, bagout et grands rêves."},{n:"Captain Marvel",h:42,
d:"Carol Danvers, pilote devenue héroïne cosmique. L'une des plus puissantes protectrices de la galaxie."},{n:"Hela",h:160,d:"Déesse de la Mort au pouvoir effrayant. Son retour menace tout Asgard."},{
n:"Red Skull",h:0,d:"Chef de l'Hydra, ambitieux et cruel. Il cherche un pouvoir qui ne devrait appartenir à personne."},{n:"Wolverine",h:52,
d:"Logan, mutant aux griffes d'adamantium et au pouvoir de régénération. Bourru, loyal et pratiquement increvable."},{n:"Deadpool",h:0,
d:"Wade Wilson, mercenaire bavard qui s'adresse directement au public. Irrévérencieux, imprévisible et très difficile à arrêter."},{n:"Mister Fantastic",h:215,
d:"Reed Richards, scientifique de génie capable d'étirer son corps à volonté. Le cerveau et le chef des Quatre Fantastiques."},{n:"Shang-Chi",h:22,
d:"Maître des arts martiaux et fils du chef des Dix Anneaux. Il choisit de tracer sa propre voie."},{n:"Namor",h:175,
d:"Souverain du royaume sous-marin de Talokan. Fier, puissant, et prêt à tout pour protéger son peuple."},{n:"Green Goblin",h:118,
d:"Norman Osborn, industriel dont la folie a pris le dessus. Un adversaire imprévisible et dangereux pour Spider-Man."},{n:"Cyclops",h:5,
d:"Scott Summers, chef de terrain des X-Men. Ses yeux projettent un puissant rayon d'énergie qu'il contrôle grâce à son visor."},{n:"Jean Grey",h:15,
d:"Télépathe et télékinésiste d'une puissance immense. Cœur des X-Men, elle cache un pouvoir qu'elle peine encore à mesurer."},{n:"Storm",h:200,
d:"Ororo Munroe, capable de contrôler la météo. Foudre, vent et tempête répondent à ses ordres."},{n:"Rogue",h:110,
d:"Jeune mutante dont le moindre contact absorbe les pouvoirs et les souvenirs des autres. Elle cherche sa place et la trouve chez les X-Men."},{n:"Mystique",h:195,
d:"Mutante métamorphe capable de prendre l'apparence de n'importe qui. Fidèle bras droit de Magneto."},{n:"Sabretooth",h:30,
d:"Mutant féroce aux griffes acérées et à la force surhumaine. Redoutable bras armé de Magneto."},{n:"Doctor Doom",h:140,
d:"Victor von Doom, monarque de Latvérie, scientifique et sorcier de génie. Ennemi juré des Quatre Fantastiques."},{n:"Venom",h:270,
d:"Un symbiote venu de l'espace, fusionné à son hôte. Force colossale, griffes, dents, et un humour très noir."},{n:"Silver Surfer",h:205,
d:"Héraut de Galactus qui parcourt le cosmos sur sa planche d'argent. Un pouvoir cosmique immense, mêlé de mélancolie."},{n:"The Thing",h:28,
d:"Ben Grimm, transformé en géant de roche orange. Le cœur le plus tendre des Quatre Fantastiques, derrière une force colossale."},{n:"Punisher",h:0,
d:"Frank Castle, ancien soldat qui a juré de punir les criminels. Un justicier sans pitié, armé jusqu'aux dents."}],rare:[{n:"Hawkeye",h:265,
d:"Clint Barton, archer sans superpouvoir mais d'une précision redoutable."},{n:"Scarlet Witch",h:348,d:"Wanda Maximoff, aux pouvoirs télékinésiques et mentaux qui dépassent ce qu'elle imagine."},{
n:"Vision",h:48,d:"Intelligence artificielle née d'une Pierre d'Infinité. Calme, logique et étonnamment humain."},{n:"Winter Soldier",h:200,
d:"Bucky Barnes, ami d'enfance de Steve devenu soldat de l'ombre. Un bras de métal et un passé trouble."},{n:"Falcon",h:6,
d:"Sam Wilson, ancien militaire équipé d'ailes mécaniques. Loyal, drôle et toujours là pour ses amis."},{n:"Ant-Man",h:2,
d:"Scott Lang, cambrioleur repenti capable de rétrécir ou de grandir à volonté."},{n:"Wasp",h:50,d:"Hope van Dyne, héroïne miniature volante. Agile, déterminée, et experte en combat."},{n:"Gamora",
h:152,d:"Guerrière d'élite surnommée la femme la plus dangereuse de la galaxie. Elle trace sa propre route."},{n:"Rocket",h:26,
d:"Raton laveur génétiquement modifié, as de la mécanique et des armes lourdes. Caractère explosif."},{n:"Groot",h:102,
d:"Arbre extraterrestre au vocabulaire de trois mots. Solide, fidèle et étonnamment tendre."},{n:"Valkyrie",h:305,
d:"Guerrière d'Asgard au passé lourd. Redoutable à l'épée, fidèle avant tout à sa liberté."},{n:"Yondu",h:232,d:"Capitaine des Ravageurs, archer à la flèche sifflante. Voleur, mais pas sans honneur."
},{n:"Erik Killmonger",h:285,d:"Adversaire ambitieux et déterminé venu bouleverser l'ordre du Wakanda."},{n:"The Ancient One",h:55,
d:"Maîtresse des arts mystiques et mentor de Doctor Strange. Sage, mystérieuse et redoutable."},{n:"Vulture",h:118,
d:"Marchand d'armes en exosquelette ailé. Un adversaire de quartier pour le jeune Spider-Man."},{n:"War Machine",h:215,
d:"James Rhodes, officier de l'armée et meilleur ami de Tony. Une armure lourdement armée et un sens du devoir inébranlable."},{n:"Moon Knight",h:222,
d:"Marc Spector, mercenaire lié au dieu lune Khonshu. Il lutte aussi contre ses propres personnalités."},{n:"Ms. Marvel",h:330,
d:"Kamala Khan, adolescente fan des Avengers aux pouvoirs lumineux. Enthousiaste et pleine de cœur."},{n:"She-Hulk",h:135,
d:"Jennifer Walters, avocate devenue géante verte tout en gardant le contrôle. Brillante et pleine d'humour."},{n:"Daredevil",h:2,
d:"Matt Murdock, avocat aveugle aux sens surdéveloppés. Le gardien nocturne de Hell's Kitchen."},{n:"Yelena Belova",h:345,
d:"Espionne formée en Russie, sœur de cœur de Natasha. Sarcastique et redoutable au combat."},{n:"Kate Bishop",h:280,
d:"Jeune archère brillante et sûre d'elle. Elle prend la relève de Hawkeye avec panache."},{n:"Agatha Harkness",h:290,
d:"Sorcière puissante et rusée, voisine de Wanda en apparence. Elle collectionne les pouvoirs des autres."},{n:"Mysterio",h:152,
d:"Quentin Beck, spécialiste des illusions technologiques. Il joue les héros pour mieux tromper son monde."},{n:"M'Baku",h:100,
d:"Chef de la tribu Jabari, imposant et pince-sans-rire. Un allié inattendu du Wakanda."},{n:"Iceman",h:190,
d:"Bobby Drake, élève de l'école de Xavier. Il peut se couvrir de glace et geler tout ce qu'il touche."},{n:"Toad",h:100,
d:"Mutant agile aux bonds prodigieux et à la langue interminable. Fidèle de Magneto, toujours prêt à sauter dans la bataille."},{n:"Kitty Pryde",h:300,
d:"Jeune élève de l'école de Xavier capable de traverser les murs. Curieuse et courageuse, elle a l'étoffe d'une X-Men."},{n:"Baron Zemo",h:255,
d:"Helmut Zemo, ancien officier hanté par la perte de sa famille. Il manipule les Avengers pour les diviser."},{n:"Ronan the Accuser",h:230,
d:"Fanatique kree armé d'un marteau cosmique. Il veut détruire Xandar avec la Pierre d'Infinité qu'il convoite."},{n:"Quicksilver",h:215,
d:"Pietro Maximoff, d'une vitesse vertigineuse. Frère jumeau de Wanda, il se bat toujours à ses côtés."},{n:"Ego",h:165,
d:"Un Céleste à forme de planète vivante, père de Star-Lord. Il rêve de remodeler l'univers à son image."},{n:"Ebony Maw",h:275,
d:"Membre de l'Ordre Noir au service de Thanos. Poli, glacial, et capable de déplacer la matière par la pensée."},{n:"Malekith",h:250,
d:"Chef des Elfes Noirs, avide de replonger l'univers dans les ténèbres grâce à l'Éther."},{n:"Iron Monger",h:25,
d:"Obadiah Stane, associé de Tony Stark. Il construit une armure géante pour prendre sa place."},{n:"Abomination",h:120,
d:"Emil Blonsky, soldat transformé en créature monstrueuse. Un adversaire à la mesure de Hulk."},{n:"Whiplash",h:45,
d:"Ivan Vanko, ingénieur de génie armé de fouets électriques. Il veut faire payer la famille Stark."},{n:"The Collector",h:40,
d:"Taneleer Tivan, collectionneur d'espèces et d'objets rares venus de tout l'univers. Une passion qui peut coûter très cher."},{n:"Ghost",h:188,
d:"Ava Starr, capable de traverser la matière depuis un accident quantique. Elle cherche désespérément un remède."},{n:"Baron Mordo",h:295,
d:"Karl Mordo, élève de l'Ancien devenu gardien sévère de l'ordre naturel. Il juge sans appel les sorciers qui bafouent les règles."},{n:"Invisible Woman",h:212,
d:"Sue Storm, capable de se rendre invisible et de créer des champs de force. Le cœur des Quatre Fantastiques."},{n:"Human Torch",h:20,
d:"Johnny Storm, tête brûlée qui s'enflamme et vole dans les airs. Toujours prêt à faire le show."}],commune:[{n:"Nick Fury",h:222,
d:"Directeur du S.H.I.E.L.D. et créateur de l'initiative Avengers. Toujours un plan d'avance."},{n:"Pepper Potts",h:356,
d:"Directrice de Stark Industries et pilier de la vie de Tony. Elle ne se laisse jamais impressionner."},{n:"Happy Hogan",h:36,
d:"Chauffeur puis responsable de la sécurité de Tony Stark. Fidèle, bougon et dévoué."},{n:"Peggy Carter",h:345,
d:"Agente britannique de la Réserve scientifique stratégique, cofondatrice du S.H.I.E.L.D."},{n:"Maria Hill",h:212,d:"Bras droit de Nick Fury au S.H.I.E.L.D. Calme et efficace sous la pression."},{
n:"Drax",h:188,d:"Guerrier qui prend tout au pied de la lettre. Redoutable au combat, nul pour les métaphores."},{n:"Nebula",h:208,
d:"Mercenaire cyborg à la peau bleue, élevée comme une arme. En quête de sa propre place."},{n:"Wong",h:176,
d:"Gardien de la bibliothèque de Kamar-Taj et maître des arts mystiques. Sérieux, mais pas sans humour."},{n:"Okoye",h:4,
d:"Générale des Dora Milaje, la garde royale du Wakanda. Lance en main, loyauté inébranlable."},{n:"Shuri",h:168,
d:"Princesse du Wakanda et prodige technologique. L'esprit brillant derrière les innovations du royaume."},{n:"Phil Coulson",h:235,
d:"Agent du S.H.I.E.L.D., sérieux et dévoué. Le plus grand fan des Avengers."},{n:"Heimdall",h:46,d:"Gardien du Bifröst, il voit tout dans les neuf royaumes. Calme et vigilant."},{n:"Odin",h:210,
d:"Roi d'Asgard et père de Thor. Sage, puissant et parfois sévère."},{n:"Jane Foster",h:330,d:"Astrophysicienne brillante, curieuse de tout. Sa rencontre avec Thor bouleverse son quotidien."},{
n:"Korg",h:95,d:"Gladiateur de pierre à l'accent tranquille. Toujours calme, même en pleine bataille."},{n:"Mantis",h:130,
d:"Empathe aux antennes, douce et timide. Elle ressent les émotions des autres."},{n:"Hank Pym",h:245,d:"Scientifique à l'origine de la technologie Pym. Brillant, têtu et protecteur."},{n:"Ned Leeds",
h:70,d:"Meilleur ami de Peter Parker et fan de Lego. Enthousiaste et loyal."},{n:"May Parker",h:20,d:"Tante de Peter Parker, douce et courageuse. Elle veille sur son neveu comme sur son propre fils."
},{n:"MJ",h:340,d:"Michelle Jones, camarade de classe de Peter. Sarcastique, très observatrice, jamais dupe."},{n:"Ramonda",h:262,
d:"Reine du Wakanda et mère de T'Challa et de Shuri. Une sagesse et une force tranquilles."},{n:"Nakia",h:140,d:"Espionne wakandaise au grand cœur, convaincue que son pays doit s'ouvrir au monde."},{
n:"Everett Ross",h:215,d:"Agent de la CIA devenu allié du Wakanda. Pragmatique, un brin sarcastique, étonnamment loyal."},{n:"Sharon Carter",h:358,
d:"Agente du S.H.I.E.L.D. et nièce de Peggy. Discrète, débrouillarde et efficace."},{n:"Betty Ross",h:350,
d:"Scientifique brillante et amie de longue date de Bruce Banner. Elle croit en lui, même dans ses pires moments."},{n:"Thaddeus Ross",h:90,
d:"Général ambitieux, obsédé par le contrôle des surhumains. Il traque Hulk depuis des années."},{n:"Lady Sif",h:192,
d:"Guerrière d'Asgard fidèle à Thor. Redoutable à l'épée, d'une loyauté sans faille."},{n:"Frigga",h:45,d:"Reine d'Asgard et mère de Thor. Sage, bienveillante et plus puissante qu'elle n'en a l'air."
},{n:"The Grandmaster",h:280,d:"Maître de Sakaar qui organise de grands combats de gladiateurs. Excentrique et imprévisible."},{n:"Darcy Lewis",h:320,
d:"Assistante scientifique pleine d'humour qui n'a jamais froid aux yeux. Toujours là au bon moment."},{n:"Jubilee",h:55,
d:"Jeune mutante qui lance des étincelles lumineuses. Une ado pleine d'énergie à l'école de Xavier."},{n:"Senator Kelly",h:150,
d:"Sénateur opposé aux mutants, à l'origine d'un projet de loi pour les recenser. Il découvrira de près ce qu'est un mutant."},{n:"Arnim Zola",h:125,
d:"Scientifique de l'Hydra qui s'infiltre au SHIELD. Son esprit survit même dans une machine."},{n:"Crossbones",h:5,
d:"Brock Rumlow, agent du SHIELD passé à l'Hydra. Un mercenaire violent qui s'attaque à Captain America."},{n:"Alexander Pierce",h:215,
d:"Haut responsable du SHIELD, en réalité chef caché de l'Hydra. Un homme de pouvoir qui n'hésite pas à trahir."},{n:"Batroc",h:350,
d:"Georges Batroc, mercenaire français expert en savate. Rapide et fier, il aime les duels loyaux."},{n:"Howard Stark",h:28,
d:"Génial inventeur, fondateur de Stark Industries et père de Tony. Il a contribué à la naissance de Captain America."},{n:"Abraham Erskine",h:95,
d:"Le docteur derrière le sérum du super-soldat. Il choisit Steve Rogers pour la bonté de son cœur."},{n:"Justin Hammer",h:42,
d:"Industriel rival de Stark, jaloux et prétentieux. Il rêve de vendre ses armures à l'armée."},{n:"Kraglin",h:22,d:"Ravageur et bras droit de Yondu. Il apprend à manier la flèche Yaka avec talent."
},{n:"Ulysses Klaue",h:330,d:"Trafiquant d'armes qui convoite le vibranium. Un criminel à l'ego énorme qui n'a peur de rien."},{n:"Ayo",h:352,
d:"Guerrière des Dora Milaje, loyale et redoutable. Elle protège le Wakanda avec honneur."},{n:"W'Kabi",h:130,
d:"Chef de la sécurité des frontières du Wakanda et ami de T'Challa. Sa colère le met face à son roi."},{n:"Monica Rambeau",h:195,
d:"Fille de Maria Rambeau, devenue agente du SWORD. Elle découvre à Westview des capacités inattendues."},{n:"Jimmy Woo",h:258,
d:"Agent du FBI tenace et amateur de tours de magie. Il mène l'enquête avec humour."},{n:"Janet van Dyne",h:50,
d:"La première Guêpe, restée piégée dans le Royaume Quantique. Sa famille n'a jamais cessé de la chercher."},{n:"Christine Palmer",h:335,
d:"Chirurgienne brillante et proche de Stephen Strange. Elle l'a vu tomber, puis se relever."},{n:"Fandral",h:150,
d:"L'un des Trois Guerriers d'Asgard, bretteur élégant et séducteur. Fidèle compagnon de Thor."},{n:"Skurge",h:58,d:"Bourreau d'Asgard au service de Hela. Il retrouve son honneur au moment décisif."}]
},HAIKYUU_TEMPLATE={key:"haikyuu",hue:28,name:"Haikyu!!",legendaire:[{n:"Shoyo Hinata",h:28,d:"Petit par la taille, immense par l'envie. Le central de Karasuno qui saute plus haut que tout le monde."
},{n:"Tobio Kageyama",h:222,d:"Passeur prodige de Karasuno, surnommé le Roi du terrain. Une précision hors norme et un caractère intense."},{n:"Tooru Oikawa",h:188,
d:"Capitaine et passeur d'Aoba Johsai. Service redoutable, charme redoutable, rivalité féroce."},{n:"Wakatoshi Ushijima",h:275,
d:"As de Shiratorizawa et l'un des meilleurs attaquants du pays. Puissance et calme impressionnants."}],epique:[{n:"Kei Tsukishima",h:52,
d:"Central de Karasuno, grand, ironique et très malin. Il lit le jeu comme personne."},{n:"Yu Nishinoya",h:38,
d:"Libéro de Karasuno, énergie débordante et réflexes hors du commun. Rien ne touche le sol sur son terrain."},{n:"Daichi Sawamura",h:18,
d:"Capitaine de Karasuno, calme et solide. Celui qui tient toute l'équipe ensemble."},{n:"Asahi Azumane",h:8,
d:"As de Karasuno, imposant mais sensible. Sa frappe puissante fait trembler les murs adverses."},{n:"Tetsuro Kuroo",h:355,
d:"Capitaine de Nekoma, central rusé au sourire en coin. Maître du bloc stratégique."},{n:"Kenma Kozume",h:48,d:"Passeur de Nekoma, cerveau tranquille. Il analyse tout, sans jamais s'agiter."},{
n:"Kotaro Bokuto",h:42,d:"As de Fukurodani, solaire et imprévisible. Quand son moral est au sommet, il est injouable."},{n:"Hajime Iwaizumi",h:172,
d:"Attaquant d'Aoba Johsai et ami d'enfance d'Oikawa. Franc, solide et pas du genre à se laisser faire."},{n:"Kourai Hoshiumi",h:33,
d:"Ailier de Kamomedai, plus petit que la moyenne mais bourré d'ambition. Il attaque avec une énergie débordante."},{n:"Kentaro Kyoutani",h:20,
d:"Ailier d'Aoba Johsai au tempérament de chien de garde. Puissant, intense et en progrès constant."},{n:"Yuji Terushima",h:130,

d:"Central de Fukurodani, discret et rigoureux. Un bloc solide qui parle peu mais fait le travail."},{n:"Kaname Moniwa",h:110,
d:"Capitaine et passeur de Date Tech. Posé et attentif, il guide une équipe réputée pour son mur."},{n:"Tenma Udai",h:28,
d:"Ancien as de Karasuno surnommé le « Petit Géant ». Son image a donné à Hinata l'envie de jouer."},{n:"Suguru Daishou",h:135,
d:"Capitaine de Nohebi, rusé comme un serpent. Il aime semer le doute chez l'adversaire."}],rare:[{n:"Koshi Sugawara",h:190,
d:"Passeur de Karasuno au doux sourire et au grand cœur. Le soutien moral de l'équipe."},{n:"Ryunosuke Tanaka",h:14,
d:"Ailier de Karasuno, tête brûlée au grand cœur. Il s'enflamme vite, mais jamais sans raison."},{n:"Tadashi Yamaguchi",h:150,
d:"Serveur de Karasuno et ami de Tsukishima. Son service flottant est redoutable."},{n:"Keiji Akaashi",h:230,d:"Passeur de Fukurodani, discret et précis. Il sait exactement comment motiver son as."},{
n:"Satori Tendo",h:290,d:"Central de Shiratorizawa, surnommé le Guess Monster. Il devine presque chaque attaque."},{n:"Atsumu Miya",h:305,
d:"Passeur d'Inarizaki, talentueux et exigeant. Il vise toujours la passe parfaite."},{n:"Osamu Miya",h:320,d:"Ailier d'Inarizaki et jumeau d'Atsumu. Plus posé, mais tout aussi têtu."},{
n:"Kiyoomi Sakusa",h:155,d:"As d'Itachiyama, grand, puissant et très exigeant envers lui-même."},{n:"Lev Haiba",h:340,
d:"Central de Nekoma, très grand et plein d'énergie. Il apprend vite, et ça se voit."},{n:"Shinsuke Kita",h:205,d:"Capitaine d'Inarizaki, la discipline incarnée. Chaque geste est travaillé avec soin."
},{n:"Tsutomu Goshiki",h:280,d:"Jeune ailier de Shiratorizawa, plein de fougue. Il apprend à son rythme pour devenir un as."},{n:"Shigeru Yahaba",h:168,
d:"Passeur d'Aoba Johsai, déterminé à se faire un nom sur le terrain."},{n:"Rintaro Suna",h:250,d:"Central d'Inarizaki, décontracté et malin. Son bloc surprend souvent l'adversaire."},{
n:"Motoya Komori",h:140,d:"Libéro d'Itachiyama et cousin de Sakusa. Calme, solide et de bonne humeur."},{n:"Takanobu Aone",h:215,
d:"Central de Date Tech, grand mur silencieux. Son bloc est l'un des plus redoutés."},{n:"Chikara Ennoshita",h:25,d:"Ailier de Karasuno, calme et fiable. Un équipier sur qui on peut toujours compter."
},{n:"Kanji Koganegawa",h:300,d:"Jeune passeur de Date Tech, grand, enthousiaste et très énergique."},{n:"Shinji Watari",h:75,
d:"Libéro d'Aoba Johsai, fiable en défense. Il assure la réception derrière les vedettes de l'équipe."},{n:"Shohei Fukunaga",h:345,
d:"Ailier de Nekoma, silencieux et imperturbable. Ses attaques surprennent par leur calme."},{n:"Sou Inuoka",h:85,d:"Ailier de Nekoma, plein d'énergie. Il adore les défis et progresse à vue d'œil."},{
n:"Reon Ohira",h:105,d:"Joueur de Shiratorizawa, solide et sérieux. Il tient sa place sans jamais fléchir."},{n:"Michinari Akagi",h:65,
d:"Joueur d'Inarizaki, déterminé et sérieux. Un pilier de l'équipe."},{n:"Ren Omimi",h:238,d:"Membre d'Inarizaki, concentré et régulier. Il apporte du calme au groupe."},{n:"Sachiro Hirugami",h:200,
d:"Central de Kamomedai, issu d'une famille de volleyeurs. Calme et régulier, il équilibre l'ardeur de Hoshiumi."},{n:"Tsukasa Iizuna",h:8,
d:"Capitaine et passeur d'Itachiyama, l'une des meilleures équipes du pays. Il met ses attaquants dans les meilleures conditions."},{n:"Shugo Meian",h:40,
d:"Capitaine des MSBY Black Jackals en V.League. Il garde la tête froide au milieu de joueurs hauts en couleur."},{n:"Shion Inunaki",h:160,
d:"Libéro des MSBY Black Jackals. Défense solide et goût prononcé pour taquiner ses coéquipiers."},{n:"Akiteru Tsukishima",h:52,
d:"Grand frère de Kei Tsukishima et ancien joueur de Karasuno. Il continue le volley à l'université."},{n:"Yasushi Kamasaki",h:90,
d:"Central de Date Tech et membre du Mur de fer. Il se chamaille souvent avec Futakuchi."},{n:"Tamahiko Teshiro",h:350,
d:"Passeur de première année de Nekoma. Il est aussi spécialiste du service en relève."},{n:"Yuto Kosaku",h:270,
d:"Attaquant de deuxième année d'Inarizaki, au cœur d'une équipe redoutée dans tout le pays."},{n:"Heisuke Riseki",h:305,
d:"Attaquant de première année d'Inarizaki. Le plus jeune du groupe, il apprend aux côtés des meilleurs."},{n:"Kazuma Numai",h:148,
