/* ---------- GRID (shared by creator/viewer) ---------- */
function getGenres(){
  const set = new Set();
  items.forEach(it => { if(it.genre && it.genre.trim()) set.add(it.genre.trim()); });
  return Array.from(set).sort((a,b) => a.localeCompare(b));
}

function getSagas(){
  const set = new Set();
  items.forEach(it => { if(it.saga && it.saga.trim()) set.add(it.saga.trim()); });
  return Array.from(set).sort((a,b) => a.localeCompare(b));
}

function getSagaGroups(){
  const map = {};
  items.forEach(it => {
    if(it.saga && it.saga.trim()){
      const key = it.saga.trim();
      if(!map[key]) map[key] = [];
      map[key].push(it);
    }
  });
  return Object.keys(map).sort((a,b) => a.localeCompare(b)).map(name => ({
    name,
    items: map[name].sort((a,b) => (parseInt(a.year,10)||0) - (parseInt(b.year,10)||0))
  }));
}

function filterControlsHtml(){
  const genres = getGenres();
  const sagas = getSagas();
  return `
    <select class="selectBox" id="genreFilter">
      <option value="all">Tous les genres</option>
      ${genres.map(g => `<option value="${escapeHtml(g)}" ${genreFilter===g?'selected':''}>${escapeHtml(g)}</option>`).join('')}
    </select>
    ${sagas.length ? `
    <select class="selectBox" id="sagaFilter">
      <option value="all">Toutes les sagas</option>
      ${sagas.map(s => `<option value="${escapeHtml(s)}" ${sagaFilter===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}
    </select>
    ` : ''}
    <select class="selectBox" id="sortFilter">
      <option value="recent" ${sortBy==='recent'?'selected':''}>Récemment ajoutés</option>
      <option value="alpha" ${sortBy==='alpha'?'selected':''}>Alphabétique (A→Z)</option>
      <option value="rating_desc" ${sortBy==='rating_desc'?'selected':''}>Note décroissante</option>
      <option value="rating_asc" ${sortBy==='rating_asc'?'selected':''}>Note croissante</option>
      <option value="year" ${sortBy==='year'?'selected':''}>Date (année)</option>
    </select>
  `;
}
function wireFilterControls(ctx){
  const g = document.getElementById('genreFilter');
  const s = document.getElementById('sortFilter');
  const sg = document.getElementById('sagaFilter');
  g.value = genreFilter;
  s.value = sortBy;
  g.addEventListener('change', (e) => { genreFilter = e.target.value; renderGrid(ctx); });
  s.addEventListener('change', (e) => { sortBy = e.target.value; renderGrid(ctx); });
  if(sg){
    sg.value = sagaFilter;
    sg.addEventListener('change', (e) => { sagaFilter = e.target.value; renderGrid(ctx); });
  }
}

function overallRating(it){
  return creatorRatingStat(it).avg;
}

function isFavorite(it, ctx){
  if(ctx === 'creator') return !!it.favorite;
  const key = (viewerName||'').toLowerCase();
  const p = viewerProfiles[key];
  return !!(p && p.favorites && p.favorites.includes(it.id));
}
async function toggleFavorite(it, ctx){
  if(ctx === 'creator'){
    await loadCatalog();
    const fresh = items.find(x => x.id === it.id);
    if(fresh) fresh.favorite = !fresh.favorite;
    await saveCatalog();
  } else {
    if(!viewerName){ setMode('select'); return; }
    const key = (viewerName||'').toLowerCase();
    if(!viewerProfiles[key]) viewerProfiles[key] = {display: viewerName, avatar:'', bio:'', favorites: []};
    if(!viewerProfiles[key].favorites) viewerProfiles[key].favorites = [];
    const favs = viewerProfiles[key].favorites;
    const idx = favs.indexOf(it.id);
    if(idx >= 0) favs.splice(idx, 1); else favs.push(it.id);
    await saveProfiles();
  }
}

function renderSagaCards(grid, ctx){
  const summaries = getSagaGroups().map(g => {
    const rated = g.items.filter(it => overallRating(it) > 0);
    const avg = rated.length ? rated.reduce((a,it) => a + overallRating(it), 0) / rated.length : 0;
    const cover = (g.items.find(it => it.poster) || {}).poster || '';
    return {name: g.name, items: g.items, avg, count: g.items.length, cover};
  });

  if(summaries.length === 0){
    grid.innerHTML = `
      <div class="empty">
        
        <div>${ctx === 'creator'
          ? "Aucune saga pour l'instant. Ouvre un titre → Modifier, et remplis le champ « Saga » (ex : Harry Potter, MCU, Spider-Man) pour le regrouper avec d'autres."
          : "Le créateur n'a pas encore organisé de sagas."}</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = `<div class="grid">${summaries.map(s => `
    <div class="card sagaCard" data-saga="${escapeHtml(s.name)}">
      <div class="poster" style="${s.cover ? `background-image:url('${s.cover}')` : ''}">
        ${s.cover ? '' : posterInitial(s.name)}
        <span class="badge">${s.count} titre${s.count>1?'s':''}</span>
      </div>
      <div class="info">
        <div class="title">${escapeHtml(s.name)}</div>
        <div class="ratingsRow">
          <span class="rchip avg" style="color:${ratingColor(s.avg)}" title="Note moyenne de la saga">${s.avg ? s.avg.toFixed(1).replace(/\.0$/,'') : '—'}</span>
        </div>
      </div>
    </div>
  `).join('')}</div>`;

  grid.querySelectorAll('.sagaCard').forEach(c => {
    c.onclick = () => { selectedSaga = c.dataset.saga; renderGrid(ctx); };
  });
}

function renderGrid(ctx){
  const grid = document.getElementById('grid');
  if(!grid) return;

  if(filter === 'sagas' && !selectedSaga){
    renderSagaCards(grid, ctx);
    return;
  }

  const backHtml = (filter === 'sagas' && selectedSaga) ? `
    <button class="back" id="backToSagas" style="margin-bottom:16px;">← Toutes les sagas</button>
    <div class="sectionLabel" style="margin-top:0;">${escapeHtml(selectedSaga)}</div>
  ` : '';

  let list;
  if(filter === 'sagas' && selectedSaga){
    list = items.filter(it => (it.saga||'').trim() === selectedSaga);
  } else {
    list = items.filter(it => filter==='all' || filter==='favorites' || it.type===filter);
    if(filter === 'favorites'){
      list = list.filter(it => isFavorite(it, ctx));
    }
  }
  if(genreFilter !== 'all'){
    list = list.filter(it => (it.genre||'').trim() === genreFilter);
  }
  if(sagaFilter !== 'all'){
    list = list.filter(it => (it.saga||'').trim() === sagaFilter);
  }
  if(query.trim()){
    const q = query.trim().toLowerCase();
    list = list.filter(it => (it.title||'').toLowerCase().includes(q) || (it.genre||'').toLowerCase().includes(q));
  }
  list = list.slice();
  if(sortBy === 'alpha'){
    list.sort((a,b) => (a.title||'').localeCompare(b.title||''));
  } else if(sortBy === 'rating_desc'){
    list.sort((a,b) => overallRating(b) - overallRating(a));
  } else if(sortBy === 'rating_asc'){
    list.sort((a,b) => overallRating(a) - overallRating(b));
  } else if(sortBy === 'year'){
    list.sort((a,b) => (parseInt(b.year,10)||0) - (parseInt(a.year,10)||0));
  } else {
    list.sort((a,b) => (b.addedAt||0) - (a.addedAt||0));
  }

  if(items.length === 0){
    grid.innerHTML = ctx === 'creator'
      ? `<div class="empty"><div>Ta collection est vide pour l'instant.</div><button class="btn2" id="emptyAdd">Ajouter ton premier titre</button></div>`
      : `<div class="empty"><div>Le créateur n'a pas encore ajouté de titres.</div></div>`;
    const btn = document.getElementById('emptyAdd');
    if(btn) btn.onclick = () => openModal();
    return;
  }
  if(list.length === 0){
    grid.innerHTML = backHtml + (filter === 'favorites'
      ? `<div class="empty"><div>Aucun favori pour l'instant.</div></div>`
      : `<div class="empty"><div>Aucun résultat pour cette recherche.</div></div>`);
    const bb = document.getElementById('backToSagas');
    if(bb) bb.onclick = () => { selectedSaga = null; renderGrid(ctx); };
    return;
  }
  grid.innerHTML = backHtml + `<div class="grid">${list.map(it => {
    const episodic = isEpisodic(it.type);
    const pub = episodic ? seriesPublicStats(it) : publicStats(it.id);
    const fav = isFavorite(it, ctx);
    return `
    <div class="card" data-id="${it.id}">
      <div class="poster" style="${it.poster ? `background-image:url('${it.poster}')` : ''}">
        ${it.poster ? '' : posterInitial(it.title)}
        <span class="badge">${typeLabel(it.type)}</span>
        ${it.rediff ? `<a href="${escapeHtml(it.rediff)}" target="_blank" rel="noopener noreferrer" class="badge rediff" title="Voir la rediff">▶ Rediff</a>` : ''}
        <button class="favBtn ${fav ? 'active' : ''}" data-fav="${it.id}" title="Favori">${fav ? '♥' : '♡'}</button>
      </div>
      <div class="info">
        <div class="title">${escapeHtml(it.title)}</div>
        ${it.year ? `<div class="year">${escapeHtml(it.year)}</div>` : ''}
        <div class="ratingsRow">
          <span class="rchip avg" style="color:${ratingColor(pub.avg)}" title="Note moyenne${pub.count ? ' ('+pub.count+' note'+(pub.count>1?'s':'')+')' : ''}">${pub.count ? pub.avg.toFixed(1).replace(/\.0$/,'') : '—'}</span>
        </div>
      </div>
    </div>
  `}).join('')}</div>`;

  grid.querySelectorAll('.favBtn').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const it = items.find(x => x.id === b.dataset.fav);
      await toggleFavorite(it, ctx);
      renderGrid(ctx);
    };
  });

  grid.querySelectorAll('.badge.rediff').forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); };
  });

  grid.querySelectorAll('.card').forEach(c => {
    c.onclick = () => {
      if(ctx === 'creator'){
        openDetail(c.dataset.id);
      } else {
        openViewerRate(c.dataset.id);
      }
    };
  });

  const backBtn = document.getElementById('backToSagas');
  if(backBtn) backBtn.onclick = () => { selectedSaga = null; renderGrid(ctx); };
}

        <div class="row2">
          <div style="flex:1;"><label>Année</label><input type="text" id="fYear" value="${escapeHtml(it.year)}" placeholder="2019"></div>
          <div style="flex:1;"><label>Genre</label><input type="text" id="fGenre" value="${escapeHtml(it.genre)}" placeholder="Thriller"></div>
        </div>
        <label>Saga (optionnel)</label>
        <input type="text" id="fSaga" list="sagaList" value="${escapeHtml(it.saga||'')}" placeholder="ex : Harry Potter">
        <datalist id="sagaList">
          ${getSagas().map(s => `<option value="${escapeHtml(s)}"></option>`).join('')}

        <label>Affiche</label>
        <div class="posterrow">
          <div class="posterpreview" id="posterPreview" style="${it.poster ? `background-image:url('${it.poster}')`:''}">${it.poster ? '' : '+'}</div>
          <div class="posterfields">
            <label class="filebtn" for="fFile">Importer une image</label>
            <input type="file" id="fFile" accept="image/*">
            <label style="margin-top:4px;">ou coller une URL</label>
            <input type="text" id="fPosterUrl" value="${it.poster && it.poster.startsWith('http') ? escapeHtml(it.poster) : ''}" placeholder="https://...">
          </div>
        </div>
        <label>Synopsis (optionnel)</label>
        <textarea id="fSynopsis" placeholder="Une phrase pour se souvenir de quoi ça parle">${escapeHtml(it.synopsis)}</textarea>
        <label>Lien de la rediff (optionnel)</label>
        <input type="text" id="fRediff" value="${escapeHtml(it.rediff||'')}" placeholder="https://twitch.tv/videos/...">
        <div class="modalbtns">
          <button class="btn ghost" id="cancelBtn">Annuler</button>
          <button class="btn primary" id="saveBtn">${isEdit ? 'Enregistrer' : 'Ajouter'}</button>
        </div>
      </div>
    </div>
  `;
  let currentType = it.type;
  let posterData = it.poster || '';

  root.querySelectorAll('.typebtn').forEach(b => {
    b.onclick = () => {
      currentType = b.dataset.t;
      root.querySelectorAll('.typebtn').forEach(x => x.classList.toggle('active', x===b));
    };
  });

  document.getElementById('fFile').onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (ev) => {
      img.onload = () => {
        const maxW = 600;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx2 = canvas.getContext('2d');
        ctx2.imageSmoothingEnabled = true;
        ctx2.imageSmoothingQuality = 'high';
        ctx2.drawImage(img, 0, 0, canvas.width, canvas.height);
        posterData = canvas.toDataURL('image/jpeg', 0.85);
        document.getElementById('posterPreview').style.backgroundImage = `url('${posterData}')`;
        document.getElementById('posterPreview').textContent = '';
        document.getElementById('fPosterUrl').value = '';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('fPosterUrl').addEventListener('input', (e) => {
    const val = e.target.value.trim();
    if(val){
      posterData = val;
      document.getElementById('posterPreview').style.backgroundImage = `url('${val}')`;
      document.getElementById('posterPreview').textContent = '';
    }
  });

  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') closeModal(); };

  document.getElementById('saveBtn').onclick = async () => {
    const title = document.getElementById('fTitle').value.trim();
    if(!title) return;
    const year = document.getElementById('fYear').value.trim();
    const genre = document.getElementById('fGenre').value.trim();
    const saga = document.getElementById('fSaga').value.trim();
    const synopsis = document.getElementById('fSynopsis').value.trim();
    const rediff = document.getElementById('fRediff').value.trim();
    const urlVal = document.getElementById('fPosterUrl').value.trim();
    if(urlVal) posterData = urlVal;

    await loadCatalog();
    if(isEdit){
      const idx = items.findIndex(x => x.id === it.id);
      if(idx >= 0){
        items[idx] = {...items[idx], title, year, genre, saga, synopsis, rediff, poster: posterData, type: currentType};
      }
    } else {
      items.push({
        id: 'm-' + Math.random().toString(36).slice(2,10),
        title, year, genre, saga, synopsis, rediff, poster: posterData, type: currentType,
        rating: 0, seasons: [], addedAt: Date.now()
      });
    }
    await saveCatalog();
    closeModal();
    renderGrid('creator');
  };
}

function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

        ${it.rediff ? `<a href="${escapeHtml(it.rediff)}" target="_blank" rel="noopener noreferrer" class="rediffLink">▶ Voir la rediff</a>` : ''}
        ${(viewerRatings[id]||[]).some(r=>r.comment) ? `
          <div class="commentsTitle">Avis des viewers</div>
          ${(viewerRatings[id]||[]).filter(r=>r.comment).slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).map(r => `
            <div class="comment">
              <div class="who"><span>${escapeHtml(r.who)}</span><span style="color:${ratingColor(r.score)}">${r.score % 1 === 0 ? r.score : r.score.toFixed(1)}/10</span></div>
              <div class="txt">${escapeHtml(r.comment)}</div>
            </div>
          `).join('')}
        ` : ''}
        ${ratersListHtml(it)}
        <div class="modalbtns">
          <button class="btn danger" id="delBtn">Supprimer</button>
          <button class="btn ghost" id="editBtn">Modifier</button>
          <button class="btn primary" id="closeBtn">Fermer</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') closeModal(); };
  document.getElementById('closeBtn').onclick = closeModal;
  document.getElementById('editBtn').onclick = () => openModal(it);
  const epsBtn = document.getElementById('epsBtn');
  if(epsBtn) epsBtn.onclick = () => openEpisodesManager(it);
  document.getElementById('delBtn').onclick = async () => {
    await loadCatalog();
    items = items.filter(x => x.id !== id);
    delete viewerRatings[id];
    await saveCatalog();
    await saveRatings();
    closeModal();
    renderGrid('creator');
  };
  const rateInput = root.querySelector('#rateInput');
  const commitRating = async () => {
    const raw = rateInput.value.replace(',', '.').trim();
    let val = parseFloat(raw);
    let newRating;
    if(raw === '' || isNaN(val)){
      newRating = 0;
      rateInput.value = '';
    } else {
      val = Math.max(0, Math.min(10, val));
      val = Math.round(val * 10) / 10;
      newRating = val;
      rateInput.value = val;
    }
    await loadCatalog();
    const fresh = items.find(x => x.id === it.id);
    if(fresh) fresh.rating = newRating;
    it.rating = newRating;
    await saveCatalog();
    renderGrid('creator');
  };
  rateInput.addEventListener('input', () => {
    const v = parseFloat(rateInput.value.replace(',', '.'));
    rateInput.style.color = ratingColor(isNaN(v) ? 0 : v);
  });
  rateInput.addEventListener('blur', commitRating);
  rateInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ rateInput.blur(); } });
}

/* ---------- VIEWER: rate view ---------- */
function openViewerRate(id){
  const it = items.find(x => x.id === id);
  if(!it) return;
  const episodic = isEpisodic(it.type);

  const loginToRate = document.getElementById('loginToRateBtn');

/* ---------- CREATOR: manage seasons & episodes ---------- */
function openEpisodesManager(it){
  if(!it.seasons) it.seasons = [];
  const root = document.getElementById('modalRoot');

  function draw(){
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="modal">
          <h3>${escapeHtml(it.title)}</h3>
          <div id="seasonsWrap"></div>
          <button class="addSeasonBtn" id="addSeasonBtn">+ Ajouter une saison</button>
          <div class="modalbtns" style="margin-top:18px;">
            <button class="btn ghost" id="closeBtn">Fermer</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') closeModal(); };
    document.getElementById('closeBtn').onclick = closeModal;

    const wrap = document.getElementById('seasonsWrap');
    if(it.seasons.length === 0){
      wrap.innerHTML = `<div class="empty" style="padding:36px 18px;"><div>Aucune saison pour l'instant. Ajoute ta première saison ci-dessous.</div></div>`;
    } else {
      wrap.innerHTML = it.seasons.map(s => `
        <div class="seasonBlock">
          <div class="seasonHead">
            <span class="seasonTitle">Saison ${s.number}</span>
            <button class="delSeasonBtn" data-season="${s.id}">Supprimer la saison ✕</button>
          </div>
          ${(s.episodes||[]).map(e => `
            <div class="epRow">
              <span class="epNum">E${e.number}</span>
              <span class="epLabel">Épisode ${e.number}</span>
              <input type="text" inputmode="decimal" class="epInput" data-season="${s.id}" data-ep="${e.id}"
                style="color:${ratingColor(e.rating)}" value="${e.rating ? e.rating : ''}" placeholder="—">
              <button class="epDel" data-season="${s.id}" data-ep="${e.id}">✕</button>
            </div>
          `).join('')}
          <button class="addEpBtn" data-season="${s.id}">+ Ajouter un épisode</button>
        </div>
      `).join('');
    }

    document.getElementById('addSeasonBtn').onclick = async () => {
      await loadCatalog();
      it = items.find(x => x.id === it.id) || it;
      if(!it.seasons) it.seasons = [];
      const nextNum = it.seasons.length ? Math.max(...it.seasons.map(s => s.number)) + 1 : 1;
      it.seasons.push({id: 'se-' + Math.random().toString(36).slice(2,9), number: nextNum, episodes: []});
      await saveCatalog();
      draw();
    };

    wrap.querySelectorAll('.delSeasonBtn').forEach(b => {
      b.onclick = async () => {
        await loadCatalog();
        it = items.find(x => x.id === it.id) || it;
        const season = it.seasons.find(s => s.id === b.dataset.season);
        (season.episodes||[]).forEach(e => { delete viewerRatings[episodeKey(it.id, season.number, e.number)]; });
        it.seasons = it.seasons.filter(s => s.id !== b.dataset.season);
        await saveCatalog();
        await saveRatings();
        draw();
      };
    });

    wrap.querySelectorAll('.addEpBtn').forEach(b => {
      b.onclick = async () => {
        await loadCatalog();
        it = items.find(x => x.id === it.id) || it;
        const season = it.seasons.find(s => s.id === b.dataset.season);
        if(!season.episodes) season.episodes = [];
        const nextNum = season.episodes.length ? Math.max(...season.episodes.map(e => e.number)) + 1 : 1;
        season.episodes.push({id: 'ep-' + Math.random().toString(36).slice(2,9), number: nextNum, rating: 0});
        await saveCatalog();
        draw();
      };
    });

    wrap.querySelectorAll('.epDel').forEach(b => {
      b.onclick = async () => {
        await loadCatalog();
        it = items.find(x => x.id === it.id) || it;
        const season = it.seasons.find(s => s.id === b.dataset.season);
        const ep = season.episodes.find(e => e.id === b.dataset.ep);
        delete viewerRatings[episodeKey(it.id, season.number, ep.number)];
        season.episodes = season.episodes.filter(e => e.id !== b.dataset.ep);
        await saveCatalog();
        await saveRatings();
        draw();
      };
    });

    wrap.querySelectorAll('.epInput').forEach(inp => {
      const commit = async () => {
        const raw = inp.value.replace(',', '.').trim();
        let val = parseFloat(raw);
        let newVal;
        if(raw === '' || isNaN(val)){
          newVal = 0; inp.value = '';
        } else {
          val = Math.max(0, Math.min(10, val));
          val = Math.round(val * 10) / 10;
          newVal = val; inp.value = val;
        }
        inp.style.color = ratingColor(newVal);
        await loadCatalog();
        it = items.find(x => x.id === it.id) || it;
        const season = it.seasons.find(s => s.id === inp.dataset.season);
        const ep = season.episodes.find(e => e.id === inp.dataset.ep);
        ep.rating = newVal;
        await saveCatalog();
        renderGrid('creator');
      };
      inp.addEventListener('input', () => {
        const v = parseFloat(inp.value.replace(',', '.'));
        inp.style.color = ratingColor(isNaN(v) ? 0 : v);
      });
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', (e) => { if(e.key === 'Enter') inp.blur(); });
    });
  }
  draw();
}

    if(!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (ev) => {
      img.onload = () => {
        const maxW = 320;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const c2 = canvas.getContext('2d');

        c2.imageSmoothingQuality = 'high';
        c2.drawImage(img, 0, 0, canvas.width, canvas.height);
        localAvatar = canvas.toDataURL('image/jpeg', 0.85);

/* ---------- STREAM (lecteur Twitch intégré) ---------- */
let streamViewFromCreator = true;

let watchTimer = null;
let watchLastAttempt = 0;
let watchLoopCount = 0;
let watchMine = null;
let watchBoard = [];

function stopWatchTimer(){
  if(watchTimer){ clearInterval(watchTimer); watchTimer = null; }
}

async function loadWatchMine(){
  watchMine = viewerName ? await kvGet(WATCH_PREFIX + viewerName.toLowerCase()) : null;
}

async function loadWatchBoard(){
  try{
    const { data, error } = await supabaseClient.from('app_data').select('key,value').like('key', WATCH_PREFIX + '%');
    if(error){ console.error('loadWatchBoard', error); return; }
    watchBoard = (data || []).map(r => {
      const k = r.key.slice(WATCH_PREFIX.length);
      const v = r.value || {};
      return {key: k, display: v.display || k, points: v.points || 0, minutes: v.minutes || 0};
    }).filter(r => r.points > 0).sort((x, y) => y.points - x.points);
  }catch(e){ console.error('loadWatchBoard failed', e); }
}

function watchRate(){ return Math.max(1, parseInt(creatorSettings.earnRate, 10) || 5); }

function drawWatchPanel(){
  const barEl = document.getElementById('watchBar');
  const boardEl = document.getElementById('watchBoard');
  if(!barEl || !boardEl) return;
  if(document.activeElement && document.activeElement.id === 'watchRateInput') return;
  const inCreator = streamViewFromCreator;
  const on = !!creatorSettings.earningOn;
  const status = `<span class="watchStatus ${on ? 'on' : ''}">${on ? `Gains actifs · +${watchRate()} ${WATCH_CURRENCY} par minute` : 'Gains en pause'}</span>`;
  let left;
  if(inCreator){
    left = `
      <div class="watchCreator">
        <button class="btn primary" id="watchToggleBtn" style="flex:none;">${on ? 'Arrêter les gains' : 'Activer les gains'}</button>
        <input type="text" inputmode="numeric" id="watchRateInput" value="${watchRate()}" title="${WATCH_CURRENCY} par minute">
        <button class="addbtn" id="watchRateSave">Enregistrer</button>
      </div>`;
  } else if(viewerName){
    left = `
      <div class="watchMine">
        <div class="n">${watchMine ? watchMine.points : 0}</div>
        <div class="l">${WATCH_CURRENCY}</div>
        <div class="m">${watchMine ? watchMine.minutes : 0} min regardées</div>
      </div>`;
  } else {
    left = `
      <div class="watchMine">
        <div class="l">Connecte-toi pour gagner des ${WATCH_CURRENCY}</div>
        <button class="btn primary" id="watchLoginBtn" style="flex:none;">Se connecter</button>
      </div>`;
  }
  const me = viewerName ? viewerName.toLowerCase() : null;
  const board = watchBoard.length ? watchBoard.map((r, i) => `
    <div class="lbRow ${me && r.key === me ? 'me' : ''}">
      <div class="lbRank ${['top1','top2','top3'][i] || ''}">${i + 1}</div>
      <div class="lbName">${escapeHtml(r.display)}</div>
      <div class="lbPts">${r.points} ${WATCH_CURRENCY}</div>
    </div>`).join('') : `<div class="empty" style="padding:24px 16px;"><div>Personne n'a encore de ${WATCH_CURRENCY}.</div></div>`;

  barEl.innerHTML = `<div class="watchBar">${left}${status}</div>`;
  boardEl.innerHTML = `
    <div class="sectionLabel">Classement ${WATCH_CURRENCY}</div>
    ${board}
  `;

  const tb = document.getElementById('watchToggleBtn');
  if(tb) tb.onclick = async () => {
    await loadSettings();
    creatorSettings.earningOn = !creatorSettings.earningOn;
    await saveSettings();
    drawWatchPanel();
  };
  const rs = document.getElementById('watchRateSave');
  if(rs) rs.onclick = async () => {
    const v = Math.max(1, parseInt(document.getElementById('watchRateInput').value, 10) || 5);
    await loadSettings();
    creatorSettings.earnRate = v;
    await saveSettings();
    drawWatchPanel();
  };
  const wl = document.getElementById('watchLoginBtn');
  if(wl) wl.onclick = () => setMode('select');
}

async function watchLoop(){
  if(mode !== 'stream-view'){ stopWatchTimer(); return; }
  if(!streamViewFromCreator) await loadSettings();
  if(mode !== 'stream-view'){ stopWatchTimer(); return; }
  const on = !!creatorSettings.earningOn;
  if(viewerName && !isCreatorAccount && on && document.visibilityState === 'visible' && Date.now() - watchLastAttempt >= 55000){
    watchLastAttempt = Date.now();
    const key = WATCH_PREFIX + viewerName.toLowerCase();
    const rec = (await kvGet(key)) || {points: 0, minutes: 0, lastTick: 0};
    if(Date.now() - (rec.lastTick || 0) >= 50000){
      rec.display = viewerName;
      rec.points = (rec.points || 0) + watchRate();
      rec.minutes = (rec.minutes || 0) + 1;
      rec.lastTick = Date.now();
      await kvSet(key, rec);
    }
    watchMine = rec;
  }
  watchLoopCount++;
  if(watchLoopCount % 4 === 1) await loadWatchBoard();
  drawWatchPanel();
}

async function startWatchTimer(){
  stopWatchTimer();
  watchLastAttempt = 0;
  watchLoopCount = 0;
  await loadWatchMine();
  watchTimer = setInterval(watchLoop, 30000);
  watchLoop();
}

  const inCreator = streamViewFromCreator;
  const channel = (creatorSettings.twitchChannel || '').trim();
  const parent = window.location.hostname || 'localhost';
  const src = channel ? `https://player.twitch.tv/?channel=${encodeURIComponent(channel)}&parent=${encodeURIComponent(parent)}&muted=false` : '';
  const chatSrc = channel ? `https://www.twitch.tv/embed/${encodeURIComponent(channel)}/chat?parent=${encodeURIComponent(parent)}&darkpopout` : '';
  const ch = encodeURIComponent(channel);

  app.innerHTML = `
    <div class="page">
      ${navHtml('stream', inCreator ? 'creator' : 'viewer')}
      <div class="logo" style="margin-bottom:20px;">
        <h1 style="font-size:28px;">STREAM</h1>
      </div>
      ${!channel ? `

}

async function loadCards(){
  const v = await kvGet(CARDS_KEY);
  cardsCatalog = (v && Array.isArray(v.collections) && Array.isArray(v.cards)) ? v : {collections: [], cards: []};
  if(!cardsCatalog.v || cardsCatalog.v < 2){
    cardsCatalog.collections.forEach(c => { c.perPack = CARDS_PER_PACK; });
    cardsCatalog.v = 2;
    if(isCreatorAccount && cardsCatalog.collections.length) await saveCards();
  }
}
async function saveCards(){ await kvSet(CARDS_KEY, cardsCatalog); }

function cardUid(prefix){ return prefix + Math.random().toString(36).slice(2, 10); }
/* une collection « brouillon » (published === false) n'est visible que par le créateur ; les anciennes collections (sans l'indicateur) restent en ligne */
function isPublished(col){ return !!col && col.published !== false; }
function colCards(colId){ return cardsCatalog.cards.filter(c => c.collectionId === colId); }
function ownedMap(holo){ return (watchMine && (holo ? watchMine.holo : watchMine.cards)) || {}; }
function myCardCount(cardId, holo){ return ownedMap(holo)[cardId] || 0; }
function myProgress(colId, holo){
  const cs = colCards(colId);
  return {owned: cs.filter(c => myCardCount(c.id, holo) > 0).length, total: cs.length};
}
function cardValue(card, holo){
  const base = (RARITIES[card.rarity] || RARITIES.commune).value;
  return holo ? base * HOLO_MULT : base;
}
/* ligne de probabilités d'une carte, par position en partant de la fin (1 = dernière carte) */
/* ----- codes cadeaux : le créateur les génère, chaque viewer peut en utiliser un une seule fois ----- */
function normCode(s){ return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function fmtCode(norm){ return norm.length === 8 ? norm.slice(0, 4) + '-' + norm.slice(4) : norm; }
function genCodeNorm(){
  const arr = new Uint32Array(8);
  crypto.getRandomValues(arr);
  return Array.from(arr, v => CODE_ALPHABET[v % CODE_ALPHABET.length]).join('');
}
let codeFails = 0, codeLockUntil = 0;
async function redeemCode(raw){
  if(!viewerName || isCreatorAccount) return {ok: false, msg: 'Connecte-toi pour utiliser un code.'};
  const norm = normCode(raw);
  if(norm.length < 4) return {ok: false, msg: 'Entre ton code.'};
  if(Date.now() < codeLockUntil) return {ok: false, msg: `Trop d'essais, réessaie dans ${Math.ceil((codeLockUntil - Date.now()) / 1000)} s.`};
  const fail = (msg) => { codeFails++; if(codeFails >= 5){ codeLockUntil = Date.now() + 60000; codeFails = 0; } return {ok: false, msg}; };
  const code = await kvGet(CODE_PREFIX + norm);
  if(!code) return fail('Code invalide.');
  if(!code.active) return fail('Ce code a été désactivé.');
  if(Date.now() > code.expiresAt) return {ok: false, msg: 'Ce code a expiré.'};
  const key = WATCH_PREFIX + viewerName.toLowerCase();
  const rec = (await kvGet(key)) || {points: 0, minutes: 0, lastTick: 0};
  rec.redeemed = rec.redeemed || {};
  if(rec.redeemed[norm]) return {ok: false, msg: 'Tu as déjà utilisé ce code.'};
  rec.redeemed[norm] = Date.now();
  rec.freeBoosters = (rec.freeBoosters || 0) + (code.boosters || 0);
  rec.display = viewerName;
  await kvSet(key, rec);
  watchMine = rec;
  codeFails = 0;
  return {ok: true, boosters: code.boosters || 0};
}

function stopDailyTimer(){ if(dailyTimer){ clearInterval(dailyTimer); dailyTimer = null; } }
function dailyEligibleCols(){ return cardsCatalog.collections.filter(c => c.daily !== false && isPublished(c) && colCards(c.id).length > 0); }
function dailyRemainingMs(){
  const at = (watchMine && watchMine.dailyAt) || 0;
  return Math.max(0, at + DAILY_MS - Date.now());
}
function fmtRemaining(ms){
  const m = Math.ceil(ms / 60000);
  const h = Math.floor(m / 60), mm = m % 60;
  return h > 0 ? `${h} h ${String(mm).padStart(2, '0')} min` : `${mm} min`;
}
function dailyTextPlain(){

  const rem = dailyRemainingMs();

}

function rowAtPos(pos){ return SLOT_ODDS[Math.min(Math.max(pos, 1), SLOT_ODDS.length) - 1]; }

/* booster déviant : la progression est étirée proportionnellement sur toutes les cartes.
   La 1re carte garde la ligne la plus faible, la dernière la ligne la meilleure, les autres sont interpolées. */
function stretchedRow(i, n){
  const last = SLOT_ODDS.length - 1;
  const u = n <= 1 ? last : (i / (n - 1)) * last;
  const lo = Math.floor(u), hi = Math.min(last, lo + 1), w = u - lo;
  const a = SLOT_ODDS[last - lo], b = SLOT_ODDS[last - hi];
  const row = {};
  [...RARITY_KEYS, 'holo'].forEach(k => { row[k] = a[k] * (1 - w) + b[k] * w; });
  return row;
}

/* probabilités effectives pour une collection donnée.
   Si une rareté n'existe pas dans la collection, sa part va à la rareté la plus probable de la position. */
function oddsFromRow(row, present){
  const odds = {};
  let missing = 0;
  RARITY_KEYS.forEach(k => { if(present.includes(k)) odds[k] = row[k]; else { odds[k] = 0; missing += row[k]; } });
  if(missing > 0 && present.length){
    const target = present.filter(k => row[k] > 0).sort((a, b) => row[b] - row[a])[0];
    if(target) odds[target] += missing;
    else { const share = 100 / present.length; present.forEach(k => { odds[k] = share; }); }
  }
  return odds;
}
function slotOddsFor(pos, present){ return oddsFromRow(rowAtPos(pos), present); }
function presentRarities(colId){
  const cs = colCards(colId);
  return RARITY_KEYS.filter(k => cs.some(c => c.rarity === k));
}
function fmtPct(x){
  if(!x || x < 0.0001) return '—';
  return (Math.round(x * 100) / 100).toString().replace('.', ',') + ' %';
}
function lastCardOdds(col){
  const odds = slotOddsFor(1, presentRarities(col.id));
  return 'Dernière carte : ' + RARITY_KEYS.filter(k => odds[k] > 0.0001).map(k => `${RARITIES[k].label} ${fmtPct(odds[k])}`).join(' · ');
}
const RARITY_SHORT = {commune: 'Com.', rare: 'Rare', epique: 'Épi.', legendaire: 'Lég.', ultime: 'Ult.'};
function oddsTableHtml(col){
  const present = presentRarities(col.id);
  const rows = [];
  for(let i = 0; i < col.perPack; i++){
    const pos = col.perPack - i;
    const odds = slotOddsFor(pos, present);
    rows.push(`<tr><td>${i + 1}</td>${present.map(k => `<td>${fmtPct(odds[k])}</td>`).join('')}<td>${fmtPct(rowAtPos(pos).holo)}</td></tr>`);
  }
  return `<div class="oddsWrap"><table class="oddsTable"><thead><tr><th title="Numéro de la carte dans le booster">N°</th>${present.map(k => `<th title="${RARITIES[k].label}">${RARITY_SHORT[k]}</th>`).join('')}<th title="Holographique">Holo</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

/* ----- cohérence d'un booster -----
   Trois paliers : Commune < Rare < Épique et mieux. Une fois un palier atteint, les cartes suivantes ne redescendent jamais en dessous
   (plus de « Épique puis Commune »). Les taux de CHAQUE carte restent exactement ceux du tableau : les cartes sont reliées entre elles
   par un couplage (mise à l'échelle de Sinkhorn) qui conserve les taux de chaque position tout en interdisant les retours en arrière. */
const PACK_COHERENCE = 1;       // 1 = tous les boosters cohérents ; 0,7 = 70 % des boosters cohérents, 30 % tirés librement
const RARITY_TIER = {commune: 0, rare: 1, epique: 2, legendaire: 2, ultime: 2};
const coherenceCache = new Map();

function coupleSlots(pa, pb, keys){
  const m = keys.length;
  const ok = (i, j) => RARITY_TIER[keys[j]] >= RARITY_TIER[keys[i]];
  const x = new Array(m).fill(1), y = new Array(m).fill(1);
  for(let it = 0; it < 300; it++){
    for(let i = 0; i < m; i++){ let t = 0; for(let j = 0; j < m; j++) if(ok(i, j)) t += y[j]; x[i] = (pa[i] > 0 && t > 0) ? pa[i] / t : 0; }
    for(let j = 0; j < m; j++){ let t = 0; for(let i = 0; i < m; i++) if(ok(i, j)) t += x[i]; y[j] = (pb[j] > 0 && t > 0) ? pb[j] / t : 0; }
  }
  const P = (i, j) => ok(i, j) ? x[i] * y[j] : 0;
  for(let i = 0; i < m; i++){ let t = 0; for(let j = 0; j < m; j++) t += P(i, j); if(Math.abs(t - pa[i]) > 1e-7) return null; }
  for(let j = 0; j < m; j++){ let t = 0; for(let i = 0; i < m; i++) t += P(i, j); if(Math.abs(t - pb[j]) > 1e-7) return null; }
  return keys.map((_, i) => Object.fromEntries(keys.map((k, j) => [k, pa[i] > 0 ? P(i, j) / pa[i] : 0])));
}
/* noyaux de transition carte -> carte suivante ; null si les taux d'une collection (raretés manquantes) ne permettent pas de couplage */
function coherentKernels(slotOdds, keys, cacheKey){
  if(coherenceCache.has(cacheKey)) return coherenceCache.get(cacheKey);
  let out = [];
  for(let i = 0; i + 1 < slotOdds.length && out; i++){
    const k = coupleSlots(keys.map(r => slotOdds[i][r] / 100), keys.map(r => slotOdds[i + 1][r] / 100), keys);
    if(k) out.push(k); else out = null;
  }
  coherenceCache.set(cacheKey, out);
  return out;
}

/* rareté la plus proche de celle visée, parmi celles qui existent dans la collection (on descend d'abord, puis on monte) */
function bestAvailable(target, present){
  const rank = RARITIES[target].rank;
  const sorted = present.slice().sort((a, b) => RARITIES[a].rank - RARITIES[b].rank);
  const below = sorted.filter(k => RARITIES[k].rank <= rank);
  return below.length ? below[below.length - 1] : sorted[0];
}

/* quel type de booster sort à cette ouverture ? un seul tirage : Gold, Déviant ou normal */
function rollVariant(col){
  const r = Math.random();
  if(r < GOLD_CHANCE) return {type: 'gold', n: GOLD_CARDS, extra: 0};
  if(r < GOLD_CHANCE + DEVIANT_CHANCE){
    const extra = 1 + Math.floor(Math.random() * DEVIANT_MAX_EXTRA);
    return {type: 'deviant', n: col.perPack + extra, extra};
  }
  return {type: 'normal', n: col.perPack, extra: 0};
}

function drawCards(collectionId, n, opts){
  opts = opts || {};
  const pool = colCards(collectionId);
  if(!pool.length) return [];
  const byRarity = {};
  RARITY_KEYS.forEach(k => { byRarity[k] = pool.filter(c => c.rarity === k); });
  const present = RARITY_KEYS.filter(k => byRarity[k].length);
  const pickCard = (rarity) => { const arr = byRarity[rarity]; return arr[Math.floor(Math.random() * arr.length)]; };
  const holoAt = (i) => (opts.stretch ? stretchedRow(i, n) : rowAtPos(n - i)).holo;   // chance d'holo selon la position FINALE de la carte

  if(opts.gold){
    // booster Gold : déjà dans l'ordre (Légendaires puis Ultimes)
    const out = [];
    for(let i = 0; i < n; i++){
      const target = i < n - 2 ? 'legendaire' : (i === n - 2 ? (Math.random() < GOLD_ULTIME_BOOST ? 'ultime' : 'legendaire') : 'ultime');
      out.push({card: pickCard(bestAvailable(target, present)), holo: Math.random() * 100 < holoAt(i)});
    }
    return out;
  }

  // une rareté par carte selon sa position (taux du tableau), reliées entre elles pour que le booster reste cohérent
  const slotOdds = Array.from({length: n}, (_, i) => oddsFromRow(opts.stretch ? stretchedRow(i, n) : rowAtPos(n - i), present));
  const kernels = (PACK_COHERENCE >= 1 || Math.random() < PACK_COHERENCE)
    ? coherentKernels(slotOdds, present, `${present.join('')}|${n}|${opts.stretch ? 's' : 'n'}`) : null;
  const pick = (weights) => {
    const cands = present.filter(k => weights[k] > 0);
    const total = cands.reduce((a, k) => a + weights[k], 0);
    let r = Math.random() * total, rarity = cands[cands.length - 1];
    for(const k of cands){ r -= weights[k]; if(r <= 0){ rarity = k; break; } }
    return rarity;
  };
  const rarities = [];
  for(let i = 0; i < n; i++) rarities.push(i > 0 && kernels ? pick(kernels[i - 1][present.indexOf(rarities[i - 1])]) : pick(slotOdds[i]));
  // cartes choisies dans chaque rareté, holographique tiré selon la position
  return rarities.map((r, i) => ({card: pickCard(r), holo: Math.random() * 100 < holoAt(i)}));
}

function hashHue(str){
  let h = 0; const t = String(str || '');
  for(let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 360;
  return h;
}

/* effet holographique : inclinaison + reflet qui suivent la souris (ou le doigt dans la fiche détaillée) */
let holoActive = null;
const reduceMotionMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : {matches: false};
function holoReset(el){
  if(!el) return;
  ['--rx', '--ry', '--mx', '--my', '--bx', '--by'].forEach(v => el.style.removeProperty(v));
  el.classList.remove('tilting');
}
document.addEventListener('pointermove', (e) => {
  if(reduceMotionMQ.matches) return;
  const el = (e.target && e.target.closest) ? e.target.closest('.tcg.holo') : null;
  if(el !== holoActive){ holoReset(holoActive); holoActive = el; }
  if(!el) return;
  const r = el.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const px = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const py = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  el.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
  el.style.setProperty('--my', (py * 100).toFixed(1) + '%');
  el.style.setProperty('--bx', (px * 100).toFixed(1) + '%');
  el.style.setProperty('--by', (py * 100).toFixed(1) + '%');
  el.style.setProperty('--rx', ((0.5 - py) * 16).toFixed(2) + 'deg');
  el.style.setProperty('--ry', ((px - 0.5) * 20).toFixed(2) + 'deg');
  el.classList.add('tilting');
});
document.addEventListener('pointerup', (e) => { if(e.pointerType && e.pointerType !== 'mouse'){ holoReset(holoActive); holoActive = null; } });
document.addEventListener('mouseleave', () => { holoReset(holoActive); holoActive = null; });

function templateForCollection(col){
  return COLLECTION_TEMPLATES.find(t => t.key === col.tpl)
    || COLLECTION_TEMPLATES.find(t => col.name === t.name || col.name.startsWith(t.name + ' '));
}

async function fillTemplateDescriptions(colId){
  await loadCards();
  const col = cardsCatalog.collections.find(c => c.id === colId);
  let added = 0, completed = 0;
  const tpl = col ? templateForCollection(col) : null;
  if(tpl){
    const have = new Set(colCards(colId).map(c => normName(c.name)));
    RARITY_KEYS.forEach(k => (tpl[k] || []).forEach(it => {
      if(have.has(normName(it.n))) return;
      cardsCatalog.cards.push({id: cardUid('card-'), collectionId: colId, name: it.n, rarity: k, desc: it.d, hue: it.h, image: '', imagePath: ''});
      have.add(normName(it.n));
      added++;
    }));
  }
  const index = {};
  COLLECTION_TEMPLATES.forEach(t => RARITY_KEYS.forEach(k => (t[k] || []).forEach(it => { index[normName(it.n)] = it; })));
  cardsCatalog.cards.filter(c => c.collectionId === colId).forEach(c => {
    const it = index[normName(c.name)];
    if(!it) return;
    let touched = false;
    if(!c.desc){ c.desc = it.d; touched = true; }
    if(c.hue === undefined || c.hue === null || c.hue === ''){ c.hue = it.h; touched = true; }
    if(touched) completed++;
  });
  if(added || completed) await saveCards();
  return {added, completed};
}

async function openBooster(collectionId, opts){
  if(boosterLock) return;
  if(!viewerName || isCreatorAccount) return;
  boosterLock = true;
  try{
    await loadCards();
    const col = cardsCatalog.collections.find(c => c.id === collectionId);
    if(!col || !isPublished(col)) return;
    const key = WATCH_PREFIX + viewerName.toLowerCase();
    const rec = (await kvGet(key)) || {points: 0, minutes: 0, lastTick: 0};
    const isDaily = !!(opts && opts.daily);
    const isVoucher = !!(opts && opts.voucher);
    if(isVoucher){
      if((rec.freeBoosters || 0) <= 0){ watchMine = rec; drawBoosters(); return; }
    } else if(isDaily){
      if(col.daily === false) return;
      if(Date.now() - (rec.dailyAt || 0) < DAILY_MS){ watchMine = rec; drawBoosters(); return; }
    } else if((rec.points || 0) < col.price){ watchMine = rec; drawBoosters(); return; }
    const variant = rollVariant(col);
    const drawn = drawCards(collectionId, variant.n, {gold: variant.type === 'gold', stretch: variant.type === 'deviant'});
    if(!drawn.length) return;
    rec.cards = rec.cards || {};
    rec.holo = rec.holo || {};
    const pulled = drawn.map(({card, holo}) => {
      const map = holo ? rec.holo : rec.cards;
      const had = map[card.id] || 0;
      map[card.id] = had + 1;
      return {card, holo, isNew: had === 0};
    });
    if(isVoucher){ rec.freeBoosters = (rec.freeBoosters || 0) - 1; rec.vouchers = (rec.vouchers || 0) + 1; }
    else if(isDaily){ rec.dailyAt = Date.now(); rec.daily = (rec.daily || 0) + 1; }
    else rec.points = (rec.points || 0) - col.price;
    rec.packs = (rec.packs || 0) + 1;
    if(variant.type === 'gold') rec.gold = (rec.gold || 0) + 1;
    if(variant.type === 'deviant') rec.deviant = (rec.deviant || 0) + 1;
    rec.display = viewerName;
    await kvSet(key, rec);
    watchMine = rec;
    showPackOpening(pulled, col, variant, {daily: isDaily, voucher: isVoucher});
  } finally {
    boosterLock = false;
  }
}

/* effets de révélation (façon coffre Clash Royale) : halo, rayons, anneaux, étincelles, flash et libellé,
   de plus en plus forts avec la rareté. Les cartes Communes n'ont pas d'effet, les holographiques ajoutent des étincelles. */
const REVEAL_FX = {
  rare:       {color: '#3b82f6', sparks: 0,  rings: 0, rays: false, flash: null,                      label: null},
  epique:     {color: '#a855f7', sparks: 16, rings: 1, rays: false, flash: 'rgba(168,85,247,0.30)',  label: 'ÉPIQUE'},
  legendaire: {color: '#f5b301', sparks: 30, rings: 2, rays: true,  flash: 'rgba(255,205,80,0.65)',  label: 'LÉGENDAIRE'},
  ultime:     {color: '#ff5ccd', sparks: 46, rings: 3, rays: true,  flash: 'rgba(255,255,255,0.85)', label: 'ULTIME', rainbow: true}
};

function clearRevealFx(host, overlay){
  if(host) host.innerHTML = '';
  if(overlay) overlay.querySelectorAll('.fxFlash').forEach(e => e.remove());
}

function playRevealFx(host, overlay, p){
  clearRevealFx(host, overlay);
  const cfg = REVEAL_FX[p.card.rarity] || null;
  const holo = !!p.holo;
  if(!cfg && !holo) return;
  const calm = reduceMotionMQ.matches;
  const color = cfg ? cfg.color : '#ffffff';
  const rainbow = !!(cfg && cfg.rainbow);
  const add = (tag, cls, css) => { const el = document.createElement(tag); el.className = cls; if(css) el.style.cssText = css; host.appendChild(el); return el; };
  if(cfg) add('div', 'fxGlow' + (rainbow ? ' rainbow' : ''), `--fx:${color};`);
  if(cfg && cfg.rays && !calm) add('div', 'fxRays' + (rainbow ? ' rainbow' : ''), `--fx:${color};`);
  if(cfg && !calm) for(let i = 0; i < cfg.rings; i++) add('b', 'fxRing', `--fx:${color};--delay:${i * 230}ms;`);
  if(!calm){
    const n = (cfg ? cfg.sparks : 0) + (holo ? 10 : 0);
    for(let i = 0; i < n; i++){
      const hue = Math.round(Math.random() * 360);
      const c = (rainbow || (holo && i >= (cfg ? cfg.sparks : 0))) ? `hsl(${hue},95%,68%)` : color;
      add('i', 'spark', `--a:${(Math.random() * 360).toFixed(1)}deg;--d:${Math.round(150 + Math.random() * 170)}px;--s:${(5 + Math.random() * 9).toFixed(1)}px;--c:${c};--delay:${Math.round(Math.random() * 200)}ms;`);
    }
    if(cfg && cfg.flash){
      const fl = document.createElement('div'); fl.className = 'fxFlash'; fl.style.setProperty('--fx', cfg.flash);
      overlay.appendChild(fl);
      setTimeout(() => fl.remove(), 800);
    }
  }
  const label = cfg && cfg.label ? cfg.label + (holo ? ' · HOLO' : '') : (holo ? 'HOLO' : null);
  if(label) add('div', 'fxLabel' + (rainbow ? ' rainbow' : ''), `--fx:${color};`).textContent = label;
}

      c.style.setProperty('--k', String(Math.min(k, 4)));
      c.style.zIndex = String(200 - k);
      c.style.opacity = k > 3 ? '0' : '';
    });
  };
  const refreshTexts = () => {
    progress.textContent = `Carte ${Math.min(idx + 1, total)} / ${total}`;
    hint.textContent = !revealed ? (charge >= 1 && isGlowy(idx) ? 'Ça brille de plus en plus... touche encore !' : 'Touche la carte pour la révéler')
      : (idx === total - 1 ? 'Touche pour voir le récapitulatif' : 'Touche ou glisse pour passer à la suivante');
    refreshGlow();
    setState();
  };

  const finish = () => {
    if(finished) return;
    finished = true; busy = false;
    clearRevealFx(fxHost, overlay);
    root.querySelector('#deckLayout').style.display = 'none';
    progress.style.display = 'none'; hint.style.display = 'none';
    recap.style.display = '';
    recap.innerHTML = pulled.map((p, i) => `<div class="recapCard" data-i="${i}" data-rarity="${p.card.rarity}" data-holo="${p.holo ? '1' : '0'}">${cardTileHtml(p.card, {isNew: p.isNew, holo: p.holo})}</div>`).join('');
    const nNew = pulled.filter(p => p.isNew).length;
    const nDup = pulled.length - nNew;
    const nHolo = pulled.filter(p => p.holo).length;
    document.getElementById('packSummary').textContent = `${nNew} nouvelle${nNew > 1 ? 's' : ''} carte${nNew > 1 ? 's' : ''} · ${nDup} doublon${nDup > 1 ? 's' : ''}` + (nHolo ? ` · ${nHolo} holographique${nHolo > 1 ? 's' : ''}` : '');
    document.getElementById('revealAllBtn').style.display = 'none';
    const voucherMode = !!(opts && opts.voucher);
    const againOk = isTest || (voucherMode ? (watchMine && (watchMine.freeBoosters || 0) > 0) : (watchMine && (watchMine.points || 0) >= col.price));
    if(againOk){
      const ab = document.getElementById('packAgainBtn');
      ab.style.display = '';
      if(voucherMode && !isTest) ab.textContent = `Ouvrir un autre booster offert (${watchMine.freeBoosters})`;
    }
    setState();
  };

  const reveal = () => {
    if(busy || revealed || finished) return;
    busy = true;
    const top = cards[idx], p = pulled[idx];
    top.classList.remove('glowy', 'lvl1');
    top.classList.add('flipped');
    const rk = (RARITIES[p.card.rarity] || RARITIES.commune).rank;
    setTimeout(() => {
      if(finished) return;
      playRevealFx(fxHost, overlay, p);
      if((rk >= 2 || p.holo) && !reduceMotionMQ.matches) top.classList.add('pop');
    }, 320);
    setTimeout(() => { if(finished) return; revealed = true; busy = false; refreshTexts(); }, 780);
  };

  const makeMini = (p) => {
    const el = document.createElement('div');
    el.className = `miniWrap r-${p.card.rarity}`;
    el.dataset.rarity = p.card.rarity;
    el.innerHTML = cardTileHtml(p.card, {holo: p.holo});
    return el;
  };

  const next = () => {
    if(busy || !revealed || finished) return;
    busy = true;
    const top = cards[idx], p = pulled[idx];
    clearRevealFx(fxHost, overlay);
    top.classList.remove('pop');
    const mini = makeMini(p);
    mini.style.visibility = 'hidden';
    tray.appendChild(mini);
    const base = deckArea.getBoundingClientRect();
    const slot = mini.getBoundingClientRect();
    top.style.transformOrigin = 'top left';
    top.style.transition = 'transform .55s cubic-bezier(.5,0,.25,1), opacity .5s ease .1s';
    top.style.transform = `translate(${slot.left - base.left}px, ${slot.top - base.top}px) scale(${slot.width / base.width})`;
    top.style.opacity = '0.15';
    idx++; revealed = false; charge = 0;
    if(idx < total){ placeStack(); refreshTexts(); }
    setTimeout(() => {
      mini.style.visibility = '';
      top.style.display = 'none';
      if(idx >= total) finish(); else busy = false;
    }, 580);
  };

  const act = () => {
    if(busy || finished) return;
    if(!revealed){
      if(isGlowy(idx) && charge < 1){
        // 1er clic sur une carte brillante : la lumière devient plus forte, la carte reste face cachée
        charge++; busy = true; refreshTexts();
        setTimeout(() => { busy = false; }, 450);
        return;
      }
      reveal();
    } else next();
  };

  /* glisser (souris ou doigt) ou toucher */
  let drag = null;
  deckArea.addEventListener('pointerdown', (e) => {
    if(finished || busy) return;
    drag = {x: e.clientX, dx: 0, moved: false};
    try{ deckArea.setPointerCapture(e.pointerId); }catch(err){}
  });
  deckArea.addEventListener('pointermove', (e) => {
    if(!drag) return;
    drag.dx = e.clientX - drag.x;
    if(Math.abs(drag.dx) > 8) drag.moved = true;
    if(drag.moved && cards[idx]){
      cards[idx].style.transition = 'none';
      cards[idx].style.transform = `translateX(${drag.dx}px) rotate(${drag.dx / 22}deg)`;
    }
  });
  const endDrag = () => {
    if(!drag) return;
    const d = drag; drag = null;
    const c = cards[idx];
    if(c){ c.style.transition = ''; c.style.transform = ''; }
    if(!d.moved || Math.abs(d.dx) > 70) act();
  };
  deckArea.addEventListener('pointerup', endDrag);
  deckArea.addEventListener('pointercancel', () => { drag = null; const c = cards[idx]; if(c){ c.style.transition = ''; c.style.transform = ''; } });

  const onKey = (e) => {
    if(!document.body.contains(overlay)){ document.removeEventListener('keydown', onKey); return; }
    if(e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      if(finished) return;
      e.preventDefault(); act();
    }
  };
  document.addEventListener('keydown', onKey);

  document.getElementById('revealAllBtn').onclick = finish;
  const closeIt = () => { document.removeEventListener('keydown', onKey); closeModal(); if(mode === 'boosters') drawBoosters(); };
  document.getElementById('packCloseBtn').onclick = closeIt;
  document.getElementById('packAgainBtn').onclick = () => { document.removeEventListener('keydown', onKey); closeModal(); if(isTest) openTestBooster(col.id); else if(opts && opts.voucher) openBooster(col.id, {voucher: true}); else openBooster(col.id); };

  placeStack();
  refreshTexts();
}

function recycleValue(colId){
  let sum = 0;
  colCards(colId).forEach(c => {
    [false, true].forEach(h => {
      const n = myCardCount(c.id, h);
      if(n > 1) sum += (n - 1) * cardValue(c, h);
    });
  });
  return sum;
}

async function recycleDuplicates(colId){
  if(!viewerName || isCreatorAccount) return;
  const key = WATCH_PREFIX + viewerName.toLowerCase();
  const rec = (await kvGet(key)) || {points: 0, minutes: 0, lastTick: 0};
  rec.cards = rec.cards || {};
  rec.holo = rec.holo || {};
  let gain = 0;
  colCards(colId).forEach(c => {
    [false, true].forEach(h => {
      const map = h ? rec.holo : rec.cards;
      const n = map[c.id] || 0;
      if(n > 1){ gain += (n - 1) * cardValue(c, h); map[c.id] = 1; }
    });
  });
  if(!gain) return;
  rec.points = (rec.points || 0) + gain;
  rec.display = viewerName;
  await kvSet(key, rec);
  watchMine = rec;
  drawBoosters();
}

async function loadCollectors(){

    allCollectors = (data || []).map(r => {

      const holo = v.holo || {};
      const ids = new Set([...Object.keys(cards), ...Object.keys(holo)]);
      const total = Object.values(cards).reduce((a, b) => a + b, 0) + Object.values(holo).reduce((a, b) => a + b, 0);

}

/* ===== boutique du jour : 6 cartes tirées au hasard, identiques pour tout le monde, renouvelées chaque jour à minuit (heure de Paris) ===== */
const SHOP_SLOTS = ['commune', 'commune', 'rare', 'rare', 'epique', 'top'];       // le dernier emplacement est la « belle carte » du jour
const SHOP_TOP_ODDS = {legendaire: 0.7, epique: 0.2, ultime: 0.1};
const SHOP_HOLO_CHANCE = 0.2;                                                    // chance qu'une offre (Rare et au-dessus) soit holographique, prix x3
const SHOP_DEFAULT_PRICES = {commune: 30, rare: 120, epique: 450, legendaire: 2500, ultime: 8000};
function shopPrices(){
  const p = (creatorSettings && creatorSettings.shopPrices) || {};
  return Object.fromEntries(RARITY_KEYS.map(k => [k, Math.max(1, parseInt(p[k], 10) || SHOP_DEFAULT_PRICES[k])]));
}
const parisFmt = new Intl.DateTimeFormat('en-CA', {timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'});
function parisParts(ms){ const o = {}; parisFmt.formatToParts(new Date(ms === undefined ? Date.now() : ms)).forEach(p => { o[p.type] = p.value; }); return o; }
function shopDayKey(ms){ const o = parisParts(ms); return `${o.year}-${o.month}-${o.day}`; }
function shopResetInMs(ms){ const o = parisParts(ms); return (86400 - (parseInt(o.hour, 10) * 3600 + parseInt(o.minute, 10) * 60 + parseInt(o.second, 10))) * 1000; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function strSeed(str){ let h = 2166136261; for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* même jour + même catalogue = mêmes offres pour tous les viewers (tirage « graine » : aucun serveur nécessaire) */
function generateShop(dayKey){
  const ok = new Set(cardsCatalog.collections.filter(isPublished).map(c => c.id));
  const pool = cardsCatalog.cards.filter(c => ok.has(c.collectionId)).sort((a, b) => a.id < b.id ? -1 : 1);
  if(!pool.length) return [];
  const rnd = mulberry32(strSeed('kutsu-shop|' + dayKey));
  const prices = shopPrices();
  const present = RARITY_KEYS.filter(k => pool.some(c => c.rarity === k));
  const used = new Set(), offers = [];
  SHOP_SLOTS.forEach((slot, i) => {
    let rarity = slot;
    if(slot === 'top'){
      let r = rnd(); rarity = 'epique';
      for(const k of Object.keys(SHOP_TOP_ODDS)){ r -= SHOP_TOP_ODDS[k]; if(r <= 0){ rarity = k; break; } }
    }
    rarity = bestAvailable(rarity, present);
    const holo = i >= 2 && rnd() < SHOP_HOLO_CHANCE;
    let list = pool.filter(c => c.rarity === rarity && !used.has(c.id + (holo ? 'h' : 'n')));
    if(!list.length) list = pool.filter(c => c.rarity === rarity);
    const card = list[Math.floor(rnd() * list.length)];
    used.add(card.id + (holo ? 'h' : 'n'));
    offers.push({slot: i, cardId: card.id, holo, rarity: card.rarity, price: prices[card.rarity] * (holo ? HOLO_MULT : 1)});
  });
  return offers;
}

/* achat : tout se passe dans la ligne du viewer (une offre ne s'achète qu'une fois par viewer et par jour) */
async function buyShopOffer(dayKey, slot){
  if(!viewerName || isCreatorAccount) return {ok: false, msg: 'Connecte-toi avec un compte viewer.'};
  if(dayKey !== shopDayKey()) return {ok: false, msg: 'La boutique vient d\'être renouvelée : recharge la page.'};
  const o = generateShop(dayKey)[slot];
  if(!o) return {ok: false, msg: 'Offre introuvable.'};
  const key = WATCH_PREFIX + viewerName.toLowerCase();
  const rec = (await kvGet(key)) || {points: 0, minutes: 0, lastTick: 0};
  rec.shopBought = rec.shopBought || {};
  if(rec.shopBought[dayKey] && rec.shopBought[dayKey][slot]) return {ok: false, msg: "Tu as déjà acheté cette carte aujourd'hui."};
  if((rec.points || 0) < o.price) return {ok: false, msg: `Il te manque ${o.price - (rec.points || 0)} ${WATCH_CURRENCY}.`};
  rec.points -= o.price;
  bumpCard(rec, o.cardId, o.holo, 1);
  rec.shopBought[dayKey] = Object.assign({}, rec.shopBought[dayKey], {[slot]: true});
  Object.keys(rec.shopBought).sort().slice(0, -3).forEach(k => { delete rec.shopBought[k]; });     // on ne garde que les 3 derniers jours
  rec.display = viewerName;
  await kvSet(key, rec);
  watchMine = rec;
  return {ok: true, card: cardsCatalog.cards.find(c => c.id === o.cardId), holo: o.holo, price: o.price};
}

        return;
      }
      b.disabled = true; b.textContent = 'Achat...';
      const r = await buyShopOffer(dayKey, parseInt(b.dataset.shopbuy, 10));
      shopNote = r.ok ? `Carte achetée : ${r.card.name}${r.holo ? ' (holo)' : ''} pour ${r.price} ${WATCH_CURRENCY}.` : '';
      drawBoostersShop(document.getElementById('boostersBody')).then(() => { if(!r.ok){ const m = document.getElementById('shopMsg'); if(m){ m.style.color = 'var(--rate-red)'; m.textContent = r.msg; } } });
    };
  });
  const sv = document.getElementById('shopPriceSave');
  if(sv) sv.onclick = async () => {
    await loadSettings();
    creatorSettings.shopPrices = Object.fromEntries(RARITY_KEYS.map(k => [k, Math.max(1, parseInt(document.getElementById('shopPrice-' + k).value, 10) || SHOP_DEFAULT_PRICES[k])]));
    await saveSettings();
    drawBoostersShop(document.getElementById('boostersBody')).then(() => { const m = document.getElementById('shopPriceMsg'); if(m){ m.style.color = 'var(--rate-green)'; m.textContent = 'Prix enregistrés.'; } });
  };
}

/* ===== échanges : un viewer propose un échange de doublons à un autre, carte contre carte (même rareté, même version) ===== */
const TRADE_PREFIX = 'trade:';
const TRADE_MAX_OPEN = 5;
const TRADE_TTL = 7 * 24 * 3600 * 1000;
const TRADE_STATUS = {open: 'En attente', accepted: 'Acceptée', refused: 'Refusée', cancelled: 'Annulée', expired: 'Expirée'};

function bumpCard(rec, cardId, holo, delta){
  const m = holo ? (rec.holo = rec.holo || {}) : (rec.cards = rec.cards || {});
  m[cardId] = Math.max(0, (m[cardId] || 0) + delta);
  if(!m[cardId]) delete m[cardId];
}
async function loadTrades(){
  try{
    const { data, error } = await supabaseClient.from('app_data').select('key,value').like('key', TRADE_PREFIX + '%');
    if(error){ console.error('loadTrades', error); return; }
    tradeAll = (data || []).map(r => r.value).filter(v => v && v.id);
  }catch(e){ console.error('loadTrades failed', e); }
}
function tradeExpired(t){ return t.status === 'open' && Date.now() - (t.createdAt || 0) > TRADE_TTL; }
function dupList(rec){
  const out = [];
  [false, true].forEach(h => {
    const m = (h ? rec.holo : rec.cards) || {};
    Object.keys(m).forEach(id => {
      if(m[id] < 2) return;
      const card = cardsCatalog.cards.find(c => c.id === id);
      if(card && isPublished(cardsCatalog.collections.find(k => k.id === card.collectionId))) out.push({card, holo: h, count: m[id]});
    });
  });
  return out.sort((a, b) => (RARITIES[b.card.rarity].rank - RARITIES[a.card.rarity].rank) || a.card.name.localeCompare(b.card.name));
}

/* proposition : la carte donnée part en séquestre dans la proposition (elle revient si l'échange est refusé, annulé ou expire) */
async function createTrade(to, give, want){
  if(!viewerName || isCreatorAccount) return {ok: false, msg: 'Connecte-toi avec un compte viewer.'};
  const me = viewerName.toLowerCase(), key = WATCH_PREFIX + me;
  if(!to || to.key === me) return {ok: false, msg: 'Choisis un autre viewer.'};
  const cg = cardsCatalog.cards.find(c => c.id === give.cardId), cw = cardsCatalog.cards.find(c => c.id === want.cardId);
  if(!cg || !cw) return {ok: false, msg: 'Carte introuvable.'};
  if(!isPublished(cardsCatalog.collections.find(k => k.id === cg.collectionId)) || !isPublished(cardsCatalog.collections.find(k => k.id === cw.collectionId))) return {ok: false, msg: "Cette carte n'est pas échangeable."};
  if(cg.rarity !== cw.rarity || !!give.holo !== !!want.holo) return {ok: false, msg: 'Un échange se fait entre deux cartes de même rareté et de même version (normale ou holographique).'};
  await loadTrades();
  if(tradeAll.filter(t => t.fromKey === me && t.status === 'open' && !tradeExpired(t)).length >= TRADE_MAX_OPEN) return {ok: false, msg: `Tu as déjà ${TRADE_MAX_OPEN} échanges en attente.`};
  const rec = (await kvGet(key)) || {points: 0, minutes: 0, lastTick: 0};
  if(recCount(rec, give.cardId, !!give.holo) < 2) return {ok: false, msg: 'Tu ne peux échanger que des doublons (il te faut au moins 2 exemplaires).'};
  bumpCard(rec, give.cardId, !!give.holo, -1);
  rec.display = viewerName;
  await kvSet(key, rec);
  const id = cardUid('tr-');
  const trade = {id, fromKey: me, from: viewerName, toKey: to.key, to: to.display, give: {cardId: give.cardId, holo: !!give.holo}, want: {cardId: want.cardId, holo: !!want.holo}, status: 'open', createdAt: Date.now()};
  await kvSet(TRADE_PREFIX + id, trade);
  if(!(await kvGet(TRADE_PREFIX + id))){
    const r2 = (await kvGet(key)) || rec;
    bumpCard(r2, give.cardId, !!give.holo, 1);
    await kvSet(key, r2);
    watchMine = r2;
    return {ok: false, msg: "La proposition n'a pas pu être enregistrée (ta carte t'a été rendue). Le créateur doit exécuter le script schema-boosters.sql dans Supabase."};
  }
  watchMine = rec;
  return {ok: true, trade};
}

/* acceptation : on réserve l'échange, on vérifie après un court délai qu'il n'a pas été annulé, puis on échange nos cartes */
async function acceptTrade(id){
  if(!viewerName || isCreatorAccount) return {ok: false, msg: 'Connecte-toi avec un compte viewer.'};
  const me = viewerName.toLowerCase(), key = WATCH_PREFIX + me;
  const t = await kvGet(TRADE_PREFIX + id);
  if(!t || t.toKey !== me || t.status !== 'open') return {ok: false, msg: "Cet échange n'est plus disponible."};
  if(tradeExpired(t)) return {ok: false, msg: 'Cet échange a expiré.'};
  const rec0 = (await kvGet(key)) || {};
  if(recCount(rec0, t.want.cardId, t.want.holo) < 2) return {ok: false, msg: 'Il te faut au moins 2 exemplaires de la carte demandée.'};
  const nonce = cardUid('n-');
  await kvSet(TRADE_PREFIX + id, Object.assign({}, t, {status: 'accepted', claimId: nonce, resolvedAt: Date.now()}));
  await sleepMs(450 + Math.random() * 350);
  const t2 = await kvGet(TRADE_PREFIX + id);
  if(!t2 || t2.status !== 'accepted' || t2.claimId !== nonce) return {ok: false, msg: "Cet échange n'est plus disponible (il vient d'être annulé)."};
  const rec = (await kvGet(key)) || {points: 0, minutes: 0, lastTick: 0};
  if(recCount(rec, t.want.cardId, t.want.holo) < 2){ await kvSet(TRADE_PREFIX + id, t); return {ok: false, msg: 'Il te faut au moins 2 exemplaires de la carte demandée.'}; }
  bumpCard(rec, t.want.cardId, t.want.holo, -1);
  bumpCard(rec, t.give.cardId, t.give.holo, 1);
  rec.tradesDone = (rec.tradesDone || 0) + 1;
  rec.display = viewerName;
  await kvSet(key, rec);
  watchMine = rec;
  return {ok: true, trade: t};
}
async function refuseTrade(id){
  if(!viewerName || isCreatorAccount) return {ok: false, msg: 'Connecte-toi avec un compte viewer.'};
  const t = await kvGet(TRADE_PREFIX + id);
  if(!t || t.toKey !== viewerName.toLowerCase() || t.status !== 'open') return {ok: false, msg: "Cet échange n'est plus disponible."};
  await kvSet(TRADE_PREFIX + id, Object.assign({}, t, {status: 'refused', resolvedAt: Date.now()}));
  return {ok: true};
}
async function cancelTrade(id){
  if(!viewerName || isCreatorAccount) return {ok: false, msg: 'Connecte-toi avec un compte viewer.'};
  const me = viewerName.toLowerCase(), key = WATCH_PREFIX + me;
  const t = await kvGet(TRADE_PREFIX + id);
  if(!t || t.fromKey !== me || t.status !== 'open') return {ok: false, msg: "Cet échange n'est plus en attente."};
  await kvSet(TRADE_PREFIX + id, Object.assign({}, t, {status: 'cancelled', resolvedAt: Date.now()}));
  await sleepMs(450 + Math.random() * 350);
  const t2 = await kvGet(TRADE_PREFIX + id);
  if(t2 && t2.status === 'accepted') return {ok: false, msg: "Trop tard : l'échange vient d'être accepté."};
  if(!t2 || (t2.status !== 'cancelled' && t2.status !== 'refused')) return {ok: false, msg: "Impossible d'annuler pour l'instant."};
  const rec = (await kvGet(key)) || {points: 0, minutes: 0, lastTick: 0};
  bumpCard(rec, t.give.cardId, t.give.holo, 1);
  rec.tradesClaimed = Object.assign({}, rec.tradesClaimed, {[id]: Date.now()});
  rec.display = viewerName;
  await kvSet(key, rec);
  watchMine = rec;
  return {ok: true};
}
/* le proposeur récupère le résultat de ses propositions la prochaine fois qu'il ouvre le site (une seule fois par échange) */
async function claimTrades(){
  if(!viewerName || isCreatorAccount) return {note: ''};
  const me = viewerName.toLowerCase(), key = WATCH_PREFIX + me;
  const mine = tradeAll.filter(t => t.fromKey === me);
  if(!mine.length) return {note: ''};
  const rec = (await kvGet(key)) || {points: 0, minutes: 0, lastTick: 0};
  rec.tradesClaimed = rec.tradesClaimed || {};
  const got = [], back = [];
  for(const t of mine){
    if(rec.tradesClaimed[t.id]) continue;
    let st = t.status;
    if(st === 'open' && tradeExpired(t)){
      await kvSet(TRADE_PREFIX + t.id, Object.assign({}, t, {status: 'expired', resolvedAt: Date.now()}));
      await sleepMs(450 + Math.random() * 350);
      const t2 = await kvGet(TRADE_PREFIX + t.id);
      if(!t2 || t2.status !== 'expired') continue;
      st = 'expired';
    }
    if(st === 'accepted'){ bumpCard(rec, t.want.cardId, t.want.holo, 1); rec.tradesClaimed[t.id] = Date.now(); got.push(t); }
    else if(st === 'refused' || st === 'cancelled' || st === 'expired'){ bumpCard(rec, t.give.cardId, t.give.holo, 1); rec.tradesClaimed[t.id] = Date.now(); back.push(t); }
  }
  if(!got.length && !back.length) return {note: ''};
  rec.tradesDone = (rec.tradesDone || 0) + got.length;
  rec.display = viewerName;
  await kvSet(key, rec);
  watchMine = rec;
  const nm = (ref) => { const c = cardsCatalog.cards.find(x => x.id === ref.cardId); return (c ? c.name : '?') + (ref.holo ? ' (holo)' : ''); };
  const parts = [];
  got.forEach(t => parts.push(`${t.to} a accepté ton échange : tu reçois ${nm(t.want)} contre ${nm(t.give)}.`));
  if(back.length) parts.push(`${back.length} carte${back.length > 1 ? 's' : ''} de tes propositions non conclues ${back.length > 1 ? 'sont revenues' : 'est revenue'} dans ta collection.`);
  return {note: parts.join(' ')};
}

/* ----- test des boosters (créateur) : gratuit, rien n'est enregistré ----- */
let testVariant = 'random';
let testExtra = 0;
let testSimN = 1000;
let testOwned = {cards: {}, holo: {}};

function pickTestVariant(col){
  if(testVariant === 'gold') return {type: 'gold', n: GOLD_CARDS, extra: 0};
  if(testVariant === 'deviant'){
    const extra = testExtra || (1 + Math.floor(Math.random() * DEVIANT_MAX_EXTRA));
    return {type: 'deviant', n: col.perPack + extra, extra};
  }
  if(testVariant === 'normal') return {type: 'normal', n: col.perPack, extra: 0};
  return rollVariant(col);
}

async function openTestBooster(collectionId){
  if(!isCreatorAccount || boosterLock) return;
  boosterLock = true;
  try{
    await loadCards();
    const col = cardsCatalog.collections.find(c => c.id === collectionId);
    if(!col) return;
    const variant = pickTestVariant(col);
    const drawn = drawCards(collectionId, variant.n, {gold: variant.type === 'gold', stretch: variant.type === 'deviant'});
    if(!drawn.length) return;
    const pulled = drawn.map(({card, holo}) => {
      const map = holo ? testOwned.holo : testOwned.cards;
      const had = map[card.id] || 0;
      map[card.id] = had + 1;
      return {card, holo, isNew: had === 0};
    });
    showPackOpening(pulled, col, variant, {test: true});
  } finally {
    boosterLock = false;
  }
}

async function simulateBoosters(colId, N, onProgress){
  const col = cardsCatalog.collections.find(c => c.id === colId);
  const cnt = {commune: 0, rare: 0, epique: 0, legendaire: 0, ultime: 0};
  const holoCnt = {commune: 0, rare: 0, epique: 0, legendaire: 0, ultime: 0};
  let cards = 0, holo = 0, gold = 0, dev = 0, withLeg = 0, withUlt = 0, withHolo = 0, value = 0;
  const CHUNK = 4000;
  for(let done = 0; done < N; done += CHUNK){
    const end = Math.min(N, done + CHUNK);
    for(let i = done; i < end; i++){
      const v = rollVariant(col);
      if(v.type === 'gold') gold++; else if(v.type === 'deviant') dev++;
      const pack = drawCards(colId, v.n, {gold: v.type === 'gold', stretch: v.type === 'deviant'});
      let leg = false, ult = false, hol = false;
      pack.forEach(x => {
        cnt[x.card.rarity]++; cards++;
        if(x.holo){ holo++; holoCnt[x.card.rarity]++; hol = true; }
        if(x.card.rarity === 'legendaire') leg = true;
        if(x.card.rarity === 'ultime') ult = true;
        value += cardValue(x.card, x.holo);
      });
      if(leg) withLeg++; if(ult) withUlt++; if(hol) withHolo++;
    }
    if(onProgress) onProgress(end / N);
    await new Promise(r => setTimeout(r, 0));
  }
  return {N, cards, cnt, holoCnt, holo, gold, dev, withLeg, withUlt, withHolo, avgValue: value / N, price: col.price};
}

/* ----- codes cadeaux (créateur) : génération, liste, désactivation ----- */
let codeStatusTimer = null;
async function loadCodeList(){
  let list = [], uses = {};
  try{
    const r1 = await supabaseClient.from('app_data').select('key,value').like('key', CODE_PREFIX + '%');
    list = ((r1 && r1.data) || []).map(r => r.value).filter(v => v && v.norm).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 30);
    const r2 = await supabaseClient.from('app_data').select('key,value').like('key', WATCH_PREFIX + '%');
    ((r2 && r2.data) || []).forEach(row => {
      const red = (row.value && row.value.redeemed) || {};
      Object.keys(red).forEach(n => { uses[n] = (uses[n] || 0) + 1; });
    });
  }catch(e){ console.error('loadCodeList', e); }
  return {list, uses};
}

async function createCode(boosters, durMs, customRaw){
  const now = Date.now();
  let norm = '';
  if(customRaw && customRaw.trim()){
    norm = normCode(customRaw);
    if(norm.length < 4) return {ok: false, msg: 'Le code personnalisé doit faire au moins 4 caractères (lettres et chiffres).'};
    if(await kvGet(CODE_PREFIX + norm)) return {ok: false, msg: 'Ce code existe déjà, choisis-en un autre.'};
  } else {
    for(let i = 0; i < 6 && !norm; i++){
      const c = genCodeNorm();
      if(!(await kvGet(CODE_PREFIX + c))) norm = c;
    }
    if(!norm) return {ok: false, msg: "Impossible de générer un code, réessaie."};
  }
  // les codes générés s'affichent « XXXX-XXXX » ; un code personnalisé s'affiche tel que tu l'as choisi (sans séparateur)
  const rec = {code: (customRaw && customRaw.trim()) ? norm : fmtCode(norm), norm, boosters, createdAt: now, expiresAt: now + durMs, durationMs: durMs, active: true};
  await kvSet(CODE_PREFIX + norm, rec);
  const back = await kvGet(CODE_PREFIX + norm);
  if(!back || back.createdAt !== now) return {ok: false, msg: "Le code n'a pas pu être enregistré : exécute le script schema-boosters.sql dans Supabase (autorisation d'écriture des codes), puis réessaie."};
  return {ok: true, code: rec};
}

function codeStatusText(c){
  if(!c.active) return 'Désactivé';
  const rem = (c.expiresAt || 0) - Date.now();
  return rem > 0 ? `Actif · expire dans ${fmtRemaining(rem)}` : 'Expiré';
}

function blobToDataURL(blob){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(new Error('Lecture impossible'));
    fr.readAsDataURL(blob);
  });
}

/* ----- gestion (créateur) ----- */
function normName(s){ return stripAccents(String(s || '').toLowerCase()).replace(/[^a-z0-9]/g, ''); }

function parseRarity(t){
  const n = stripAccents((t || '').toLowerCase()).trim();
  if(n.startsWith('u')) return 'ultime';
  if(n.startsWith('l')) return 'legendaire';
  if(n.startsWith('e')) return 'epique';
  if(n.startsWith('r')) return 'rare';
  return 'commune';
}

function matchCardByFile(fileName, cards){
  const f = normName(fileName.replace(/\.[^.]+$/, ''));
  if(!f) return null;
  const exact = cards.find(c => normName(c.name) === f);
  if(exact) return exact;
  const cands = cards.filter(c => {
    const n = normName(c.name);
    return n.length >= 3 && (f.includes(n) || (f.length >= 4 && n.includes(f)));
  });
  cands.sort((a, b) => normName(b.name).length - normName(a.name).length);
  return cands[0] || null;
}

function resizeImageToBlob(file, maxSide = 800, quality = 0.85, type = 'image/jpeg'){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error('Conversion impossible')), type, quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image illisible')); };
    img.src = url;
  });
}

async function uploadCardImage(card, file){
  const blob = await resizeImageToBlob(file, 800, 0.85);
  const path = `cards/${card.id}-${Date.now()}.jpg`;
  const { error } = await supabaseClient.storage.from(BT_BUCKET).upload(path, blob, {contentType: 'image/jpeg', upsert: true});
  if(error) throw new Error(error.message);
  const { data } = supabaseClient.storage.from(BT_BUCKET).getPublicUrl(path);
  if(card.imagePath){ try{ await supabaseClient.storage.from(BT_BUCKET).remove([card.imagePath]); }catch(e){} }
  card.image = data.publicUrl;
  card.imagePath = path;
}

async function uploadPackImage(col, file){
  const blob = await resizeImageToBlob(file, 900, 0.9, 'image/webp');   // webp/png : la transparence de l'image est conservée
  const ext = blob.type === 'image/webp' ? 'webp' : (blob.type === 'image/png' ? 'png' : 'jpg');
  const path = `packs/${col.id}-${Date.now()}.${ext}`;
  const { error } = await supabaseClient.storage.from(BT_BUCKET).upload(path, blob, {contentType: blob.type, upsert: true});
  if(error) throw new Error(error.message);
  const { data } = supabaseClient.storage.from(BT_BUCKET).getPublicUrl(path);
  if(col.packImagePath){ try{ await supabaseClient.storage.from(BT_BUCKET).remove([col.packImagePath]); }catch(e){} }
  col.packImage = data.publicUrl;
  col.packImagePath = path;
}
